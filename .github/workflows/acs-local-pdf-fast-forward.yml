# Only manually dispatch this workflow from the protected default branch.
# One-shot fast-forward of an isolated local PDF benchmark worktree.
# It never runs the parser or reads private PDF data.
name: ACS Windows PDF worktree fast-forward

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: acs-windows-pdf-local-ownership
  cancel-in-progress: false

jobs:
  fast_forward:
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 10
    steps:
      - name: Pinned fast-forward preserving existing untracked audit data
        shell: powershell
        env:
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: 'Never'
          GIT_NO_REPLACE_OBJECTS: '1'
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') { throw 'WINDOWS_RUNNER_REQUIRED' }

          # ASCII-only for Windows PowerShell 5.1. See PR #82.
          $rootName = -join ([char[]]@(0x6240, 0x6709, 0x9879, 0x76EE))
          $root = Join-Path (Join-Path 'D:\' $rootName) '90_Worktrees'
          $wt = Join-Path $root 'AI-Cognitive-Studio-pdf-parser-benchmark'
          $allowedUntracked = '?? .mimosa/'
          $expectedBranch = 'codex/pdf-parser-benchmark'
          $expectedLocal = 'cb98b8fc7d68c46622aebd3bebf957b295ba6d67'
          $expectedTarget = '7fed4c65b969b4e7625069860cf1a6dfd9dc92d6'
          $allowedRemote = @(
            'https://github.com/ljjnb666-nb/AI-Cognitive-Studio.git',
            'https://github.com/ljjnb666-nb/AI-Cognitive-Studio',
            'git@github.com:ljjnb666-nb/AI-Cognitive-Studio.git',
            'git@github.com:ljjnb666-nb/AI-Cognitive-Studio'
          )

          if (-not (Test-Path -LiteralPath $wt -PathType Container)) { throw 'WORKTREE_NOT_FOUND' }
          $gitCmd = Get-Command 'git.exe' -ErrorAction Stop
          if ($gitCmd.CommandType -ne 'Application') { throw 'GIT_EXECUTABLE_REQUIRED' }
          $git = $gitCmd.Source

          function Git-Read([string[]]$GitArguments) {
            $lines = @(& $git --no-optional-locks -c core.fsmonitor=false -c core.untrackedCache=false -C $wt @GitArguments 2>$null)
            if ($LASTEXITCODE -ne 0) { throw 'GIT_READ_FAILED' }
            return $lines
          }
          function Git-Write([string[]]$GitArguments) {
            $null = @(& $git -c core.hooksPath=NUL -c core.fsmonitor=false -c submodule.recurse=false -C $wt @GitArguments 2>$null)
            if ($LASTEXITCODE -ne 0) { throw 'GIT_SAFE_SYNC_COMMAND_FAILED' }
          }
          function Assert-Identity([string]$ExpectedHead) {
            $b = @(Git-Read -GitArguments @('symbolic-ref', '--quiet', '--short', 'HEAD'))
            $h = @(Git-Read -GitArguments @('rev-parse', '--verify', 'HEAD'))
            if ($b.Count -ne 1 -or $h.Count -ne 1 -or $b[0] -cne $expectedBranch -or $h[0] -cne $ExpectedHead) {
              throw 'LOCAL_GIT_OWNERSHIP_OR_HEAD_MISMATCH'
            }
          }
          function Assert-Status {
            $statuses = @(Git-Read -GitArguments @('status', '--porcelain=v1', '--untracked-files=normal'))
            $unexpected = @($statuses | Where-Object { $_ -cne $allowedUntracked })
            if ($unexpected.Count -ne 0) { throw 'UNEXPECTED_WORKTREE_CHANGES' }
            return @($statuses)
          }
          function Assert-Host {
            $c = [System.IO.DriveInfo]::new('C')
            $d = [System.IO.DriveInfo]::new('D')
            if (-not $c.IsReady -or -not $d.IsReady -or $c.AvailableFreeSpace -lt 15GB -or $d.AvailableFreeSpace -lt 30GB) {
              throw 'DISK_RESOURCE_GATE_BLOCKED'
            }
          }

          Assert-Identity $expectedLocal
          $origin = @(Git-Read -GitArguments @('remote', 'get-url', 'origin'))
          if ($origin.Count -ne 1 -or $origin[0] -cnotin $allowedRemote) { throw 'UNTRUSTED_ORIGIN_URL' }

          $beforeStatus = @(Assert-Status)
          $mimosaWasPresent = ($beforeStatus -ccontains $allowedUntracked)
          $mimosaPath = Join-Path $wt '.mimosa'
          if ($mimosaWasPresent -and (-not (Test-Path -LiteralPath $mimosaPath -PathType Container))) {
            throw 'MIMOSA_DIRECTORY_CHANGED'
          }
          if ($mimosaWasPresent) {
            $dir = Get-Item -LiteralPath $mimosaPath -Force -ErrorAction Stop
            if (($dir.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'MIMOSA_REPARSE_POINT_BLOCKED' }
          }
          Assert-Host

          # Mutates local Git object/ref metadata, but not tracked working files.
          # No token embedded in commands; existing user credential required.
          Git-Write -GitArguments @('fetch', '--quiet', '--no-tags', '--no-recurse-submodules', 'origin', 'refs/heads/codex/pdf-parser-benchmark')

          $fetched = @(Git-Read -GitArguments @('rev-parse', '--verify', 'FETCH_HEAD'))
          if ($fetched.Count -ne 1 -or $fetched[0] -cne $expectedTarget) { throw 'FETCH_HEAD_NOT_PINNED' }
          $conflict = @(Git-Read -GitArguments @('ls-tree', '-r', '--name-only', $expectedTarget, '--', '.mimosa'))
          if ($conflict.Count -ne 0) { throw 'MIMOSA_TRACKED_TARGET_COLLISION' }

          # Ancestry check without trusting stale local origin tracking refs.
          $null = @(& $git --no-optional-locks -C $wt 'merge-base' '--is-ancestor' $expectedLocal $expectedTarget 2>$null)
          if ($LASTEXITCODE -ne 0) { throw 'NON_FAST_FORWARD_TARGET' }
          Assert-Identity $expectedLocal
          $null = @(Assert-Status)
          Assert-Host

          # Only working-tree mutation: trusted, pinned, fast-forward-only merge.
          # No clean/reset/checkout/force, and no submodule update.
          Git-Write -GitArguments @('merge', '--ff-only', '--no-edit', $expectedTarget)

          Assert-Identity $expectedTarget
          $afterStatus = @(Assert-Status)
          $mimosaPreserved = ($afterStatus -ccontains $allowedUntracked)
          if ($mimosaWasPresent -and -not $mimosaPreserved) { throw 'MIMOSA_NOT_PRESERVED' }
          Write-Output ('ACS_PDF_FF_RESULT=' + ([ordered]@{
            policy = 'ACS_PDF_PINNED_FF_V1'
            previous_head = $expectedLocal
            new_head = $expectedTarget
            branch_matches = $true
            allowlisted_untracked_preserved = ($mimosaWasPresent -eq $mimosaPreserved)
            tracked_clean = $true
            no_pdf_parser_executed = $true
          } | ConvertTo-Json -Compress))
          Write-Output 'ACS_PDF_PINNED_FF_PASS'
