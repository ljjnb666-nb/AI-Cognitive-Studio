name: ACS synthetic OCR quality gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/pdf-parser-benchmark/scripts/ebook_synthetic_column_truth.py'
      - '.github/workflows/acs-ebook-synthetic-ocr.yml'
permissions:
  contents: read
jobs:
  synthetic:
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-tool-selection-20261022' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare synthetic OCR dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow rapidfuzz
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng fonts-noto-cjk
      - name: Run synthetic known-truth OCR
        run: |
          python tools/pdf-parser-benchmark/scripts/ebook_synthetic_column_truth.py --output /tmp/acs-ebook-synthetic-ocr.json
