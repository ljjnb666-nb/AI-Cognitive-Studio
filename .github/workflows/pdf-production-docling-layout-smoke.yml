name: Production PDF Docling Layout Candidate Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  synthetic-docling-source-isolation:
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/pdf-docling-layout-candidate-20261025' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pure syntax and contract testing (no model or corpus)
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile packages/ingestion/src/docling/docling-layout-child.py
          python -m py_compile packages/ingestion/tests/python/docling-layout-synthetic-smoke.py
          echo 'ACS_DOCLING_LAYOUT_SOURCE_SYNTAX=PASS'
          echo 'ACS_DOCLING_LAYOUT_PUBLIC_MODEL_CALLS=ZERO'
          echo 'ACS_DOCLING_LAYOUT_GOLD=NOT_APPROVED'

  owner-only-real-docling-layout:
    needs: synthetic-docling-source-isolation
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/pdf-docling-layout-candidate-20261025' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 19
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          clean: false
          path: acs-prod-docling
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Original-source second-page Docling Standard synthetic smoke
        shell: powershell
        timeout-minutes: 16
        run: |
          $ErrorActionPreference='Stop'
          try {
            $checkout=(Resolve-Path -LiteralPath '.\acs-prod-docling').Path
            if ((git -C $checkout rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) {
              throw 'EXACT_COMMIT_MISMATCH'
            }
            $root='D:\ai-cognitive-pdf-benchmark-data'
            $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
            $child=Join-Path $checkout 'packages\ingestion\src\docling\docling-layout-child.py'
            $smoke=Join-Path $checkout 'packages\ingestion\tests\python\docling-layout-synthetic-smoke.py'
            if (-not (Test-Path -LiteralPath $python -PathType Leaf) -or
                -not (Test-Path -LiteralPath $child -PathType Leaf) -or
                -not (Test-Path -LiteralPath $smoke -PathType Leaf)) {
              throw 'DOCLING_RUNTIME_UNAVAILABLE'
            }
            $candidates=@(
              (Join-Path $root 'tool-env\docling-standard-artifacts'),
              (Join-Path $root 'tool-env\docling-models'),
              (Join-Path $root 'models\docling-standard'),
              (Join-Path $root 'models\docling')
            )
            $allowed=@()
            foreach ($candidate in $candidates) {
              if (-not (Test-Path -LiteralPath $candidate -PathType Container)) { continue }
              $data=Get-Item -LiteralPath $candidate -Force
              if (($data.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw 'DOCLING_MODEL_LINK_REJECTED'
              }
              $weights=@(Get-ChildItem -LiteralPath $candidate -File -Recurse -ErrorAction Stop |
                Where-Object { $_.Extension -in @('.bin','.onnx','.pt','.pth','.safetensors') })
              if ($weights.Count -gt 0) { $allowed+=,$candidate }
            }
            if ($allowed.Count -ne 1) { throw 'DOCLING_MODEL_CANDIDATE_COUNT_REJECTED' }
            $env:HTTP_PROXY='http://127.0.0.1:1'
            $env:HTTPS_PROXY='http://127.0.0.1:1'
            $env:ALL_PROXY='http://127.0.0.1:1'
            $env:NO_PROXY='*'
            $out=@(& $python $smoke --child $child --artifacts $allowed[0] 2>$null)
            if ($LASTEXITCODE -ne 0) {
              $safe = @($out | Where-Object { $_ -match '^ACS_DOCLING_LAYOUT_FAILURE_STAGE=(MODEL_PROBE|SYNTHETIC_PDF_CREATE|SECOND_PAGE_CONVERT|CANDIDATE_PROTOCOL|PAGE_ISOLATION_CHECK)$' })
              if ($safe.Count -eq 1) { Write-Output $safe[0] }
              $reasons = @($out | Where-Object { $_ -match '^ACS_DOCLING_LAYOUT_FAILURE_REASON=(START|DOCLING_VERSION|PYMUPDF_IMPORT|DOCLING_IMPORT|ARTIFACT_DIRECTORY|ARTIFACT_INVENTORY|ARTIFACT_HASH|ARTIFACT_WEIGHT_PRESENCE)$' })
              if ($reasons.Count -eq 1) { Write-Output $reasons[0] }
              foreach ($label in @('ACS_DOCLING_LAYOUT_PROBE_EXIT=','ACS_DOCLING_LAYOUT_PROBE_LINE_COUNT=')) {
                $safeReceipt=@($out | Where-Object { $_ -eq ($label + 'ZERO') -or $_ -eq ($label + 'NONZERO') -or $_ -eq ($label + 'ONE') -or $_ -eq ($label + 'OTHER') })
                if ($safeReceipt.Count -eq 1) { Write-Output $safeReceipt[0] }
              }
              throw 'DOCLING_SYNTHETIC_SMOKE_FAILED'
            }
            foreach ($marker in @('ACS_DOCLING_LAYOUT_PINNED_ASSETS=PASS',
                'ACS_DOCLING_LAYOUT_REAL_SECOND_PAGE=PASS',
                'ACS_DOCLING_LAYOUT_FIRST_PAGE_LEAKAGE=ZERO',
                'ACS_DOCLING_LAYOUT_CLOUD_CALLS=ZERO',
                'ACS_DOCLING_LAYOUT_PRIVATE_BOOK_READS=ZERO',
                'ACS_DOCLING_LAYOUT_GOLD=NOT_APPROVED')) {
              if (@($out | Where-Object { $_ -eq $marker }).Count -ne 1) {
                throw 'DOCLING_RESULT_RECEIPT_INVALID'
              }
            }
            Write-Output 'ACS_DOCLING_LAYOUT_WINDOWS=REAL_SYNTHETIC_PASS'
            Write-Output 'ACS_DOCLING_LAYOUT_FIRST_PAGE_LEAKAGE=ZERO'
            Write-Output 'ACS_DOCLING_LAYOUT_CLOUD_CALLS=ZERO'
            Write-Output 'ACS_DOCLING_LAYOUT_GOLD=NOT_APPROVED'
          } catch {
            Write-Output 'ACS_DOCLING_LAYOUT_WINDOWS=REJECTED'
            exit 2
          }
