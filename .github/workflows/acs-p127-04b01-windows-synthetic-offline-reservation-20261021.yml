# Real Windows NTFS filesystem synthetic test only. No GLM access or book reads.
name: ACS 04B01 Windows isolated offline authorization ledger
on:
  push:
    branches: [ops/mineru-synthetic-retry-20261020-isolated]
    paths:
      - .github/workflows/acs-p127-04b01-windows-synthetic-offline-reservation-20261021.yml
permissions: {}
concurrency:
  group: acs-windows-pdf-local-ownership
  cancel-in-progress: false
jobs:
  synthetic-ledger:
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 6
    steps:
      - name: Stage immutable exact Git blobs offline
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('acs-04b01-synthetic-'+$env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $dir) {throw 'REUSED_STAGING_NOT_ALLOWED'}
          [IO.Directory]::CreateDirectory($dir) | Out-Null
          $git=(Get-Command git -ErrorAction Stop).Source
          # Exact pinned SHA dc175e65a943fbba70e9d277d4051654adda26eb
          $parts=@(
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
          )
          $dest=Join-Path $dir 'graph-batch-authorization.mjs'
          [IO.File]::WriteAllBytes($dest,[Convert]::FromBase64String(($parts -join '')))
          $got=(& $git hash-object --no-filters -- $dest).Trim()
          if ($LASTEXITCODE -ne 0 -or $got -ne 'dc175e65a943fbba70e9d277d4051654adda26eb') {throw 'PUBLIC_SOURCE_SHA_MISMATCH'}
          # Exact pinned SHA 97d07b0396590f7c76473e22a83882b9645b5585
          $parts=@(
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
          )
          $dest=Join-Path $dir 'graph-batch-offline-ledger.mjs'
          [IO.File]::WriteAllBytes($dest,[Convert]::FromBase64String(($parts -join '')))
          $got=(& $git hash-object --no-filters -- $dest).Trim()
          if ($LASTEXITCODE -ne 0 -or $got -ne '97d07b0396590f7c76473e22a83882b9645b5585') {throw 'PUBLIC_SOURCE_SHA_MISMATCH'}
          Write-Output 'ACS_04B01_PINNED_SOURCE_OK=true'
      - name: Test synthetic offline approval and immutable lock on NTFS
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('acs-04b01-synthetic-'+$env:GITHUB_RUN_ID)
          $script=@'
          import {pathToFileURL} from 'node:url';
          import {join} from 'node:path';
          import {mkdtemp,rm} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          import {createHash} from 'node:crypto';
          const source=process.argv[2];
          const auth=await import(pathToFileURL(join(source,'graph-batch-authorization.mjs')).href);
          const ledger=await import(pathToFileURL(join(source,'graph-batch-offline-ledger.mjs')).href);
          const root=await mkdtemp(join(tmpdir(),'acs-04b01-offline-only-'));
          const id='RB-PDF-12:page-001-region-01';
          const item={id,fixtureId:'RB-PDF-12',regionId:'page-001-region-01',
            sourcePhysicalPage1Based:51,cropSha256:'a'.repeat(64),cropBytes:1024,
            requestUpperBoundBytes:4*Math.ceil(1024/3)+100000};
          const data={schemaVersion:'acs-offline-graph-batch-plan-v1',
            sourceRun:'real-mineru-39440805765-1',model:'glm-5.3-flash',
            authority:'PREVIEW_ONLY_NO_PROVIDER_DISPATCH',maxRequests:14,
            maxTotalBytes:48000000,totalCropBytes:1024,planned:[item],excluded:[]};
          const sha=x=>createHash('sha256').update(JSON.stringify(x)).digest('hex');
          const plan={...data,planSha256:sha(data),needsExplicitPaidAuthorization:true,
            providerRequestsIssued:0,dispatchEnabled:false,priceEstimate:null,
            counts:{discovered:1,eligible:1,excluded:0,alreadyHasGraph:0,blocked:0,limitExcluded:0}};
          let ok=false;
          try{
            const draft=auth.draftBatchAuthorization(plan,{selectedIds:[id],maxCalls:1,
              currency:'CNY',maxSpendMinorUnits:500,expiresAt:'2026-10-22T00:00:00.000Z'});
            if(draft.status!=='DRAFT_NOT_AUTHORIZED')throw Error('UNSAFE_APPROVAL');
            let noDispatch=false;try{auth.guardBatchDispatch(plan,draft);}catch(e){
              noDispatch=e.code==='BATCH_DISPATCH_REQUIRES_VERIFIED_PRICE_AND_EXPLICIT_APPROVAL';}
            if(!noDispatch)throw Error('UNSAFE_DISPATCH');
            const now='2026-10-21T00:00:00.000Z';
            const first=await ledger.reserveOfflineReviewItem(root,plan,draft,id,{now});
            if(first.dispatchEnabled!==false||first.providerRequestsIssued!==0)throw Error('NOT_OFFLINE');
            const read=await ledger.inspectOfflineReviewItem(root,plan,draft,id);
            if(read.status!=='OFFLINE_PREPARED_NOT_DISPATCHED')throw Error('READBACK');
            let noReplay=false;try{await ledger.reserveOfflineReviewItem(root,plan,draft,id,{now});}
              catch(e){noReplay=e.code==='BATCH_LEDGER_ITEM_ALREADY_RESERVED';}
            if(!noReplay)throw Error('DUPLICATE_ALLOWED');
            ok=true;
          }finally{await rm(root,{recursive:true,force:true,maxRetries:6,retryDelay:300});}
          if(!ok)process.exit(2);
          console.log('ACS_04B01_WIN_SYNTHETIC_DRAFT_NOT_AUTHORIZED=true');
          console.log('ACS_04B01_WIN_SYNTHETIC_OFFLINE_CAS_PASS=true');
          console.log('ACS_04B01_WIN_SYNTHETIC_DUPLICATE_BLOCKED=true');
          console.log('ACS_04B01_WIN_REAL_PRIVATE_DATA_TOUCHED=false');
          console.log('ACS_04B01_WIN_PROVIDER_CALLS=0');
          '@
          $file=Join-Path $dir 'synthetic-ledger.mjs'
          [IO.File]::WriteAllText($file,$script,[Text.UTF8Encoding]::new($false))
          & node $file $dir
          if ($LASTEXITCODE -ne 0) {throw 'WINDOWS_SYNTHETIC_LEDGER_FAILED'}
