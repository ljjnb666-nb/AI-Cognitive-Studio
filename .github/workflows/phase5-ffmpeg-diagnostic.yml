name: Phase 5 FFmpeg diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/phase5-ffmpeg-diagnostic.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to diagnose
        required: true
        default: feat/phase-7-production-auth

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client for package import graph
        run: pnpm db:generate
      - name: Install FFmpeg debugging tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg gdb
      - name: Record bounded native media stack
        run: |
          mkdir -p "$RUNNER_TEMP/phase5-ffmpeg-diagnostic"
          {
            uname -a
            cat /etc/os-release
            ffmpeg -version
            ffprobe -version
            ffmpeg -buildconf
            ffmpeg -filters
            ffmpeg -encoders
            ffmpeg -decoders
            ldd "$(command -v ffmpeg)"
            dpkg-query -W ffmpeg libass9 'libavfilter*' 'libavcodec*' 'libavformat*' libfontconfig1 libfreetype6 libharfbuzz0b libfribidi0 || true
            fc-match sans
            fc-match "DejaVu Sans"
            fc-list | head -n 50
            ulimit -a
            free -h
            df -h
          } > "$RUNNER_TEMP/phase5-ffmpeg-diagnostic/native-stack.txt" 2>&1
          sed -e "s|$RUNNER_TEMP|<tmp>|g" "$RUNNER_TEMP/phase5-ffmpeg-diagnostic/native-stack.txt"
      - name: Replay exact direct renderer fixture and reduction matrix
        run: pnpm --filter @ai-cognitive/short-video-generation exec vitest run tests/ffmpeg-crash-diagnostic.test.ts --reporter verbose
        env:
          NODE_ENV: test
          PHASE5_FFMPEG_DIAGNOSTIC_DIR: ${{ runner.temp }}/phase5-ffmpeg-diagnostic
          PHASE5_FFMPEG_GDB: "1"
      - name: Upload bounded diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-ffmpeg-diagnostic
          path: ${{ runner.temp }}/phase5-ffmpeg-diagnostic
          if-no-files-found: warn
