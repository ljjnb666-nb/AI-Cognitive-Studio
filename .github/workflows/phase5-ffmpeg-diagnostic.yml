name: Phase 5 FFmpeg diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/phase5-ffmpeg-diagnostic.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to diagnose
        required: true
        default: feat/phase-7-production-auth

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client for package import graph
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://diagnostic:diagnostic@127.0.0.1:5432/diagnostic?schema=public
      - name: Install FFmpeg debugging tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg gdb libc6-dbg
      - name: Configure diagnostic core capture
        run: |
          mkdir -p "$RUNNER_TEMP/phase5-ffmpeg-diagnostic"
          {
            echo "ulimit_before=$(ulimit -c)"
            cat /proc/sys/kernel/core_pattern
            cat /proc/sys/kernel/core_uses_pid || true
            sudo sysctl -w kernel.core_pattern="$RUNNER_TEMP/phase5-ffmpeg-diagnostic/core.%e.%p" || true
            ulimit -c unlimited
            echo "ulimit_after=$(ulimit -c)"
            echo "core_pattern_after=$(cat /proc/sys/kernel/core_pattern)"
          } > "$RUNNER_TEMP/phase5-ffmpeg-diagnostic/core-configuration.txt" 2>&1
      - name: Record bounded native media stack
        run: |
          mkdir -p "$RUNNER_TEMP/phase5-ffmpeg-diagnostic"
          {
            uname -a
            cat /etc/os-release
            ffmpeg -version
            ffprobe -version
            ffmpeg -buildconf
            ffmpeg -filters
            ffmpeg -encoders
            ffmpeg -decoders
            ldd "$(command -v ffmpeg)"
            dpkg-query -W ffmpeg libass9 'libavfilter*' 'libavcodec*' 'libavformat*' libfontconfig1 libfreetype6 libharfbuzz0b libfribidi0 || true
            fc-match sans
            fc-match "DejaVu Sans"
            fc-list | head -n 50
            ulimit -a
            free -h
            df -h
          } > "$RUNNER_TEMP/phase5-ffmpeg-diagnostic/native-stack.txt" 2>&1
          sed -e "s|$RUNNER_TEMP|<tmp>|g" "$RUNNER_TEMP/phase5-ffmpeg-diagnostic/native-stack.txt"
      - name: Replay exact direct renderer fixture and reduction matrix
        run: |
          ulimit -c unlimited
          pnpm --filter @ai-cognitive/short-video-generation exec vitest run tests/ffmpeg-crash-diagnostic.test.ts --reporter verbose
        env:
          NODE_ENV: test
          PHASE5_FFMPEG_DIAGNOSTIC_DIR: ${{ runner.temp }}/phase5-ffmpeg-diagnostic
          PHASE5_FFMPEG_MAX_ATTEMPTS: "50"
      - name: Post-mortem native core analysis
        if: always()
        run: |
          diagnostic_dir="$RUNNER_TEMP/phase5-ffmpeg-diagnostic"
          core_file="$(find "$diagnostic_dir" -maxdepth 1 -type f -name 'core*' -print -quit)"
          if [ -z "$core_file" ]; then
            echo "CORE_DUMP_CONFIGURATION=NOT_WORKING" | tee "$diagnostic_dir/core-result.txt"
            exit 0
          fi
          echo "CORE_DUMP_CONFIGURATION=WORKING" | tee "$diagnostic_dir/core-result.txt"
          sha256sum "$(command -v ffmpeg)" > "$diagnostic_dir/ffmpeg-sha256.txt"
          gdb "$(command -v ffmpeg)" "$core_file" --batch \
            -ex "set pagination off" -ex "info threads" -ex "thread apply all bt" \
            -ex "thread apply all bt full" -ex "info sharedlibrary" -ex "info registers" \
            -ex "frame 0" -ex "x/i \$pc" > "$diagnostic_dir/gdb-core.txt" 2>&1 || true
          mv "$core_file" "$diagnostic_dir/core-ffmpeg.dump"
          index=0
          while IFS= read -r extra_core; do
            index=$((index + 1))
            mv "$extra_core" "$diagnostic_dir/core-ffmpeg-extra-$index.dump"
          done < <(find "$diagnostic_dir" -maxdepth 1 -type f -name 'core.*' -print)
      - name: Upload bounded diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-ffmpeg-diagnostic
          path: ${{ runner.temp }}/phase5-ffmpeg-diagnostic
          if-no-files-found: warn
