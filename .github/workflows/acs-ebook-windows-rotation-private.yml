name: ACS Ebook Windows Private Rotation Evidence
on:
  pull_request:
    paths:
      - ".github/workflows/acs-ebook-windows-rotation-private.yml"
      - "tools/pdf-parser-benchmark/scripts/ebook_roi_rotation_contract.py"
      - "tools/pdf-parser-benchmark/scripts/ebook_windows_docling_real.py"
      - "tools/pdf-parser-benchmark/scripts/ebook_windows_private_preflight.py"
      - "tools/pdf-parser-benchmark/tests/test_ebook_windows_private_preflight.py"
      - "tools/pdf-parser-benchmark/scripts/ebook_private_native_pages.py"
      - "tools/pdf-parser-benchmark/tests/test_ebook_private_native_pages.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acs-ebook-windows-rotation-private
  cancel-in-progress: false

jobs:
  streaming-private-preflight-synthetic:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pure-stdlib private preflight synthetic tests
        run: |
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_windows_private_preflight.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_private_native_pages.py' -v
          echo "ACS_PRIVATE_PREFLIGHT_SYNTHETIC_PASS"
          echo "ACS_PRIVATE_NATIVE_FAKE_PDF_BACKEND_SYNTHETIC_PASS"
          echo "ACS_PRIVATE_REAL_B15_B31_IOU=UNVERIFIED"
  sha-pinned-real-docling:
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.ref == 'bench/ebook-windows-private-rotation-20261023' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 40
    steps:
      - name: Checkout exact authorized PR HEAD
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          persist-credentials: false
          clean: false
          path: acs-ebook-rotation-private
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Inventory SHA-pinned books and private visual reference without OCR or 4-GiB gate
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C acs-ebook-rotation-private rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'ACS_PREFLIGHT_EXACT_SHA_MISMATCH' }
          $private = 'D:\ai-cognitive-pdf-benchmark-data'
          if (-not (Test-Path -LiteralPath $private -PathType Container)) { throw 'ACS_PREFLIGHT_PRIVATE_ROOT_MISSING' }
          $python = (Get-Command python -ErrorAction Stop).Source
          $script = 'acs-ebook-rotation-private/tools/pdf-parser-benchmark/scripts/ebook_windows_private_preflight.py'
          $manifest = 'acs-ebook-rotation-private/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          & $python $script --root $private --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw 'ACS_PREFLIGHT_PRIVATE_CORPUS_OR_REFERENCE_INVALID' }
      - name: Check real private physical pages using lightweight PyMuPDF (no OCR)
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $private = 'D:\ai-cognitive-pdf-benchmark-data'
          $os = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
          if ([double]$os.FreePhysicalMemory -lt 1048576) {
            Write-Output 'ACS_PRIVATE_NATIVE_SKIPPED_FREE_RAM_UNDER_1GIB'
            exit 0
          }
          $python = Join-Path $private 'tool-env\docling-2.141.0\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            Write-Output 'ACS_PRIVATE_NATIVE_SKIPPED_CACHED_PYMUPDF_NOT_FOUND'
            exit 0
          }
          & $python -c "import fitz"
          if ($LASTEXITCODE -ne 0) { throw 'ACS_PRIVATE_NATIVE_PYMUPDF_MISSING' }
          $script = 'acs-ebook-rotation-private/tools/pdf-parser-benchmark/scripts/ebook_private_native_pages.py'
          $manifest = 'acs-ebook-rotation-private/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          $output = Join-Path $private ('reports\ebook-native-lowram-' + $env:EXPECTED_SHA.Substring(0,12) + '.private.json')
          & $python $script --root $private --manifest $manifest --output $output
          if ($LASTEXITCODE -ne 0) { throw 'ACS_PRIVATE_NATIVE_PAGE_EVIDENCE_INCOMPLETE' }
          Write-Output 'ACS_PRIVATE_NATIVE_REPORT_STORED_ON_D_DRIVE_ONLY'
      - name: Verify local-only SHA-pinned source and model cache
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $checkout = 'acs-ebook-rotation-private'
          if ((git -C $checkout rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'ACS_ROTATION_EXACT_SHA_MISMATCH' }
          $private = 'D:\ai-cognitive-pdf-benchmark-data'
          if (-not (Test-Path -LiteralPath $private -PathType Container)) { throw 'ACS_ROTATION_PRIVATE_ROOT_MISSING' }
          $os = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
          if ([double]$os.FreePhysicalMemory -lt 4194304) { throw 'ACS_ROTATION_FREE_RAM_UNDER_4GIB' }
          $drive = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='D:'" -ErrorAction Stop
          if ([double]$drive.FreeSpace -lt 17179869184) { throw 'ACS_ROTATION_D_FREE_UNDER_16GIB' }
          $python = Join-Path $private 'tool-env\docling-2.141.0\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'ACS_ROTATION_CACHED_DOCLING_PYTHON_MISSING' }
          $ver = (& $python -c "import importlib.metadata; print(importlib.metadata.version('docling'))").Trim()
          if ($LASTEXITCODE -ne 0 -or $ver -ne '2.141.0') { throw 'ACS_ROTATION_CACHED_DOCLING_VERSION_MISMATCH' }
          & $python -c "import fitz; import docling; import onnxruntime"
          if ($LASTEXITCODE -ne 0) { throw 'ACS_ROTATION_CACHED_DEPENDENCIES_MISSING' }
          Write-Output ('ACS_ROTATION_PRIVATE_DOC_VERSION=' + $ver)
          Write-Output ('ACS_ROTATION_PRIVATE_REF_PRESENT=' + (Test-Path -LiteralPath (Join-Path $private 'semantic_gate\B15_B31_roi_candidates.private.json') -PathType Leaf))
          Write-Output ('ACS_ROTATION_PRIVATE_CALIBRATION_PRESENT=' + (Test-Path -LiteralPath (Join-Path $private 'semantic_gate\B15_roi_frame_calibration.private.json') -PathType Leaf))
          Write-Output 'ACS_ROTATION_OFFLINE_PRECHECK_PASS'
      - name: Evaluate real B15/B31 and native control B16 offline
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $private = 'D:\ai-cognitive-pdf-benchmark-data'
          $python = Join-Path $private 'tool-env\docling-2.141.0\Scripts\python.exe'
          $env:HF_HOME = Join-Path $private 'model-cache'
          $env:TORCH_HOME = Join-Path $private 'model-cache\torch'
          $env:TEMP = Join-Path $private 'temp'
          $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          $script = 'acs-ebook-rotation-private/tools/pdf-parser-benchmark/scripts/ebook_windows_docling_real.py'
          $manifest = 'acs-ebook-rotation-private/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          $output = Join-Path $private ('reports\ebook-rotation-real-' + $env:EXPECTED_SHA.Substring(0,12) + '.private.json')
          & $python $script --root $private --manifest $manifest --output $output
          if ($LASTEXITCODE -ne 0) { throw 'ACS_ROTATION_REAL_EVALUATION_FAILED' }
          $report = Get-Content -LiteralPath $output -Raw -Encoding UTF8 | ConvertFrom-Json
          if (@($report.failed).Count -ne 0 -or @($report.missing).Count -ne 0 -or @($report.rows).Count -ne 3) { throw 'ACS_ROTATION_REAL_REPORT_INCOMPLETE' }
          foreach ($row in $report.rows) {
            if ($row.status -ne 'SUCCESS') { throw 'ACS_ROTATION_REAL_BOOK_FAILED' }
            foreach ($metric in $row.results) {
              if ($metric.engine -ne 'Docling') { continue }
              if ($metric.layout_evidence.graph_semantics -ne 'UNVERIFIED') { throw 'ACS_ROTATION_GRAPH_CLAIM_INVALID' }
              $label = $row.book_id
              $layout = $metric.layout_evidence
              if ($label -eq 'B15' -and $layout.source_pdf_rotation_degrees -ne 270) { throw 'ACS_ROTATION_B15_PAGE_CHANGED' }
              if ($label -eq 'B31' -and $layout.source_pdf_rotation_degrees -ne 0) { throw 'ACS_ROTATION_B31_PAGE_CHANGED' }
              if ($label -in @('B15','B31') -and ($layout.picture_items -le 0 -or $layout.picture_boxes_with_geometry -ne $layout.picture_items)) { throw 'ACS_ROTATION_PRIVATE_PICTURE_GEOMETRY_MISSING' }
              Write-Output ('ACS_ROTATION_REAL_PRIVATE=' + $label + '|PAGE=' + $row.physical_page + '|ROTATION=' + $layout.source_pdf_rotation_degrees + '|PICTURES=' + $layout.picture_items + '|BOXES=' + $layout.picture_boxes_with_geometry + '|ALIGNMENT=' + $layout.spatial_alignment_status + '|GRAPH=UNVERIFIED')
            }
          }
          Write-Output 'ACS_ROTATION_REAL_REPORT_STORED_ON_D_DRIVE_ONLY'
          Write-Output 'ACS_ROTATION_REAL_GRAPH_F1=UNVERIFIED'
