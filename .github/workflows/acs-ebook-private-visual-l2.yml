name: ACS Ebook Private GLM Visual L2 Reference

on:
  pull_request:
    paths:
      - ".github/workflows/acs-ebook-private-visual-l2.yml"
      - "tools/pdf-parser-benchmark/scripts/ebook_private_glm_visual_reference.py"
      - "tools/pdf-parser-benchmark/tests/test_ebook_private_glm_visual_reference.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acs-ebook-private-visual-l2
  cancel-in-progress: false

jobs:
  synthetic-private-vision-contract:
    if: \${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: \${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check two-pass page-pixel reference security and abstention
        run: |
          python -m py_compile tools/pdf-parser-benchmark/scripts/ebook_private_glm_visual_reference.py
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_private_glm_visual_reference.py' -v
          echo "ACS_PRIVATE_GLML2_SYNTHETIC_PASS"
          echo "ACS_PRIVATE_GLML2_HUMAN_GOLD=FALSE"

  real-private-vision-reference:
    if: \${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.ref == 'bench/ebook-independent-visual-reference-20261023' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 25
    env:
      EXPECTED_SHA: \${{ github.event.pull_request.head.sha }}
      ACS_GLM_VISION_API_KEY: \${{ secrets.ACS_GLM_VISION_API_KEY }}
      GLM_API_KEY: \${{ secrets.GLM_API_KEY }}
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Checkout authorized SHA on private self-hosted runner
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          ref: \${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: false
          path: acs-ebook-private-glml2
      - name: Check source, resource budget and credential without printing secrets
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C acs-ebook-private-glml2 rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'ACS_GLML2_EXACT_SHA_MISMATCH' }
          $root='D:\ai-cognitive-pdf-benchmark-data'
          if (-not (Test-Path -LiteralPath $root -PathType Container)) { throw 'ACS_GLML2_PRIVATE_CORPUS_MISSING' }
          $os=Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
          if ([double]$os.FreePhysicalMemory -lt 2097152) { throw 'ACS_GLML2_FREE_RAM_UNDER_2GIB' }
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'ACS_GLML2_CACHED_PYTHON_MISSING' }
          & $python -c "import fitz; import requests; import socks"
          if ($LASTEXITCODE -ne 0) { throw 'ACS_GLML2_PYMUPDF_REQUESTS_SOCKS_MISSING' }
          $reference=Join-Path $root 'semantic_gate\B15_B31_roi_candidates.private.json'
          $audit=Join-Path $root 'semantic_gate\B15_B31_ai_visual_l2_audit.private.json'
          if ((Test-Path -LiteralPath $reference) -or (Test-Path -LiteralPath $audit)) { throw 'ACS_GLML2_REFERENCE_ALREADY_EXISTS_NO_OVERWRITE' }
          if ([string]::IsNullOrWhiteSpace($env:ACS_GLM_VISION_API_KEY) -and [string]::IsNullOrWhiteSpace($env:GLM_API_KEY)) {
            throw 'ACS_GLML2_PROVIDER_SECRET_NOT_CONFIGURED'
          }
          Write-Output 'ACS_GLML2_PRIVATE_AND_SECRET_PREFLIGHT=PASS'
      - name: Render B15 and B31 source pixels and obtain four bounded vision observations
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='D:\ai-cognitive-pdf-benchmark-data'
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          $env:HTTPS_PROXY='socks5h://127.0.0.1:10808'
          $env:HTTP_PROXY='socks5h://127.0.0.1:10808'
          $env:ALL_PROXY='socks5h://127.0.0.1:10808'
          $script='acs-ebook-private-glml2/tools/pdf-parser-benchmark/scripts/ebook_private_glm_visual_reference.py'
          $manifest='acs-ebook-private-glml2/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          & $python $script --root $root --manifest $manifest --allow-cloud-vision
          if ($LASTEXITCODE -ne 0) { throw 'ACS_GLML2_PROVISIONAL_REFERENCE_NOT_ESTABLISHED' }
          Write-Output 'ACS_GLML2_BOOK_PIXELS_SHARED_ONLY_WITH_CONFIGURED_VISION_PROVIDER'
          Write-Output 'ACS_GLML2_PRIVATE_SIDE_CAR_SAVED_ON_D_DRIVE_ONLY'
      - name: Evaluate B31 real provisional spatial overlap independently from Docling
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='D:\ai-cognitive-pdf-benchmark-data'
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          $env:HF_HOME=Join-Path $root 'model-cache'
          $env:TORCH_HOME=Join-Path $root 'model-cache\torch'
          $env:TEMP=Join-Path $root 'temp'
          $env:TMP=$env:TEMP
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          $script='acs-ebook-private-glml2/tools/pdf-parser-benchmark/scripts/ebook_windows_docling_real.py'
          $manifest='acs-ebook-private-glml2/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          $output=Join-Path $root ('reports\ebook-l2-visual-roi-'+$env:EXPECTED_SHA.Substring(0,12)+'.private.json')
          & $python $script --root $root --manifest $manifest --output $output
          if ($LASTEXITCODE -ne 0) { throw 'ACS_GLML2_POST_REFERENCE_REAL_EVALUATION_FAILED' }
          $report=Get-Content -LiteralPath $output -Raw -Encoding UTF8 | ConvertFrom-Json
          if (@($report.missing).Count -ne 0 -or @($report.failed).Count -ne 0) { throw 'ACS_GLML2_REAL_REPORT_INCOMPLETE' }
          foreach ($page in $report.rows) {
            foreach ($entry in $page.results) {
              if ($entry.engine -ne 'Docling') { continue }
              $layout=$entry.layout_evidence
              if ($layout.graph_semantics -ne 'UNVERIFIED') { throw 'ACS_GLML2_UNAUTHORIZED_GRAPH_CLAIM' }
              Write-Output ('ACS_GLML2_REAL_LAYOUT='+$page.book_id+'|ALIGNMENT='+$layout.spatial_alignment_status+'|GRAPH=UNVERIFIED')
              if ($page.book_id -eq 'B31') {
                $alignment=$layout.spatial_alignment
                if ($null -eq $alignment) { throw 'ACS_GLML2_B31_SPATIAL_ALIGNMENT_MISSING' }
                Write-Output ('ACS_GLML2_B31_PROVISIONAL_MATCHES='+$alignment.one_to_one_region_matches+'|REFS='+$alignment.reference_region_count+'|PICTURES='+$alignment.detected_picture_box_count)
              }
              if ($page.book_id -eq 'B15' -and $layout.spatial_alignment_status -ne 'ROTATED_DISPLAY_TRANSFORM_UNVERIFIED') { throw 'ACS_GLML2_B15_CALIBRATION_NOT_INDEPENDENT' }
            }
          }
          Write-Output 'ACS_GLML2_L2_NOT_HUMAN_GOLD=TRUE'
          Write-Output 'ACS_GLML2_GRAPH_F1=UNVERIFIED'
