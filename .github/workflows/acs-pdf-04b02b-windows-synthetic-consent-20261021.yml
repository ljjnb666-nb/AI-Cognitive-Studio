# 04B02B: no model calls, only synthetic key and temporary NTFS files.
name: ACS 04B02B Windows signed consent and simulation dry-run
on:
  push:
    branches: [ops/mineru-synthetic-retry-20261020-isolated]
    paths:
      - .github/workflows/acs-pdf-04b02b-windows-synthetic-consent-20261021.yml
permissions: {}
concurrency:
  group: acs-windows-pdf-local-ownership
  cancel-in-progress: false
jobs:
  synthetic-approval:
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 8
    steps:
      - name: Verify exact public blobs offline without checkout
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('acs-04b02b-'+$env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $dir) {throw 'UNSAFE_STAGING_REUSE'}
          [IO.Directory]::CreateDirectory($dir) | Out-Null
          $git=(Get-Command git -ErrorAction Stop).Source
          # Verified Git blob dc175e65a943fbba70e9d277d4051654adda26eb
          $parts=@(
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
          )
          $dest=Join-Path $dir 'graph-batch-authorization.mjs'
          [IO.File]::WriteAllBytes($dest,[Convert]::FromBase64String(($parts -join '')))
          $got=(& $git hash-object --no-filters -- $dest).Trim()
          if ($LASTEXITCODE -ne 0 -or $got -ne 'dc175e65a943fbba70e9d277d4051654adda26eb') {throw 'PINNED_SOURCE_MISMATCH'}
          # Verified Git blob f26368adbf7aa10177e9648f8df5b105ffa86366
          $parts=@(
            ''
            ''
            ''
            ''
            ''
            ''
            ''
          )
          $dest=Join-Path $dir 'graph-batch-consent-proof.mjs'
          [IO.File]::WriteAllBytes($dest,[Convert]::FromBase64String(($parts -join '')))
          $got=(& $git hash-object --no-filters -- $dest).Trim()
          if ($LASTEXITCODE -ne 0 -or $got -ne 'f26368adbf7aa10177e9648f8df5b105ffa86366') {throw 'PINNED_SOURCE_MISMATCH'}
          # Verified Git blob ecde8e03fd6c806ad52247aa63bf7885c8fc04cd
          $parts=@(
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            'RfUkVBRF9GQUlMRUQiKTsKICB9ZmluYWxseXthd2FpdCBoYW5kbGU/LmNsb3NlKCk7fQp9Cg=='
          )
          $dest=Join-Path $dir 'graph-batch-simulated-attempt.mjs'
          [IO.File]::WriteAllBytes($dest,[Convert]::FromBase64String(($parts -join '')))
          $got=(& $git hash-object --no-filters -- $dest).Trim()
          if ($LASTEXITCODE -ne 0 -or $got -ne 'ecde8e03fd6c806ad52247aa63bf7885c8fc04cd') {throw 'PINNED_SOURCE_MISMATCH'}
          # Verified Git blob 4dd0173c57c0c44792b2b6b7924301df90db5a8b
          $parts=@(
            ''
            ''
            ''
            ''
            ''
            ''
            'MAogIH07Cn0K'
          )
          $dest=Join-Path $dir 'graph-batch-reconcile.mjs'
          [IO.File]::WriteAllBytes($dest,[Convert]::FromBase64String(($parts -join '')))
          $got=(& $git hash-object --no-filters -- $dest).Trim()
          if ($LASTEXITCODE -ne 0 -or $got -ne '4dd0173c57c0c44792b2b6b7924301df90db5a8b') {throw 'PINNED_SOURCE_MISMATCH'}
          Write-Output 'ACS_04B02B_PUBLIC_SOURCES_PINNED=true'
      - name: Rehearse consent, concurrency and immutable crash state (no GLM)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('acs-04b02b-'+$env:GITHUB_RUN_ID)
          $code=@'
          import {pathToFileURL} from 'node:url';
          import {join} from 'node:path';
          import {mkdtemp,writeFile,rm} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          import {createHash,generateKeyPairSync,sign} from 'node:crypto';
          const src=process.argv[2];
          const load=async n=>import(pathToFileURL(join(src,n+'.mjs')).href);
          const auth=await load('graph-batch-authorization');
          const proof=await load('graph-batch-consent-proof');
          const journal=await load('graph-batch-simulated-attempt');
          const root=await mkdtemp(join(tmpdir(),'acs-04b02b-synthetic-only-'));
          let success=false;
          try{
            await writeFile(join(root,'ACS_SYNTHETIC_ONLY.marker'),'ACS_SYNTHETIC_CLOUD_ROOT_V1\n');
            const id='RB-PDF-12:page-001-region-01';
            const item={id,fixtureId:'RB-PDF-12',regionId:'page-001-region-01',
              sourcePhysicalPage1Based:51,cropSha256:'a'.repeat(64),cropBytes:1000,
              requestUpperBoundBytes:4*Math.ceil(1000/3)+100000};
            const body={schemaVersion:'acs-offline-graph-batch-plan-v1',
              sourceRun:'real-mineru-39440805765-1',model:'glm-5.3-flash',
              authority:'PREVIEW_ONLY_NO_PROVIDER_DISPATCH',maxRequests:14,
              maxTotalBytes:48000000,totalCropBytes:1000,planned:[item],excluded:[]};
            const hash=v=>createHash('sha256').update(JSON.stringify(v)).digest('hex');
            const plan={...body,planSha256:hash(body),needsExplicitPaidAuthorization:true,
              providerRequestsIssued:0,dispatchEnabled:false,priceEstimate:null,
              counts:{discovered:1,eligible:1,excluded:0,alreadyHasGraph:0,blocked:0,limitExcluded:0}};
            const request=auth.draftBatchAuthorization(plan,{selectedIds:[id],maxCalls:1,
              maxSpendMinorUnits:500,currency:'CNY',expiresAt:'2026-10-22T00:00:00.000Z'});
            const statement=proof.consentStatement(plan,request,{issuedAt:'2026-10-21T01:00:00.000Z'});
            const pair=generateKeyPairSync('ed25519');
            const evidence={statement,keyId:'synthetic_only',signatureBase64:sign(null,
              Buffer.from(JSON.stringify(statement),'utf8'),pair.privateKey).toString('base64')};
            const verified=proof.verifyConsentEvidence(plan,request,evidence,{
              trustedKeys:{synthetic_only:pair.publicKey},now:'2026-10-21T01:01:00.000Z'});
            if(verified.operatorSignatureVerified!==true||verified.dispatchEnabled!==false)
              throw Error('SIGNED_EVIDENCE_WRONG_AUTHORITY');
            let blocked=false;
            try{proof.assertBillableReady(verified);}catch(e){blocked=e.code==='CONSENT_BILLABLE_APPROVAL_NOT_IMPLEMENTED';}
            if(!blocked)throw Error('PROVIDER_DISPATCH_NOT_BLOCKED');
            const claims=await Promise.allSettled([
              journal.claimSyntheticAttempt(root,plan,request,id),
              journal.claimSyntheticAttempt(root,plan,request,id)]);
            if(claims.filter(x=>x.status==='fulfilled').length!==1||
               claims.filter(x=>x.status==='rejected').length!==1)throw Error('CAS_UNSAFE');
            const saved=await journal.inspectSyntheticAttempt(root,plan,request,id);
            if(saved.status!=='SIMULATED_UNCERTAIN_OUTCOME_NO_NETWORK'||
               saved.mayAutoReplay!==false)throw Error('SIMULATED_REPLAY_UNSAFE');
            success=true;
          }finally{await rm(root,{recursive:true,force:true,maxRetries:6,retryDelay:250});}
          if(!success)process.exit(2);
          console.log('ACS_04B02B_WIN_SIGNATURE_SCOPE_PASS=true');
          console.log('ACS_04B02B_WIN_PERMANENT_SIMULATION_CAS_PASS=true');
          console.log('ACS_04B02B_WIN_BILLABLE_DISPATCH_BLOCKED=true');
          console.log('ACS_04B02B_WIN_PRIVATE_IMAGES_TOUCHED=false');
          console.log('ACS_04B02B_WIN_PROVIDER_CALLS=0');
          '@
          $test=Join-Path $dir 'simulate.mjs'
          [IO.File]::WriteAllText($test,$code,[Text.UTF8Encoding]::new($false))
          & node $test $dir
          if ($LASTEXITCODE -ne 0) {throw 'SYNTHETIC_CONSENT_REHEARSAL_FAILED'}
