# Read-only, keyless inspection. No API request, book read, OCR or upload.
name: ACS GLM first attempt receipt read-only audit
on:
  push:
    branches: [ops/mineru-synthetic-retry-20261020-isolated]
    paths: [.github/workflows/acs-glm-receipt-readonly-20261021.yml]
permissions: {}
concurrency:
  group: acs-windows-pdf-local-ownership
  cancel-in-progress: false
jobs:
  inspect:
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.ref == 'refs/heads/ops/mineru-synthetic-retry-20261020-isolated' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 5
    steps:
      - name: Read only existence and metadata for one old GLM attempt
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_OS -ne 'Windows') {throw 'WINDOWS_RUNNER_REQUIRED'}
          $report='D:\ai-cognitive-pdf-benchmark-data\reports\real-mineru-39440805765-1'
          $name='glm-cloud-v1-RB-PDF-13-page-002-region-01'
          $receipt=Join-Path $report ('.'+$name+'.cloud-attempted')
          $stage=Join-Path $report ('.'+$name+'-stage')
          $output=Join-Path $report $name
          if (-not (Test-Path -LiteralPath $report -PathType Container)) {
            Write-Output 'ACS_GLM_PRIVATE_REPORT_PRESENT=false'
            exit 0
          }
          $reportInfo=Get-Item -LiteralPath $report -Force
          if (($reportInfo.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {throw 'PRIVATE_REPORT_REPARSE_POINT'}
          Write-Output 'ACS_GLM_PRIVATE_REPORT_PRESENT=true'
          $names=@('RECEIPT','STAGE','OUTPUT')
          $paths=@($receipt,$stage,$output)
          for ($i=0;$i -lt $paths.Length;$i++) {
            $info=Get-Item -LiteralPath $paths[$i] -Force -ErrorAction SilentlyContinue
            $label=$names[$i]
            if ($null -eq $info) {
              Write-Output ('ACS_GLM_'+$label+'_PRESENT=false')
              continue
            }
            if (($info.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {throw 'UNSAFE_REPARSE_POINT'}
            Write-Output ('ACS_GLM_'+$label+'_PRESENT=true')
            if ($label -eq 'RECEIPT') {
              if ($info.PSIsContainer) {throw 'RECEIPT_IS_DIRECTORY'}
              Write-Output ('ACS_GLM_RECEIPT_BYTES='+$info.Length)
            }
          }
          Write-Output 'ACS_GLM_READ_ONLY_RECEIPT_AUDIT_COMPLETE'
