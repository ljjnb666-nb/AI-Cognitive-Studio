name: ACS Ebook Private Visual Graph Proposal
on:
  pull_request:
    paths:
      - ".github/workflows/acs-ebook-private-visual-graph-proposal.yml"
      - "tools/pdf-parser-benchmark/scripts/ebook_private_visual_graph_proposal.py"
      - "tools/pdf-parser-benchmark/scripts/ebook_semantic_structure_gate.py"
      - "tools/pdf-parser-benchmark/tests/test_ebook_private_visual_graph_proposal.py"
permissions:
  contents: read
concurrency:
  group: acs-ebook-private-graph-proposal
  cancel-in-progress: false
jobs:
  pure-synthetic-graph-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test strict structure and paid-request guard without external API
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile tools/pdf-parser-benchmark/scripts/ebook_private_visual_graph_proposal.py
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_private_visual_graph_proposal.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_semantic_structure_gate.py' -v
          echo "ACS_GRAPH_CONTRACT_TESTS=PASS"
          echo "ACS_GRAPH_SEMANTIC_ACCURACY=UNVERIFIED"
  private-windows-visual-proposal:
    needs: pure-synthetic-graph-contract
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-private-visual-graph-proposal-20261023' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ACS_GLM_VISION_API_KEY: ${{ secrets.ACS_GLM_VISION_API_KEY }}
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
    steps:
      - name: Checkout exact owner-only PR HEAD
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          persist-credentials: false
          clean: false
          path: acs-ebook-private-graph
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Preflight resource limits and SHA-bound private corpus without cloud request
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C acs-ebook-private-graph rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'GRAPH_PROPOSAL_EXACT_HEAD_MISMATCH' }
          $root='D:\ai-cognitive-pdf-benchmark-data'
          if (-not (Test-Path -LiteralPath $root -PathType Container)) { throw 'GRAPH_PROPOSAL_PRIVATE_CORPUS_MISSING' }
          $os=Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
          if ([double]$os.FreePhysicalMemory -lt 2097152) { throw 'GRAPH_PROPOSAL_FREE_RAM_UNDER_2GIB' }
          $drive=Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='D:'" -ErrorAction Stop
          if ([double]$drive.FreeSpace -lt 17179869184) { throw 'GRAPH_PROPOSAL_D_FREE_UNDER_16GIB' }
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'GRAPH_PROPOSAL_PRIVATE_PYTHON_MISSING' }
          & $python -c "import fitz; import requests; import importlib.metadata as m; assert m.version('docling') == '2.141.0'"
          if ($LASTEXITCODE -ne 0) { throw 'GRAPH_PROPOSAL_PYTHON_DEPENDENCY_MISSING' }
          if ([string]::IsNullOrWhiteSpace($env:ACS_GLM_VISION_API_KEY) -and [string]::IsNullOrWhiteSpace($env:GLM_API_KEY)) { throw 'GRAPH_PROPOSAL_PROVIDER_SECRET_NOT_CONFIGURED' }
          $script='acs-ebook-private-graph/tools/pdf-parser-benchmark/scripts/ebook_private_visual_graph_proposal.py'
          $manifest='acs-ebook-private-graph/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          & $python $script --root $root --manifest $manifest --preflight-only
          if ($LASTEXITCODE -ne 0) { throw 'GRAPH_PROPOSAL_PRIVATE_PREFLIGHT_FAILED' }
          Write-Output 'GRAPH_PROPOSAL_PREFLIGHT_PASS'
      - name: Generate private structural proposals (max two paid GLM calls)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='D:\ai-cognitive-pdf-benchmark-data'
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          $script='acs-ebook-private-graph/tools/pdf-parser-benchmark/scripts/ebook_private_visual_graph_proposal.py'
          $manifest='acs-ebook-private-graph/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          & $python $script --root $root --manifest $manifest --allow-cloud-vision
          if ($LASTEXITCODE -ne 0) { throw 'GRAPH_PROPOSAL_INCOMPLETE_OR_AMBIGUOUS_PAID_OUTCOME' }
          Write-Output 'ACS_GRAPH_MODEL=GLM_SAME_FAMILY_AS_L2_NOT_INDEPENDENT_GOLD'
          Write-Output 'ACS_GRAPH_REFERENCE_MATCH=NOT_RUN'
          Write-Output 'ACS_GRAPH_F1=UNVERIFIED'
