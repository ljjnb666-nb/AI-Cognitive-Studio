name: ACS Ebook Private Graph Receipt Readonly Audit

on:
  pull_request:
    paths:
      - ".github/workflows/acs-ebook-private-graph-receipt-audit.yml"
      - "tools/pdf-parser-benchmark/scripts/ebook_private_graph_receipt_audit.py"
      - "tools/pdf-parser-benchmark/tests/test_ebook_private_graph_receipt_audit.py"
      - "tools/pdf-parser-benchmark/docs/BOOK_PRIVATE_GRAPH_RECEIPT_AUDIT_20261023.md"

permissions:
  contents: read

concurrency:
  group: acs-ebook-private-graph-receipt-audit
  cancel-in-progress: false

jobs:
  synthetic-private-receipt-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: \${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact-head private receipt simulation with zero external requests
        env:
          EXPECTED_SHA: \${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile tools/pdf-parser-benchmark/scripts/ebook_private_graph_receipt_audit.py
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_private_graph_receipt_audit.py' -v
          echo "ACS_GRAPH_RECEIPT_SYNTHETIC=PASS"
          echo "ACS_GRAPH_REAL_BILLING=UNVERIFIED"

  owner-only-private-readonly:
    needs: synthetic-private-receipt-audit
    if: \${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-private-graph-receipt-audit-20261023' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 10
    env:
      EXPECTED_SHA: \${{ github.event.pull_request.head.sha }}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Checkout owner-owned exact SHA without secrets
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          persist-credentials: false
          clean: false
          path: acs-ebook-graph-audit
          ref: \${{ github.event.pull_request.head.sha }}
      - name: Inspect only existing D drive request and candidate statuses
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C acs-ebook-graph-audit rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'GRAPH_RECEIPT_SHA_MISMATCH' }
          $root='D:\ai-cognitive-pdf-benchmark-data'
          if (-not (Test-Path -LiteralPath $root -PathType Container)) { throw 'GRAPH_RECEIPT_PRIVATE_ROOT_MISSING' }
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'GRAPH_RECEIPT_CACHED_PYTHON_MISSING' }
          $script='acs-ebook-graph-audit/tools/pdf-parser-benchmark/scripts/ebook_private_graph_receipt_audit.py'
          $manifest='acs-ebook-graph-audit/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          & $python $script --private-root $root --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw 'GRAPH_RECEIPT_PRIVATE_AUDIT_REJECTED' }
          Write-Output 'ACS_GRAPH_RECEIPT_WORKFLOW=READ_ONLY_COMPLETE_NOT_RECOGNITION_SUCCESS'
