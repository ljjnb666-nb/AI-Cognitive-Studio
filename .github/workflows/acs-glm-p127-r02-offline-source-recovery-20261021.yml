# One owner-approved recovery after checkout infrastructure FAILURE; the prior attempt NEVER called GLM.
# This workflow is self-contained: it embeds only PUBLIC SHA-pinned source blobs, not private book data.
# Trigger ONLY a dedicated, single-use approval marker in a separate commit.
name: ACS GLM P127 r02 offline source recovery
on:
  push:
    branches: [ops/mineru-synthetic-retry-20261020-isolated]
    paths:
      - tools/pdf-parser-benchmark/ops/authorize-p127-r02-offline-recovery-20261021.txt
permissions: {}
concurrency:
  group: acs-windows-pdf-local-ownership
  cancel-in-progress: false
jobs:
  offline-one-crop:
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.ref == 'refs/heads/ops/mineru-synthetic-retry-20261020-isolated' && github.event_name == 'push' && github.event.head_commit.message == 'APPROVE ONE P127 GLM R02 OFFLINE SOURCE RECOVERY' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 10
    steps:
      - name: Stage and verify reviewed source blobs without repository checkout
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_OS -ne 'Windows') {throw 'WINDOWS_RUNNER_REQUIRED'}
          $git=(Get-Command git -ErrorAction Stop).Source
          $dir=Join-Path $env:RUNNER_TEMP ('acs-p127-r02-src-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $dir) {throw 'STAGING_DIR_ALREADY_EXISTS'}
          [IO.Directory]::CreateDirectory($dir) | Out-Null
          $utf8NoBom=New-Object System.Text.UTF8Encoding($false)
          # Reviewed commit d8e08c4c1b2ec7e15fec1d8ffa4af58205fc5e42 blob 39a48658e61e6b850481bcc6eca80e2153eefef1
          $parts=@(
            ''
            ''
