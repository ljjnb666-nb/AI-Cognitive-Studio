            ''
          )
          $target=Join-Path $dir 'vision_graph_proposal_contract.py'
          [IO.File]::WriteAllBytes($target,[Convert]::FromBase64String(($parts -join '')))
          $got=(& $git hash-object --no-filters -- $target).Trim()
          if ($LASTEXITCODE -ne 0 -or $got -ne 'fb8a914a109db3d0bb7824e79963ada55d1df4c1') {throw 'PINNED_BLOB_MISMATCH'}
          $root='D:\ai-cognitive-pdf-benchmark-data'
          $report=Join-Path $root 'reports\real-mineru-39440805765-1'
          $py=Join-Path $root 'python\mineru\Scripts\python.exe'
          $old='glm-cloud-v1-RB-PDF-13-page-002-region-01'
          $retry=$old+'-retry-p127-r02-20261021'
          $oldReceipt=Join-Path $report ('.'+$old+'.cloud-attempted')
          if (-not (Test-Path -LiteralPath $py -PathType Leaf) -or -not (Test-Path -LiteralPath $oldReceipt -PathType Leaf)) {throw 'PRIOR_ATTEMPT_OR_PYTHON_MISSING'}
          foreach ($p in @((Join-Path $report ('.'+$retry+'.cloud-attempted')), (Join-Path $report $retry), (Join-Path $report ('.'+$retry+'-stage')))) {
            if (Test-Path -LiteralPath $p) {throw 'SECOND_ATTEMPT_ALREADY_EXISTS'}
          }
          $c=[System.IO.DriveInfo]::new('C')
          $d=[System.IO.DriveInfo]::new('D')
          $os=Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
          if (-not $c.IsReady -or -not $d.IsReady -or $c.AvailableFreeSpace -lt 15GB -or $d.AvailableFreeSpace -lt 25GB -or [double]$os.FreePhysicalMemory -lt 3145728) {throw 'LOCAL_RESOURCE_GUARD_BLOCKED'}
          Write-Output 'ACS_GLM_R02_OFFLINE_BLOBS_AND_RESOURCE_PREFLIGHT_PASS'
      - name: Execute exactly one approved crop using pinned offline source
        shell: powershell
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference='Stop'
          if ([string]::IsNullOrWhiteSpace($env:ZHIPU_API_KEY)) {throw 'ZHIPU_SECRET_MISSING'}
          $py='D:\ai-cognitive-pdf-benchmark-data\python\mineru\Scripts\python.exe'
          $dir=Join-Path $env:RUNNER_TEMP ('acs-p127-r02-src-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          $script=Join-Path $dir 'cloud_glm_vision.py'
          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {throw 'PINNED_SOURCE_MISSING'}
          $lines=@(& $py -I $script --fixture RB-PDF-13 --model glm-5.3-flash --region-id page-002-region-01 --max-regions 1 --allow-cloud-upload --retry-p127-once 2>&1)
          $code=$LASTEXITCODE
          foreach ($line in $lines) {
            $value=[string]$line
            if ($value -match '^ACS_GLM_CLOUD_BLOCKED=CLOUD_[A-Z0-9_]+$') {Write-Output $value}
          }
          if ($code -ne 0) {throw 'ACS_GLM_P127_R02_NOT_ACCEPTED'}
          Write-Output 'ACS_GLM_P127_R02_RESULT_PRIVATE_AND_UNVERIFIED'
      - name: Report only redacted local result categories
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $report='D:\ai-cognitive-pdf-benchmark-data\reports\real-mineru-39440805765-1'
          $name='glm-cloud-v1-RB-PDF-13-page-002-region-01-retry-p127-r02-20261021'
          $receipt=Join-Path $report ('.'+$name+'.cloud-attempted')
          if (-not (Test-Path -LiteralPath $receipt -PathType Leaf)) {
            Write-Output 'ACS_GLM_R02_RECEIPT_PRESENT=false'
          } else {
            Write-Output 'ACS_GLM_R02_RECEIPT_PRESENT=true'
            $r=Get-Item -LiteralPath $receipt -Force
            if (($r.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or $r.Length -gt 65536) {throw 'UNSAFE_RECEIPT'}
            foreach ($line in (Get-Content -LiteralPath $receipt | Select-Object -Skip 1)) {
              try { $ev=ConvertFrom-Json -InputObject $line -ErrorAction Stop } catch {continue}
              if ($ev.event -eq 'RESPONSE_META') {
                if ($ev.finishStatus -in @('STOP','LENGTH','MISSING','OTHER')) { Write-Output ('ACS_GLM_R02_FINISH='+$ev.finishStatus) }
                if ($ev.contentKind -in @('TEXT','MISSING','OTHER')) { Write-Output ('ACS_GLM_R02_CONTENT_KIND='+$ev.contentKind) }
                if ($ev.modelMatchesRequested -is [bool]) { Write-Output ('ACS_GLM_R02_MODEL_MATCH='+([string]$ev.modelMatchesRequested).ToLowerInvariant()) }
                foreach ($k in @('contentChars','promptTokens','completionTokens','choicesCount')) {
                  $v=$ev.$k
                  if ($v -is [int] -and $v -ge -1 -and $v -le 2000000) { Write-Output ('ACS_GLM_R02_'+$k.ToUpperInvariant()+'='+$v) }
                }
              }
              if ($ev.event -eq 'FAILED' -and $ev.errorCode -match '^CLOUD_[A-Z0-9_]{3,70}$') { Write-Output ('ACS_GLM_R02_FAILURE='+$ev.errorCode) }
            }
          }
          if (Test-Path -LiteralPath (Join-Path $report $name) -PathType Container) {
            Write-Output 'ACS_GLM_R02_PRIVATE_OUTPUT_PRESENT=true'
          } else {
            Write-Output 'ACS_GLM_R02_PRIVATE_OUTPUT_PRESENT=false'
          }
