            ''
          )
          $target=Join-Path $dir 'local_vision_proposals.py'
          [IO.File]::WriteAllBytes($target,[Convert]::FromBase64String(($parts -join '')))
          $got=(& $git hash-object --no-filters -- $target).Trim()
          if ($LASTEXITCODE -ne 0 -or $got -ne '2f18feef4b640b5f87e6685304d2eee65ae21659') {throw 'PINNED_BLOB_MISMATCH'}
          # Reviewed commit d8e08c4c1b2ec7e15fec1d8ffa4af58205fc5e42 blob a17929244273d7cff9a690db9749bc846c2214a3
          $parts=@(
            ''
            ''
