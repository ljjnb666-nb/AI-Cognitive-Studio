            'bHMpCiAgICAgICAgc3lzLmV4aXQoMikKICAgIHByaW50KCJBQ1NfUkVHSU9OX1BST1BPU0FMUz0iK2pzb24uZHVtcHMocmVzdWx0LHNvcnRfa2V5cz1UcnVlKSkKCgppZiBfX25hbWVfXz09Il9fbWFpbl9fIjoKICAgIG1haW4oKQo='
          )
          $target=Join-Path $dir 'private_region_proposals.py'
          [IO.File]::WriteAllBytes($target,[Convert]::FromBase64String(($parts -join '')))
          $got=(& $git hash-object --no-filters -- $target).Trim()
          if ($LASTEXITCODE -ne 0 -or $got -ne 'a17929244273d7cff9a690db9749bc846c2214a3') {throw 'PINNED_BLOB_MISMATCH'}
          # Reviewed commit d8e08c4c1b2ec7e15fec1d8ffa4af58205fc5e42 blob fb8a914a109db3d0bb7824e79963ada55d1df4c1
          $parts=@(
            ''
            ''
            ''
