            ''
            'ICAgICBzeXMuZXhpdCgyKQogICAgZXhjZXB0IEV4Y2VwdGlvbjoKICAgICAgICBwcmludCgiQUNTX0dMTV9DTE9VRF9SVU5USU1FX0JMT0NLRUQiKQogICAgICAgIHN5cy5leGl0KDIpCiAgICBwcmludCgiQUNTX0dMTV9DTE9VRF9SRVNVTFQ9IiArIGpzb24uZHVtcHMocmVzdWx0LCBzb3J0X2tleXM9VHJ1ZSkpCgoKaWYgX19uYW1lX18gPT0gIl9fbWFpbl9fIjoKICAgIG1haW4oKQo='
          )
          $target=Join-Path $dir 'cloud_glm_vision.py'
          [IO.File]::WriteAllBytes($target,[Convert]::FromBase64String(($parts -join '')))
          $got=(& $git hash-object --no-filters -- $target).Trim()
          if ($LASTEXITCODE -ne 0 -or $got -ne '39a48658e61e6b850481bcc6eca80e2153eefef1') {throw 'PINNED_BLOB_MISMATCH'}
          # Reviewed commit d8e08c4c1b2ec7e15fec1d8ffa4af58205fc5e42 blob 2f18feef4b640b5f87e6685304d2eee65ae21659
          $parts=@(
            ''
            ''
