# Cloud-only synthetic regression. No self-hosted runner, private book or model.
name: ACS PDF Quality synthetic gate

on:
  pull_request:
    branches: [codex/pdf-parser-benchmark]
    paths:
      - "tools/pdf-parser-benchmark/**"
      - ".github/workflows/acs-pdf-quality-synthetic.yml"
  push:
    branches: [codex/pdf-parser-benchmark]
    paths:
      - "tools/pdf-parser-benchmark/**"
      - ".github/workflows/acs-pdf-quality-synthetic.yml"

permissions:
  contents: read

jobs:
  synthetic-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact-head checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: npm
          cache-dependency-path: tools/pdf-parser-benchmark/package-lock.json
      - name: Install isolated benchmark dependencies with lifecycle scripts disabled
        working-directory: tools/pdf-parser-benchmark
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck offline regrader
        working-directory: tools/pdf-parser-benchmark
        run: ./node_modules/.bin/tsc --noEmit --pretty false
      - name: Human GT gate negative regression (synthetic data only)
        working-directory: tools/pdf-parser-benchmark
        run: ./node_modules/.bin/vitest run tests/real-book-quality-gate.test.ts
      - name: Syntax check offline annotation app and local-only server
        working-directory: tools/pdf-parser-benchmark
        run: |
          node --check annotation/workspace.mjs
          node --check annotation/app.mjs
          node --check annotation/server.mjs
          node --check scripts/serve_gt_annotation.mjs
      - name: Synthetic annotation schema and loopback guard tests
        working-directory: tools/pdf-parser-benchmark
        run: ./node_modules/.bin/vitest run tests/gt-annotation.test.mjs
      - name: CLI fails closed without local human GT (cloud has no private books)
        shell: bash
        working-directory: tools/pdf-parser-benchmark
        run: |
          set +e
          output="$(./node_modules/.bin/tsx scripts/regrade_real_book_quality.ts 2>&1)"
          status=$?
          set -e
          test "$status" -eq 2
          test "$output" = "ACS_PDF_QUALITY_GATE_BLOCKED"
