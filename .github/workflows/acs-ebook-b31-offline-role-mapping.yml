name: ACS Ebook B31 Offline Role Mapping and Provisional Candidate

on:
  pull_request:
    paths:
      - ".github/workflows/acs-ebook-b31-offline-role-mapping.yml"
      - "tools/pdf-parser-benchmark/scripts/ebook_private_b31_offline_role_mapping.py"
      - "tools/pdf-parser-benchmark/tests/test_ebook_private_b31_offline_role_mapping.py"
      - "tools/pdf-parser-benchmark/docs/BOOK_B31_OFFLINE_ID_MAPPING_20261023.md"

permissions:
  contents: read

concurrency:
  group: acs-ebook-b31-offline-role-mapping
  cancel-in-progress: false

jobs:
  synthetic-bijective-graph-mapping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact-head offline mapping and graph contract regression
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile tools/pdf-parser-benchmark/scripts/ebook_private_b31_offline_role_mapping.py
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_private_b31_offline_role_mapping.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_private_graph_role_diagnosis.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_semantic_structure_gate.py' -v
          echo "ACS_B31_OFFLINE_MAPPING_SYNTHETIC=PASS"
          echo "ACS_B31_PROVIDER_CALLS=0"

  windows-private-offline-provisional:
    needs: synthetic-bijective-graph-mapping
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-b31-offline-id-mapping-20261023' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 12
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Checkout owner-only exact SHA without cloud credentials
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          persist-credentials: false
          clean: false
          path: acs-b31-mapping
          ref: ${{ github.event.pull_request.head.sha }}
      - name: D drive exact-source receipt check and read-only normalization preview
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C acs-b31-mapping rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'B31_MAPPING_EXACT_SHA_MISMATCH' }
          $root='D:\ai-cognitive-pdf-benchmark-data'
          if (-not (Test-Path -LiteralPath $root -PathType Container)) { throw 'B31_MAPPING_PRIVATE_ROOT_MISSING' }
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'B31_MAPPING_PRIVATE_PYTHON_MISSING' }
          $marker=Join-Path $root 'semantic_gate\visual_graph_proposal_B31.request.private.json'
          $reply=Join-Path $root 'semantic_gate\visual_graph_proposal_B31.reply.private.json'
          $candidate=Join-Path $root 'semantic_gate\visual_graph_proposal_B31.candidate.private.json'
          foreach ($f in @($marker,$reply)) { if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { throw 'B31_MAPPING_PRIVATE_EVIDENCE_MISSING' } }
          if (Test-Path -LiteralPath $candidate) { throw 'B31_MAPPING_CANDIDATE_EXISTS_STOP' }
          $script='acs-b31-mapping/tools/pdf-parser-benchmark/scripts/ebook_private_b31_offline_role_mapping.py'
          $manifest='acs-b31-mapping/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          & $python $script --private-root $root --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw 'B31_MAPPING_PREVIEW_REJECTED_STOP' }
          if (Test-Path -LiteralPath $candidate) { throw 'B31_MAPPING_PREVIEW_MUTATED_PRIVATE_CANDIDATE' }
          Write-Output 'ACS_B31_ROLE_MAPPING_PREVIEW=PASS_NO_PROVIDER_CALL'
      - name: Atomically create one provisional B31 candidate from existing reply, never gold
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='D:\ai-cognitive-pdf-benchmark-data'
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          $folder=Join-Path $root 'semantic_gate'
          $b15=Join-Path $folder 'visual_graph_proposal_B15.request.private.json'
          $b31marker=Join-Path $folder 'visual_graph_proposal_B31.request.private.json'
          $b31reply=Join-Path $folder 'visual_graph_proposal_B31.reply.private.json'
          foreach ($f in @($b15,$b31marker,$b31reply)) { if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { throw 'B31_MAPPING_REQUIRED_PRIVATE_EVIDENCE_MISSING' } }
          $before15=(Get-FileHash -LiteralPath $b15 -Algorithm SHA256).Hash
          $before31=(Get-FileHash -LiteralPath $b31marker -Algorithm SHA256).Hash
          $beforeReply=(Get-FileHash -LiteralPath $b31reply -Algorithm SHA256).Hash
          $script='acs-b31-mapping/tools/pdf-parser-benchmark/scripts/ebook_private_b31_offline_role_mapping.py'
          $manifest='acs-b31-mapping/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          & $python $script --private-root $root --manifest $manifest --write-candidate
          $exitCode=$LASTEXITCODE
          if ((Get-FileHash -LiteralPath $b15 -Algorithm SHA256).Hash -ne $before15) { throw 'B31_MAPPING_B15_REQUEST_CHANGED' }
          if ((Get-FileHash -LiteralPath $b31marker -Algorithm SHA256).Hash -ne $before31) { throw 'B31_MAPPING_B31_REQUEST_CHANGED' }
          if ((Get-FileHash -LiteralPath $b31reply -Algorithm SHA256).Hash -ne $beforeReply) { throw 'B31_MAPPING_ORIGINAL_REPLY_CHANGED' }
          if ($exitCode -ne 0) { throw 'B31_MAPPING_WRITE_OR_STRUCTURE_REJECTED_STOP_NO_RETRY' }
          $audit='acs-b31-mapping/tools/pdf-parser-benchmark/scripts/ebook_private_graph_receipt_audit.py'
          & $python $audit --private-root $root --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw 'B31_MAPPING_CANDIDATE_POST_AUDIT_FAILED' }
          Write-Output 'ACS_B31_GRAPH_CANDIDATE=PRIVATE_PROVISIONAL_ONLY'
          Write-Output 'ACS_B31_GRAPH_F1=UNVERIFIED'
