name: ACS Ebook B31 One-Shot Private Graph Observation

on:
  pull_request:
    paths:
      - ".github/workflows/acs-ebook-b31-single-private-observation.yml"
      - "tools/pdf-parser-benchmark/docs/BOOK_B31_SINGLE_OBSERVATION_20261023.md"
      - "tools/pdf-parser-benchmark/scripts/ebook_private_visual_graph_proposal.py"
      - "tools/pdf-parser-benchmark/tests/test_ebook_private_visual_graph_proposal.py"

permissions:
  contents: read

concurrency:
  group: acs-ebook-b31-one-shot-private-observation
  cancel-in-progress: false

jobs:
  one-shot-contract-without-cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate exact-head single-book and no-retry barriers
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile tools/pdf-parser-benchmark/scripts/ebook_private_visual_graph_proposal.py
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_private_visual_graph_proposal.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_private_graph_reply_recovery.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_private_graph_receipt_audit.py' -v
          echo "ACS_B31_ONE_SHOT_SYNTHETIC=PASS"
          echo "ACS_B31_ONE_SHOT_REAL_BILLING=NOT_YET_EXECUTED_IN_THIS_JOB"

  owner-only-b31-one-shot:
    needs: one-shot-contract-without-cloud
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-b31-single-paid-observation-20261023' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 18
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      ACS_GLM_VISION_API_KEY: ${{ secrets.ACS_GLM_VISION_API_KEY || secrets.ZHIPU_API_KEY }}
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
    steps:
      - name: Checkout exact SHA, owner-only, with no persisted credentials
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: false
          path: acs-b31-one-shot
      - name: SHA, private corpus, resource and B31 ledger preflight without provider calls
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C acs-b31-one-shot rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'B31_ONE_SHOT_EXACT_HEAD_MISMATCH' }
          $root='D:\ai-cognitive-pdf-benchmark-data'
          if (-not (Test-Path -LiteralPath $root -PathType Container)) { throw 'B31_ONE_SHOT_PRIVATE_CORPUS_MISSING' }
          $os=Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
          if ([double]$os.FreePhysicalMemory -lt 2097152) { throw 'B31_ONE_SHOT_FREE_RAM_UNDER_2GIB' }
          $drive=Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='D:'" -ErrorAction Stop
          if ([double]$drive.FreeSpace -lt 17179869184) { throw 'B31_ONE_SHOT_D_FREE_UNDER_16GIB' }
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'B31_ONE_SHOT_PRIVATE_PYTHON_MISSING' }
          & $python -c "import fitz; import requests; import socks; import importlib.metadata as m; assert m.version('docling') == '2.141.0'"
          if ($LASTEXITCODE -ne 0) { throw 'B31_ONE_SHOT_PYTHON_DEPS_UNAVAILABLE' }
          if ([string]::IsNullOrWhiteSpace($env:ACS_GLM_VISION_API_KEY) -and [string]::IsNullOrWhiteSpace($env:GLM_API_KEY)) { throw 'B31_ONE_SHOT_PROVIDER_SECRET_MISSING' }
          $b15=Join-Path $root 'semantic_gate\visual_graph_proposal_B15.request.private.json'
          if (-not (Test-Path -LiteralPath $b15 -PathType Leaf)) { throw 'B31_ONE_SHOT_B15_QUARANTINE_MISSING' }
          $script='acs-b31-one-shot/tools/pdf-parser-benchmark/scripts/ebook_private_visual_graph_proposal.py'
          $manifest='acs-b31-one-shot/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          & $python $script --root $root --manifest $manifest --book B31 --preflight-only
          if ($LASTEXITCODE -ne 0) { throw 'B31_ONE_SHOT_PREFLIGHT_REJECTED' }
          Write-Output 'ACS_B31_ONE_SHOT_PRIVATE_PREFLIGHT=PASS'
      - name: B31 only, at most one paid call, immutable private reply before validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='D:\ai-cognitive-pdf-benchmark-data'
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          $script='acs-b31-one-shot/tools/pdf-parser-benchmark/scripts/ebook_private_visual_graph_proposal.py'
          $manifest='acs-b31-one-shot/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          $b15=Join-Path $root 'semantic_gate\visual_graph_proposal_B15.request.private.json'
          $before=(Get-FileHash -LiteralPath $b15 -Algorithm SHA256).Hash
          $env:HTTPS_PROXY='socks5h://127.0.0.1:10808'
          $env:HTTP_PROXY='socks5h://127.0.0.1:10808'
          $env:ALL_PROXY='socks5h://127.0.0.1:10808'
          # The Python script creates the B31 request marker O_EXCL BEFORE the
          # outbound request. Unknown/failed outcomes can never be auto-retried.
          & $python $script --root $root --manifest $manifest --book B31 --allow-cloud-vision
          $exitCode=$LASTEXITCODE
          if ((Get-FileHash -LiteralPath $b15 -Algorithm SHA256).Hash -ne $before) { throw 'B31_ONE_SHOT_B15_LEDGER_MUTATED' }
          if ($exitCode -ne 0) { throw 'B31_ONE_SHOT_PRIVATE_RESPONSE_UNVERIFIED_DO_NOT_RETRY' }
          Write-Output 'ACS_B31_ONE_SHOT=PRIVATE_PROPOSAL_ONLY_NOT_GOLD'
          Write-Output 'ACS_B31_INDEPENDENT_GRAPH_GOLD=UNVERIFIED'
          Write-Output 'ACS_B31_GRAPH_F1=UNVERIFIED'
