# Read-only metadata only. No private image content, no provider API or PR mutations.
name: ACS P127 04B02 real provider evidence read-only reconciliation
on:
  push:
    branches: [ops/mineru-synthetic-retry-20261020-isolated]
    paths:
      - .github/workflows/acs-p127-04b02-real-reconcile-readonly-20261021.yml
permissions: {}
concurrency:
  group: acs-windows-pdf-local-ownership
  cancel-in-progress: false
jobs:
  private-readonly:
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 6
    steps:
      - name: Materialize SHA pinned public source offline
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('acs-04b02-reconcile-'+$env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $dir) {throw 'STAGING_REUSE_NOT_ALLOWED'}
          [IO.Directory]::CreateDirectory($dir) | Out-Null
          $git=(Get-Command git -ErrorAction Stop).Source
          # Pinned public SHA dc175e65a943fbba70e9d277d4051654adda26eb
          $parts=@(
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
          )
          $dest=Join-Path $dir 'graph-batch-authorization.mjs'
          [IO.File]::WriteAllBytes($dest,[Convert]::FromBase64String(($parts -join '')))
          $got=(& $git hash-object --no-filters -- $dest).Trim()
          if ($LASTEXITCODE -ne 0 -or $got -ne 'dc175e65a943fbba70e9d277d4051654adda26eb') {throw 'PUBLIC_BLOB_SHA_MISMATCH'}
          # Pinned public SHA 4dd0173c57c0c44792b2b6b7924301df90db5a8b
          $parts=@(
            ''
            ''
            ''
            ''
            ''
            ''
            'MAogIH07Cn0K'
          )
          $dest=Join-Path $dir 'graph-batch-reconcile.mjs'
          [IO.File]::WriteAllBytes($dest,[Convert]::FromBase64String(($parts -join '')))
          $got=(& $git hash-object --no-filters -- $dest).Trim()
          if ($LASTEXITCODE -ne 0 -or $got -ne '4dd0173c57c0c44792b2b6b7924301df90db5a8b') {throw 'PUBLIC_BLOB_SHA_MISMATCH'}
          Write-Output 'ACS_04B02_PUBLIC_BLOBS_VERIFIED=true'
      - name: Read only actual old GLM receipt and output existence
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('acs-04b02-reconcile-'+$env:GITHUB_RUN_ID)
          $root='D:\ai-cognitive-pdf-benchmark-data\reports\real-mineru-39440805765-1'
          $code=@'
          import {pathToFileURL} from 'node:url';
          import {join} from 'node:path';
          const [src,root]=process.argv.slice(2);
          const {reconcileCloudEvidence}=await import(pathToFileURL(join(src,'graph-batch-reconcile.mjs')).href);
          const p127=await reconcileCloudEvidence(root,'RB-PDF-13:page-002-region-01');
          if(p127.state!=='OUTPUT_PRESENT_REQUIRES_PRIVATE_VALIDATION'||
            p127.canAutoRetry!==false||p127.dispatchAuthorized!==false||
            p127.providerRequestsIssuedThisRun!==0){
            console.log('ACS_04B02_P127_UNCERTAIN_REPLAY_BLOCKED');process.exit(2);}
          const unused=await reconcileCloudEvidence(root,'RB-PDF-12:page-001-region-01');
          if(unused.state!=='NO_PRIOR_PROVIDER_EVIDENCE_NOT_AUTHORIZED'||
            unused.canAutoRetry!==false||unused.dispatchAuthorized!==false){
            console.log('ACS_04B02_CROP_ONLY_NEW_CALL_NOT_APPROVED');process.exit(2);}
          console.log('ACS_04B02_P127_EXISTING_OUTPUT_NO_REPLAY_PASS=true');
          console.log('ACS_04B02_CROP_ONLY_NOT_APPROVED_PASS=true');
          console.log('ACS_04B02_REAL_PRIVATE_BYTES_READ=false');
          console.log('ACS_04B02_PROVIDER_CALLS=0');
          '@
          $script=Join-Path $dir 'verify.mjs'
          [IO.File]::WriteAllText($script,$code,[Text.UTF8Encoding]::new($false))
          & node $script $dir $root
          if ($LASTEXITCODE -ne 0) {throw 'OFFLINE_REAL_EVIDENCE_RECONCILE_FAILED'}
