name: PDF Source-linked recognition review packet v1

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  source-to-review-packet:
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/pdf-source-linked-review-packet-v1-20261028' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://app:app@localhost:5432/ai_cognitive_studio_test?schema=public
      DATABASE_URL_TEST: postgresql://app:app@localhost:5432/ai_cognitive_studio_test?schema=public
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: ai-cognitive-studio-dev
      S3_ACCESS_KEY: local-development-only
      S3_SECRET_KEY: local-development-only
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify checked-out exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Verify mixed-page PDF.js native text + visual graph review join
        run: pnpm --filter @ai-cognitive/worker exec vitest run tests/pdf-source-review-packet.test.ts tests/pdf-visual-review.test.ts --reporter=verbose
      - name: Typecheck Worker
        run: pnpm --filter @ai-cognitive/worker typecheck
      - name: Lint Worker
        run: pnpm --filter @ai-cognitive/worker lint
      - name: Strict evidence boundaries
        run: |
          echo 'PDF_SOURCE_REVIEW_PACKET_SYNTHETIC=PASS'
          echo 'PDF_SOURCE_REVIEW_PACKET_ORIGINAL_PDF=PDFKIT_TEST_FIXTURE'
          echo 'PDF_SOURCE_REVIEW_PACKET_PAID_MODEL=NOT_CALLED'
          echo 'PDF_SOURCE_REVIEW_PACKET_BROWSER_UI=NOT_IMPLEMENTED'
          echo 'PDF_SOURCE_REVIEW_PACKET_PRODUCTION_ENABLED=FALSE'
          echo 'PDF_SOURCE_REVIEW_PACKET_GOLD=UNVERIFIED'
