name: B15 B03 Blind Original Image Review Package

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  synthetic:
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-b15-b03-source-image-blind-review-20261024' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline-fixture dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: pymupdf==1.26.5 numpy==1.26.4 opencv-python-headless==4.10.0.84
      - name: Run blind source image source-hash synthetic regression
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile tools/pdf-parser-benchmark/scripts/ebook_b15_b03_blind_source_review.py
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b15_b03_blind_source_review.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_fivebook_three_engine_crossbook.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_fivebook_docling_standard_rapidocr_real.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b15_threeway_gap_spatial.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b15_three_engine_consensus.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b15_docling_standard_rapidocr_real.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b15_docling_standard_layout_real.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b15_docling_rapidocr_fallback.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b15_docling_standard_readiness.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b15_spatial_disagreement.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b15_order_sections.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b15_disagreement_triage.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_fivebook_text_consensus.py' -v
          echo 'ACS_BLIND_REVIEW_SYNTHETIC=PASS'
          echo 'ACS_BLIND_REVIEW_PAID_PROVIDER_CALLS=0'

  windows-private-evidence:
    needs: synthetic
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-b15-b03-source-image-blind-review-20261024' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: acs-blind-images
          persist-credentials: false
          clean: false
      - name: Create and audit private B15 B03 original blind review image pack
        shell: powershell
        timeout-minutes: 19
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C acs-blind-images rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'BLIND_REVIEW_HEAD_MISMATCH' }
          $root='D:\ai-cognitive-pdf-benchmark-data'
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'BLIND_REVIEW_PYTHON_NOT_FOUND' }
          $folder=Join-Path $root 'semantic_gate\multibook_matrix_20261023'
          $output=Join-Path $folder 'b15_b03_source_blind_review_packet.v9.private.json'
          $sources=@('fivebook_rapidocr_mineru_text_consensus.private.json','fivebook_mineru_rapidocr_comparison.private.json','multibook_rapidocr_five_pages.private.json','fivebook_mineru_basic_B15.private.md','fivebook_mineru_basic_B15.private.json','fivebook_mineru_basic_B15.private.log','b15_samepage_ocr_disagreement_triage.private.json','b15_ordinal_quarters_and_order_gap.private.json','b15_spatial_disagreement_heatmap_3x3.private.json','b15_docling_standard_offline_readiness.private.json','b15_docling_standard_rapidocr_fallback.v2.private.json','b15_docling_standard_layout_real.v3.private.json','b15_docling_standard_layout_worker.v3.private.json','b15_docling_standard_layout_worker.v3.private.log','b15_docling_standard_rapidocr_real.v4.private.json','b15_docling_standard_rapidocr_worker.v4.private.json','b15_docling_standard_rapidocr_worker.v4.private.log','b15_samepage_three_engine_consensus.v5.private.json','b15_threeway_spatial_character_gap.v6.private.json','fivebook_docling_standard_rapidocr_real.v7.private.json','fivebook_three_engine_crossbook_consensus.v8.private.json','fivebook_docling_standard_rapidocr_B03.v7.private.json','fivebook_docling_standard_rapidocr_B03.v7.private.worker.json','fivebook_docling_standard_rapidocr_B03.v7.private.worker.log','fivebook_docling_standard_rapidocr_B08.v7.private.json','fivebook_docling_standard_rapidocr_B08.v7.private.worker.json','fivebook_docling_standard_rapidocr_B08.v7.private.worker.log','fivebook_docling_standard_rapidocr_B29.v7.private.json','fivebook_docling_standard_rapidocr_B29.v7.private.worker.json','fivebook_docling_standard_rapidocr_B29.v7.private.worker.log','fivebook_docling_standard_rapidocr_B31.v7.private.json','fivebook_docling_standard_rapidocr_B31.v7.private.worker.json','fivebook_docling_standard_rapidocr_B31.v7.private.worker.log')
          $before=@{}
          foreach ($name in $sources) {
            $file=Join-Path $folder $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw 'BLIND_REVIEW_PROTECTED_SOURCE_MISSING' }
            $before[$file]=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
          }
          $env:HTTP_PROXY='http://127.0.0.1:1'
          $env:HTTPS_PROXY='http://127.0.0.1:1'
          $env:ALL_PROXY='http://127.0.0.1:1'
          $env:NO_PROXY=''
          # Avoid shell quoting on Windows PowerShell -> external Python process.
          & $python -c 'from PIL import Image'
          if ($LASTEXITCODE -ne 0) { throw 'BLIND_REVIEW_PILLOW_REQUIRED_OFFLINE' }
          Write-Output 'ACS_BLIND_REVIEW_LOCAL_IMAGE_CODEC=AVAILABLE'
          $script='acs-blind-images/tools/pdf-parser-benchmark/scripts/ebook_b15_b03_blind_source_review.py'
          $manifest='acs-blind-images/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          if (Test-Path -LiteralPath $output -PathType Leaf) {
            & $python $script --private-root $root --manifest $manifest --audit-only
            if ($LASTEXITCODE -ne 0) { throw 'BLIND_REVIEW_EXISTING_RECEIPT_INVALID' }
          } else {
            & $python $script --private-root $root --manifest $manifest --write
            if ($LASTEXITCODE -ne 0) { throw 'BLIND_REVIEW_WRITE_FAILED' }
            & $python $script --private-root $root --manifest $manifest --audit-only
            if ($LASTEXITCODE -ne 0) { throw 'BLIND_REVIEW_AUDIT_FAILED' }
          }
          # Never claim independent review, OCR gold, or CER from source images.
          # Never deserialize private source text in PowerShell: parse failure
          # must not echo candidate OCR text/coordinates/SHAs into Actions logs.
          & $python 'acs-blind-images/tools/pdf-parser-benchmark/scripts/ebook_private_ci_receipt_gate.py' --private-input $output --policy blind-source
          if ($LASTEXITCODE -ne 0) { throw 'BLIND_REVIEW_FALSE_APPROVAL_OR_MISSING_PAGE' }
          foreach ($name in $sources) {
            $file=Join-Path $folder $name
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $before[$file]) { throw 'BLIND_REVIEW_SOURCE_MUTATED' }
          }
          Write-Output 'ACS_BLIND_REVIEW_UPSTREAM_SOURCES=UNCHANGED'
          Write-Output 'ACS_BLIND_REVIEW_OCR_ACCURACY=UNVERIFIED'
          Write-Output 'ACS_BLIND_REVIEW_NEW_PAID_CALLS=0'
