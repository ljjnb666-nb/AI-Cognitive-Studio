# Only local read-only verification. Public source is pinned by Git Blob SHA.
# NO API secrets, model calls, uploads, private file reads outside the Windows runner.
name: ACS P127 auto-import real-private read-only contract
on:
  push:
    branches: [ops/mineru-synthetic-retry-20261020-isolated]
    paths:
      - .github/workflows/acs-p127-autoload-real-private-readonly-check.yml
permissions: {}
concurrency:
  group: acs-windows-pdf-local-ownership
  cancel-in-progress: false
jobs:
  read-only-private-source-compatibility:
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 7
    steps:
      - name: Stage public pinned P127 validation source with NO repo checkout
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $git=(Get-Command git -ErrorAction Stop).Source
          $node=(Get-Command node -ErrorAction Stop).Source
          $dir=Join-Path $env:RUNNER_TEMP ('acs-p127-autoload-readonly-'+$env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $dir) {throw 'STAGING_ALREADY_PRESENT'}
          [IO.Directory]::CreateDirectory($dir) | Out-Null
          # Public exact SHA c5c152507a2538e0071fe2719daff0c2b1628929
          $parts=@(
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
          )
          $target=Join-Path $dir 'graph-review.mjs'
          [IO.File]::WriteAllBytes($target,[Convert]::FromBase64String(($parts -join '')))
          $got=(& $git hash-object --no-filters -- $target).Trim()
          if ($LASTEXITCODE -ne 0 -or $got -ne 'c5c152507a2538e0071fe2719daff0c2b1628929') {throw 'PUBLIC_BLOB_SHA_MISMATCH'}
          # Public exact SHA 63332dd07c5d0766d3108a7146a69102522231bd
          $parts=@(
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
          )
          $target=Join-Path $dir 'private-graph-local.mjs'
          [IO.File]::WriteAllBytes($target,[Convert]::FromBase64String(($parts -join '')))
          $got=(& $git hash-object --no-filters -- $target).Trim()
          if ($LASTEXITCODE -ne 0 -or $got -ne '63332dd07c5d0766d3108a7146a69102522231bd') {throw 'PUBLIC_BLOB_SHA_MISMATCH'}
          Write-Output 'ACS_P127_AUTO_REVIEW_SOURCE_BLOBS_PASS'
      - name: Verify real private result identity without logging book content
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('acs-p127-autoload-readonly-'+$env:GITHUB_RUN_ID)
          $root='D:\ai-cognitive-pdf-benchmark-data\reports\real-mineru-39440805765-1'
          $script=@'
          import { pathToFileURL } from 'node:url';
          import { join } from 'node:path';
          const dir=process.argv[2],root=process.argv[3];
          const source=await import(pathToFileURL(join(dir,'private-graph-local.mjs')).href);
          let bundle;
          try {bundle=await source.readPrivateP127Bundle(root);} catch(error) {
            const code=typeof error.code==='string'&&/^PRIVATE_[A-Z0-9_]{3,80}$/.test(error.code)?error.code:'PRIVATE_IMPORT_UNEXPECTED';
            console.log('ACS_P127_AUTO_REAL_IMPORT_BLOCKED='+code);process.exit(2);
          }
          if(bundle.view.physicalPage!==127 || bundle.view.nodes.length!==9 || bundle.view.edges.length!==10
            || bundle.view.reviewStatus!=='NOT_REVIEWED' || bundle.view.graphVerified!==false) {
            console.log('ACS_P127_AUTO_REAL_EXPECTED_COUNTS_BLOCKED');process.exit(2);
          }
          console.log('ACS_P127_AUTO_REAL_PROVENANCE_PASS');
          console.log('ACS_P127_AUTO_REAL_NODE_COUNT=9');
          console.log('ACS_P127_AUTO_REAL_EDGE_COUNT=10');
          console.log('ACS_P127_AUTO_REAL_REVIEW_STATUS=NOT_REVIEWED');
          console.log('ACS_P127_AUTO_REAL_PRIVATE_DATA_NOT_PRINTED=true');
          '@
          $testFile=Join-Path $dir 'readonly-check.mjs'
          [IO.File]::WriteAllText($testFile,$script,[Text.UTF8Encoding]::new($false))
          & node $testFile $dir $root
          if ($LASTEXITCODE -ne 0) {throw 'REAL_PRIVATE_IMPORT_CONTRACT_REJECTED'}
