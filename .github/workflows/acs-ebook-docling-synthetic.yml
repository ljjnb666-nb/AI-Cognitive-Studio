name: ACS Docling Synthetic PDF Comparison
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/pdf-parser-benchmark/scripts/ebook_docling_synthetic_benchmark.py'
      - 'tools/pdf-parser-benchmark/scripts/ebook_synthetic_column_truth.py'
      - '.github/workflows/acs-ebook-docling-synthetic.yml'
permissions:
  contents: read
jobs:
  docling-synthetic:
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-tool-selection-20261022' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Docling and OCR dependencies
        run: |
          python -m pip install --disable-pip-version-check docling pillow rapidfuzz
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng fonts-noto-cjk
      - name: Compare Docling against synthetic ground truth
        run: |
          python tools/pdf-parser-benchmark/scripts/ebook_docling_synthetic_benchmark.py --output /tmp/acs-docling-synthetic-metadata.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acs-docling-synthetic-metadata
          path: /tmp/acs-docling-synthetic-metadata.json
          if-no-files-found: ignore
          retention-days: 3
