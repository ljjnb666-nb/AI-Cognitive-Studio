name: Security Private CI Receipt Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  private-receipt-no-leak-synthetic:
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/private-ci-receipt-gate-stacked-20261024' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert no private OCR receipt can be printed on parser failure
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile tools/pdf-parser-benchmark/scripts/ebook_private_ci_receipt_gate.py
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_private_ci_receipt_gate.py' -v
          echo 'ACS_PRIVATE_CI_SECURITY_SYNTHETIC=PASS'
          echo 'ACS_PRIVATE_CI_SOURCE_TEXT_EXPORTED=FALSE'
          echo 'ACS_PRIVATE_CI_LOG_DELETION=SEPARATELY_REQUIRED'

  # Read-only compatibility test against existing D: private receipts.
  # This does not rerun OCR, create references, or expose source content.
  owner-only-windows-readonly-receipt-gate:
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/private-ci-receipt-gate-stacked-20261024' }}
    needs: private-receipt-no-leak-synthetic
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 15
    steps:
      - name: Checkout exact owner PR HEAD without persisted credentials
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: acs-security-receipts
          clean: false
          persist-credentials: false
      - name: Audit existing private receipts without reading raw text into Actions
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference='Stop'
          try {
            if ((git -C acs-security-receipts rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'HEAD_MISMATCH' }
            $root='D:\ai-cognitive-pdf-benchmark-data'
            if (-not (Test-Path -LiteralPath $root -PathType Container)) { throw 'PRIVATE_ROOT_MISSING' }
            $rootEntry=Get-Item -LiteralPath $root -Force -ErrorAction Stop
            if (($rootEntry.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'PRIVATE_ROOT_REPARSE' }
            $python=(Get-Command python -ErrorAction Stop).Source
            $gate='acs-security-receipts/tools/pdf-parser-benchmark/scripts/ebook_private_ci_receipt_gate.py'
            $matrix=Join-Path $root 'semantic_gate\multibook_matrix_20261023'
            $reports=Join-Path $root 'reports'
            $required=@(
              @{ Policy='fivebook-standard'; Name='fivebook_docling_standard_rapidocr_real.v7.private.json' },
              @{ Policy='fivebook-consensus'; Name='fivebook_three_engine_crossbook_consensus.v8.private.json' },
              @{ Policy='blind-source'; Name='b15_b03_source_blind_review_packet.v9.private.json' },
              @{ Policy='blind-workbench'; Name='blind_source_offline_review_workbench.v10.private.json' },
              @{ Policy='edge-workbench'; Name='blind_source_offline_review_workbench.v10.private.json' }
            )
            foreach ($entry in $required) {
              $privateFile=Join-Path $matrix $entry.Name
              if (-not (Test-Path -LiteralPath $privateFile -PathType Leaf)) { throw 'REQUIRED_PRIVATE_SNAPSHOT_NOT_PRESENT' }
              & $python $gate --private-input $privateFile --policy $entry.Policy
              if ($LASTEXITCODE -ne 0) { throw 'REQUIRED_PRIVATE_RECEIPT_REJECTED' }
            }
            Write-Output 'ACS_PRIVATE_EXISTING_SNAPSHOTS=5_OF_5_VERIFIED'
            # Legacy receipts were generated by historic SHA-specific jobs;
            # absence is reported as NOT_PRESENT, not represented as PASS.
            $legacy=@(
              @{ Tag='B15_FRAME'; Policy='legacy-b15-frame'; Pattern='ebook-b15-calibrated-*.private.json' },
              @{ Tag='MINERU_FLASH'; Policy='legacy-mineru-flash'; Pattern='ebook-mineru-flash-*.private.json' },
              @{ Tag='ROTATION'; Policy='legacy-rotation'; Pattern='ebook-rotation-real-*.private.json' },
              @{ Tag='VISUAL_L2'; Policy='legacy-visual-l2'; Pattern='ebook-l2-visual-roi-*.private.json' }
            )
            foreach ($entry in $legacy) {
              $matches=@()
              if (Test-Path -LiteralPath $reports -PathType Container) {
                $matches=@(Get-ChildItem -LiteralPath $reports -Filter $entry.Pattern -File -ErrorAction Stop | Sort-Object LastWriteTime -Descending | Select-Object -First 1)
              }
              if ($matches.Count -eq 0) {
                Write-Output ('ACS_PRIVATE_LEGACY_'+$entry.Tag+'=NOT_PRESENT')
                continue
              }
              & $python $gate --private-input $matches[0].FullName --policy $entry.Policy
              if ($LASTEXITCODE -ne 0) { throw 'LEGACY_PRIVATE_RECEIPT_REJECTED' }
              Write-Output ('ACS_PRIVATE_LEGACY_'+$entry.Tag+'=ONE_EXISTING_RECEIPT_VERIFIED')
            }
            Write-Output 'ACS_PRIVATE_RECEIPT_READONLY=PASS'
            Write-Output 'ACS_PRIVATE_RECEIPT_NEW_OCR_CALLS=0'
            Write-Output 'ACS_PRIVATE_RECEIPT_NEW_CLOUD_CALLS=0'
          } catch {
            # Never stringify an exception: source paths and raw OCR must not leak.
            Write-Output 'ACS_PRIVATE_RECEIPT_READONLY=REJECTED'
            exit 2
          }
