name: ACS Ebook Windows Docling Real Private Pages
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/pdf-parser-benchmark/scripts/ebook_windows_docling_real.py'
      - 'tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
      - '.github/workflows/acs-ebook-windows-docling-real.yml'
permissions:
  contents: read
concurrency:
  group: acs-ebook-windows-docling-private
  cancel-in-progress: false
jobs:
  docling-real:
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-tool-selection-20261022' && github.event.pull_request.user.login == 'ljjnb666-nb' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 40
    steps:
      - name: Checkout exact same-repo PR head
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          persist-credentials: false
          clean: false
          path: acs-ebook-docling-private
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Resource-gated isolated Docling install and 3 real-page evaluation
        shell: powershell
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C acs-ebook-docling-private rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'ACS_DOCLING_EXACT_SHA_MISMATCH' }
          $os=Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
          if ([double]$os.FreePhysicalMemory -lt 4194304) { throw 'ACS_DOCLING_FREE_RAM_UNDER_4GIB' }
          $drive=Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='D:'" -ErrorAction Stop
          if ([double]$drive.FreeSpace -lt 17179869184) { throw 'ACS_DOCLING_D_DRIVE_FREE_UNDER_16GIB' }
          $private='D:\ai-cognitive-pdf-benchmark-data'
          if (-not (Test-Path -LiteralPath $private -PathType Container)) { throw 'ACS_DOCLING_PRIVATE_CORPUS_NOT_FOUND' }
          $cache=Join-Path $private 'model-cache'
          $tool=Join-Path $private 'tool-env\docling-2.141.0'
          $temp=Join-Path $private 'temp'
          foreach($dir in @($cache,$temp,(Split-Path $tool -Parent))) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
          $env:HF_HOME=$cache
          $env:TORCH_HOME=(Join-Path $cache 'torch')
          $env:TEMP=$temp
          $env:TMP=$temp
          $env:HTTPS_PROXY='socks5h://127.0.0.1:10808'
          $env:HTTP_PROXY='socks5h://127.0.0.1:10808'
          $env:ALL_PROXY='socks5h://127.0.0.1:10808'
          $python=(Get-Command python -ErrorAction Stop).Source
          $venvPython=Join-Path $tool 'Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $venvPython -PathType Leaf)) {
            & $python -m venv $tool
            if ($LASTEXITCODE -ne 0) { throw 'ACS_DOCLING_VENV_CREATE_FAILED' }
          }
          $version=(& $venvPython -c "import importlib.util, importlib.metadata; print(importlib.metadata.version('docling') if importlib.util.find_spec('docling') else '')").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'ACS_DOCLING_SAFE_VERSION_INSPECTION_FAILED' }
          if ($version -ne '2.141.0') {
            $sock=(& $venvPython -c "import importlib.util; print('yes' if importlib.util.find_spec('socks') else 'no')").Trim()
            if ($sock -ne 'yes') {
              $curl=(Get-Command curl.exe -ErrorAction Stop).Source
              $json=Join-Path $temp 'pysocks-1.7.1-metadata.json'
              & $curl --fail --silent --show-error --location --max-time 45 --proxy 'socks5h://127.0.0.1:10808' 'https://pypi.org/pypi/PySocks/1.7.1/json' --output $json
              if ($LASTEXITCODE -ne 0) { throw 'ACS_DOCLING_PYSOCKS_METADATA_FETCH_FAILED' }
              $metadata=Get-Content -LiteralPath $json -Raw | ConvertFrom-Json
              $wheels=@($metadata.urls | Where-Object { $_.filename -eq 'PySocks-1.7.1-py3-none-any.whl' })
              if ($wheels.Count -ne 1) { throw 'ACS_DOCLING_PYSOCKS_WHEEL_MISSING' }
              $wheel=$wheels[0]
              if ($wheel.url -notmatch '^https://files[.]pythonhosted[.]org/') { throw 'ACS_DOCLING_PYSOCKS_HOST_REJECTED' }
              $wheelfile=Join-Path $temp 'PySocks-1.7.1-py3-none-any.whl'
              & $curl --fail --silent --show-error --location --max-time 45 --proxy 'socks5h://127.0.0.1:10808' $wheel.url --output $wheelfile
              if ($LASTEXITCODE -ne 0) { throw 'ACS_DOCLING_PYSOCKS_WHEEL_FETCH_FAILED' }
              $sha=(Get-FileHash -LiteralPath $wheelfile -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($sha -ne '2725bd0a9925919b9b51739eea5f9e2bae91e83288108a9ad338b2e3a4435ee5') { throw 'ACS_DOCLING_PYSOCKS_SHA256_INVALID' }
              & $venvPython -m pip install --disable-pip-version-check --no-index --no-deps --no-input $wheelfile
              if ($LASTEXITCODE -ne 0) { throw 'ACS_DOCLING_PYSOCKS_OFFLINE_INSTALL_FAILED' }
              Write-Output 'ACS_DOCLING_PYSOCKS_SHA_VERIFIED_AND_BOOTSTRAPPED'
            }
            & $venvPython -m pip install --disable-pip-version-check --no-input --no-cache-dir --retries 2 --timeout 20 'docling==2.141.0' 'pymupdf>=1.24,<2'
            if ($LASTEXITCODE -ne 0) { throw 'ACS_DOCLING_ISOLATED_INSTALL_FAILED' }
          }
          $socksio=(& $venvPython -c "import importlib.util; print('yes' if importlib.util.find_spec('socksio') else 'no')").Trim()
          if ($socksio -ne 'yes') {
            & $venvPython -m pip install --disable-pip-version-check --no-input --no-cache-dir --retries 2 --timeout 20 --only-binary=:all: 'socksio==1.0.0'
            if ($LASTEXITCODE -ne 0) { throw 'ACS_DOCLING_SOCKSIO_INSTALL_FAILED' }
          }
          Write-Output 'ACS_DOCLING_SOCKS_HTTPX_READY'
          $onnx=(& $venvPython -c "import importlib.util; print('yes' if importlib.util.find_spec('onnxruntime') else 'no')").Trim()
          if ($onnx -ne 'yes') {
            & $venvPython -m pip install --disable-pip-version-check --no-input --no-cache-dir --retries 2 --timeout 20 --only-binary=:all: 'onnxruntime==1.31.0'
            if ($LASTEXITCODE -ne 0) { throw 'ACS_DOCLING_ONNXRUNTIME_CPU_INSTALL_FAILED' }
          }
          Write-Output 'ACS_DOCLING_RAPIDOCR_ONNX_RUNTIME_READY'
          $script='acs-ebook-docling-private/tools/pdf-parser-benchmark/scripts/ebook_windows_docling_real.py'
          $manifest='acs-ebook-docling-private/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          $output=Join-Path $private ('reports\ebook-docling-real-' + $env:EXPECTED_SHA.Substring(0,12) + '.private.json')
          & $venvPython $script --root $private --manifest $manifest --output $output
          if ($LASTEXITCODE -ne 0) { throw 'ACS_DOCLING_REAL_PAGE_BENCHMARK_FAILED' }
          Write-Output 'ACS_DOCLING_REAL_PAGE_METADATA_SAVED_TO_D_DRIVE_ONLY'
          $report=Get-Content -LiteralPath $output -Raw -Encoding UTF8 | ConvertFrom-Json
          if (@($report.rows).Count -ne 3 -or @($report.failed).Count -ne 0 -or @($report.missing).Count -ne 0) { throw 'ACS_DOCLING_REAL_REPORT_ROW_INVARIANT_FAILED' }
          Write-Output ('ACS_DOCLING_REAL_DOC_VERSION=' + $report.docling_version)
          Write-Output ('ACS_DOCLING_REAL_OCR_BACKEND=' + $report.docling_ocr_backend)
          foreach ($entry in $report.rows) {
            if ($entry.status -ne 'SUCCESS') { throw 'ACS_DOCLING_REAL_REPORT_PAGE_NOT_SUCCESS' }
            foreach ($metric in $entry.results) {
              $label=($entry.book_id + '_P' + $entry.physical_page + '_' + ($metric.engine -replace '[^A-Za-z0-9]+','_'))
              if ($metric.status -eq 'NOT_INSTALLED') {
                Write-Output ('ACS_DOCLING_REAL_METRIC=' + $label + '|NOT_INSTALLED')
              } else {
                Write-Output ('ACS_DOCLING_REAL_METRIC=' + $label + '|CHARS=' + $metric.characters + '|MS=' + $metric.wall_ms)
                if ($null -ne $metric.native_reference_cer) { Write-Output ('ACS_DOCLING_REAL_NATIVE_REFERENCE_CER=' + $label + '|' + $metric.native_reference_cer) }
                if ($metric.engine -eq 'Docling') {
                  if ($null -eq $metric.layout_evidence -or $metric.layout_evidence.graph_semantics -ne 'UNVERIFIED') { throw 'ACS_DOCLING_LAYOUT_EVIDENCE_MISSING_OR_UNSAFE' }
                  $layout=$metric.layout_evidence
                  if ($entry.book_id -in @('B15','B31')) {
                    if ($layout.picture_items -le 0 -or $layout.picture_boxes_with_geometry -ne $layout.picture_items) { throw 'ACS_SCANNED_PICTURE_GEOMETRY_MISSING' }
                  }
                  if ($entry.book_id -eq 'B15' -and $layout.source_pdf_rotation_degrees -ne 270) { throw 'ACS_B15_ROTATION_CHANGED' }
                  if ($entry.book_id -eq 'B31' -and $layout.source_pdf_rotation_degrees -ne 0) { throw 'ACS_B31_ROTATION_CHANGED' }
                  Write-Output ('ACS_DOCLING_LAYOUT=' + $label + '|TEXT=' + $layout.text_items + '|PICTURES=' + $layout.picture_items + '|BOXES=' + $layout.picture_boxes_with_geometry + '|ROTATION=' + $layout.source_pdf_rotation_degrees + '|ALIGNMENT=' + $layout.spatial_alignment_status + '|GRAPH=UNVERIFIED')
                }
              }
            }
          }
