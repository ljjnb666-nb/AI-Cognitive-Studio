# Only trusted public source + already-existing private P127 result; no writes, API or output.
name: ACS P127 03E03 generic contract real-private read-only
on:
  push:
    branches: [ops/mineru-synthetic-retry-20261020-isolated]
    paths:
      - .github/workflows/acs-p127-03e03-general-contract-readonly-20261021.yml
permissions: {}
concurrency:
  group: acs-windows-pdf-local-ownership
  cancel-in-progress: false
jobs:
  contract:
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 6
    steps:
      - name: Offline stage and verify public exact Git source blobs
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('acs-03e03-generic-'+$env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $dir) {throw 'REUSED_STAGING_NOT_ALLOWED'}
          [IO.Directory]::CreateDirectory($dir) | Out-Null
          $git=(Get-Command git -ErrorAction Stop).Source
          # Reviewed public exact Git Blob c5c152507a2538e0071fe2719daff0c2b1628929
          $parts=@(
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            'ys7CiAgICAgIGVsc2UgaWYgKGQuZGVjaXNpb24gPT09ICJWSVNJQkxFX01JU01BVENIIikgY291bnRzLm1pc21hdGNoKys7IGVsc2UgY291bnRzLnVuY2VydGFpbisrOyB9CiAgfQogIHJldHVybiB7Li4uY291bnRzLCBzdGF0dXM6UkVWSUVXX1NUQVRVUyxjZXJ0aWZpZWQ6ZmFsc2V9Owp9Cg=='
          )
          $target=Join-Path $dir 'graph-review.mjs'
          [IO.File]::WriteAllBytes($target,[Convert]::FromBase64String(($parts -join '')))
          $got=(& $git hash-object --no-filters -- $target).Trim()
          if ($LASTEXITCODE -ne 0 -or $got -ne 'c5c152507a2538e0071fe2719daff0c2b1628929') {throw 'SOURCE_BLOB_SHA_INVALID'}
          # Reviewed public exact Git Blob 73c7187511badd6eceea45f7a76af06f54841f4f
          $parts=@(
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
          )
          $target=Join-Path $dir 'private-graph-local.mjs'
          [IO.File]::WriteAllBytes($target,[Convert]::FromBase64String(($parts -join '')))
          $got=(& $git hash-object --no-filters -- $target).Trim()
          if ($LASTEXITCODE -ne 0 -or $got -ne '73c7187511badd6eceea45f7a76af06f54841f4f') {throw 'SOURCE_BLOB_SHA_INVALID'}
          # Reviewed public exact Git Blob ccd65d243ab86566c3ca920294c85b15eb92a55a
          $parts=@(
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
          )
          $target=Join-Path $dir 'region-graph-review.mjs'
          [IO.File]::WriteAllBytes($target,[Convert]::FromBase64String(($parts -join '')))
          $got=(& $git hash-object --no-filters -- $target).Trim()
          if ($LASTEXITCODE -ne 0 -or $got -ne 'ccd65d243ab86566c3ca920294c85b15eb92a55a') {throw 'SOURCE_BLOB_SHA_INVALID'}
          Write-Output 'ACS_03E03_PUBLIC_SOURCE_PINNED=true'
      - name: Compare strict generic region parser against existing real P127 parser
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('acs-03e03-generic-'+$env:GITHUB_RUN_ID)
          $root='D:\ai-cognitive-pdf-benchmark-data\reports\real-mineru-39440805765-1'
          $js=@'
          import {pathToFileURL} from 'node:url';
          import {join} from 'node:path';
          const [dir,root]=process.argv.slice(2);
          const legacy=await import(pathToFileURL(join(dir,'private-graph-local.mjs')).href);
          const generic=await import(pathToFileURL(join(dir,'region-graph-review.mjs')).href);
          let bundle;
          try{bundle=await legacy.readPrivateP127Bundle(root);}
          catch(e){console.log('ACS_03E03_LEGACY_P127_SOURCE_BLOCKED');process.exit(2);}
          const doc=JSON.parse(Buffer.from(bundle.data.resultBase64,'base64').toString('utf8'));
          const manifest=JSON.parse(Buffer.from(bundle.data.manifestBase64,'base64').toString('utf8'));
          const registration={fixtureId:'RB-PDF-13',regionId:'page-002-region-01',sourcePhysicalPage1Based:127,
            sourceRun:'real-mineru-39440805765-1',provider:'ZHIPU_GLMCLOUD_STANDARD_API',
            model:'glm-5.3-flash',attemptClass:'EXPLICIT_P127_SECOND_ATTEMPT',
            expectedResultSha256:bundle.identity.resultSha256,expectedCropSha256:bundle.identity.cropSha256};
          let view;
          try{view=generic.validateRegionGraphCandidate(doc,manifest,bundle.identity,registration);}
          catch(e){console.log('ACS_03E03_GENERIC_P127_CONTRACT_REJECTED');process.exit(2);}
          const expected=bundle.view;
          if(view.fixtureId!==expected.fixtureId||view.regionId!==expected.regionId||view.physicalPage!==127
            ||view.nodes.length!==9||view.edges.length!==10||view.graphVerified!==false
            ||JSON.stringify(view.nodes)!==JSON.stringify(expected.nodes)
            ||JSON.stringify(view.edges)!==JSON.stringify(expected.edges)){
            console.log('ACS_03E03_GENERIC_P127_PARITY_FAILED');process.exit(2);
          }
          const draft=generic.createRegionReviewDraft(view);
          if(draft.graphVerified!==false||draft.humanVerified!==false||draft.status!=='REVIEW_DRAFT_UNATTESTED')process.exit(2);
          if(generic.regionReviewDraftFilename(view).includes('/')||generic.regionReviewDraftFilename(view).includes('\\'))process.exit(2);
          console.log('ACS_03E03_GENERIC_REAL_P127_PARITY_PASS=true');
          console.log('ACS_03E03_REAL_P127_NODE_COUNT=9');
          console.log('ACS_03E03_REAL_P127_EDGE_COUNT=10');
          console.log('ACS_03E03_REAL_SOURCE_REVIEW_STATUS=NOT_REVIEWED');
          console.log('ACS_03E03_P127_REVIEW_DRAFT_CREATED=false');
          console.log('ACS_03E03_NO_PRIVATE_DATA_PUBLISHED=true');
          '@
          $script=Join-Path $dir 'readonly-verify.mjs'
          [IO.File]::WriteAllText($script,$js,[Text.UTF8Encoding]::new($false))
          & node $script $dir $root
          if ($LASTEXITCODE -ne 0) {throw 'PRIVATE_03E03_GENERIC_PARITY_NOT_VERIFIED'}
