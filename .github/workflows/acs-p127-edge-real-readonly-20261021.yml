      - name: Load real P127 into isolated Edge but disable draft mutations
        shell: powershell
        env:
          NODE_OPTIONS: '--no-warnings'
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('acs-p127-real-edge-readonly-'+$env:GITHUB_RUN_ID)
          $root='D:\ai-cognitive-pdf-benchmark-data\reports\real-mineru-39440805765-1'
          $node=(Get-Command node -ErrorAction Stop).Source
          $edgePaths=@("${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe","${env:ProgramFiles}\Microsoft\Edge\Application\msedge.exe","${env:LOCALAPPDATA}\Microsoft\Edge\Application\msedge.exe")
          $edge=@($edgePaths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1)
          if ($edge.Count -ne 1 -or -not (Test-Path -LiteralPath $root -PathType Container)) {throw 'P127_EDGE_RESOURCE_OR_DATA_NOT_READY'}
          $os=Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
          if ([double]$os.FreePhysicalMemory -lt 1572864) {throw 'EDGE_MEMORY_GUARD_BLOCKED'}
          & $node (Join-Path $dir 'scripts\edge_p127_real_readonly.mjs') ('--edge='+$edge[0]) ('--root='+$root)
          if ($LASTEXITCODE -ne 0) {throw 'P127_REAL_EDGE_READONLY_FAILED'}
          Write-Output 'ACS_P127_EDGE_PRIVATE_READONLY_ACCEPTANCE_PASS'
