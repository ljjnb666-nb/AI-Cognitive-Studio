name: ACS B31 Source Shaft Tip Geometry Consensus

on:
  pull_request:
    paths:
      - ".github/workflows/acs-b31-arrow-shaft-consensus.yml"
      - "tools/pdf-parser-benchmark/scripts/ebook_b31_arrow_shaft_consensus.py"
      - "tools/pdf-parser-benchmark/tests/test_ebook_b31_arrow_shaft_consensus.py"
      - "tools/pdf-parser-benchmark/docs/BOOK_B31_ARROW_SHAFT_CONSENSUS_20261023.md"

permissions:
  contents: read

concurrency:
  group: acs-b31-source-shaft-consensus
  cancel-in-progress: false

jobs:
  synthetic-source-shaft-tip:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact-head immutable source-only shaft, alignment and privacy regressions
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile tools/pdf-parser-benchmark/scripts/ebook_b31_arrow_shaft_consensus.py
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b31_arrow_shaft_consensus.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b31_independent_source_packet.py' -v
          echo "ACS_B31_SOURCE_SHAFT_SYNTHETIC=PASS"
          echo "ACS_B31_SOURCE_SHAFT_PROVIDER_REQUESTS=0"

  real-windows-source-shaft:
    needs: synthetic-source-shaft-tip
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-b31-arrow-shaft-consensus-20261023' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 12
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Checkout exact source-only SHA without model keys
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          persist-credentials: false
          clean: false
          path: acs-b31-source-shaft
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify B31 source CV receipt, preview then private output without provider calls
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C acs-b31-source-shaft rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'B31_SHAFT_HEAD_MISMATCH' }
          $root='D:\ai-cognitive-pdf-benchmark-data'
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'B31_SHAFT_PYTHON_UNAVAILABLE' }
          $folder=Join-Path $root 'semantic_gate'
          $output=Join-Path $folder 'b31_arrow_shaft_consensus.private.json'
          if (Test-Path -LiteralPath $output) { throw 'B31_SHAFT_EXISTING_REPORT_NO_OVERWRITE' }
          $protected=@(
            (Join-Path $folder 'b31_source_only_page126.private.png'),
            (Join-Path $folder 'b31_source_only_page126.private.json'),
            (Join-Path $folder 'b31_source_raster_geometry.private.json'),
            (Join-Path $folder 'b31_opencv_source_candidates.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B15.request.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B31.request.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B31.reply.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B31.candidate.private.json')
          )
          $before=@{}
          foreach ($file in $protected) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw 'B31_SHAFT_PRIVATE_SOURCE_MISSING' }
            $before[$file]=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
          }
          $script='acs-b31-source-shaft/tools/pdf-parser-benchmark/scripts/ebook_b31_arrow_shaft_consensus.py'
          $manifest='acs-b31-source-shaft/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          & $python $script --private-root $root --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw 'B31_SHAFT_SOURCE_PREVIEW_REJECTED' }
          if (Test-Path -LiteralPath $output) { throw 'B31_SHAFT_READONLY_PREVIEW_MUTATED_REPORT' }
          & $python $script --private-root $root --manifest $manifest --write
          if ($LASTEXITCODE -ne 0) { throw 'B31_SHAFT_PRIVATE_REPORT_FAILED' }
          foreach ($file in $protected) {
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $before[$file]) { throw 'B31_SHAFT_PRIOR_EVIDENCE_MUTATED' }
          }
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw 'B31_SHAFT_REPORT_MISSING' }
          Write-Output 'ACS_B31_SHAFT_PRIVATE_SOURCE=CREATED_NO_MODEL'
          Write-Output 'ACS_B31_SHAFT_GRAPH_GOLD=UNVERIFIED'
          Write-Output 'ACS_B31_SHAFT_DIRECTION_CERTIFIED=FALSE'
          Write-Output 'ACS_B31_SHAFT_PROVIDER_CALLS=0'
