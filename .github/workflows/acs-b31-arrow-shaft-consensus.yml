name: ACS B31 Source Shaft and V-Tip Review Gate

on:
  pull_request:
    paths:
      - ".github/workflows/acs-b31-arrow-shaft-consensus.yml"
      - "tools/pdf-parser-benchmark/scripts/ebook_b31_multiscale_vtip_review.py"
      - "tools/pdf-parser-benchmark/tests/test_ebook_b31_multiscale_vtip_review.py"
      - "tools/pdf-parser-benchmark/docs/BOOK_B31_MULTISCALE_VTIP_20261023.md"

permissions:
  contents: read

concurrency:
  group: acs-b31-multiscale-vtip-private
  cancel-in-progress: false

jobs:
  synthetic-v-wing-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned synthetic OpenCV dependency only
        run: python -m pip install --disable-pip-version-check --only-binary=:all: numpy==1.26.4 opencv-python-headless==4.10.0.84
      - name: Exact-head isolated source wing test
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile tools/pdf-parser-benchmark/scripts/ebook_b31_multiscale_vtip_review.py
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b31_multiscale_vtip_review.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b31_arrow_shaft_consensus.py' -v
          echo "ACS_B31_VTIP_SYNTHETIC=PASS"
          echo "ACS_B31_VTIP_NEW_PROVIDER_REQUESTS=0"

  owner-only-windows-private-vtip:
    needs: synthetic-v-wing-source
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-b31-multiscale-vtip-review-20261023' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 12
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Checkout exact HEAD without model credentials
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: false
          path: acs-b31-vtip
      - name: Real source-only B31 multi-scale pixel review on private D
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C acs-b31-vtip rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'B31_VTIP_HEAD_MISMATCH' }
          $root='D:\ai-cognitive-pdf-benchmark-data'
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'B31_VTIP_PYTHON_MISSING' }
          & $python -c "import cv2,numpy; assert cv2.__version__ and numpy.__version__"
          if ($LASTEXITCODE -ne 0) { throw 'B31_VTIP_CV_DEPENDENCY_MISSING' }
          $folder=Join-Path $root 'semantic_gate'
          $json=Join-Path $folder 'b31_multiscale_vtip_source.private.json'
          $overlay=Join-Path $folder 'b31_multiscale_vtip_review.private.png'
          if ((Test-Path -LiteralPath $json) -or (Test-Path -LiteralPath $overlay)) { throw 'B31_VTIP_PREVIOUS_OUTPUT_EXISTS_NO_OVERWRITE' }
          $protected=@(
            (Join-Path $folder 'b31_source_only_page126.private.png'),
            (Join-Path $folder 'b31_source_only_page126.private.json'),
            (Join-Path $folder 'b31_source_raster_geometry.private.json'),
            (Join-Path $folder 'b31_opencv_source_candidates.private.json'),
            (Join-Path $folder 'b31_arrow_shaft_consensus.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B15.request.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B31.request.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B31.reply.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B31.candidate.private.json')
          )
          $before=@{}
          foreach ($f in $protected) {
            if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { throw 'B31_VTIP_PRIOR_PRIVATE_EVIDENCE_MISSING' }
            $before[$f]=(Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash
          }
          $script='acs-b31-vtip/tools/pdf-parser-benchmark/scripts/ebook_b31_multiscale_vtip_review.py'
          $manifest='acs-b31-vtip/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          & $python $script --private-root $root --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw 'B31_VTIP_READONLY_PREVIEW_FAILED' }
          if ((Test-Path -LiteralPath $json) -or (Test-Path -LiteralPath $overlay)) { throw 'B31_VTIP_PREVIEW_MUTATED_FILES' }
          & $python $script --private-root $root --manifest $manifest --write
          if ($LASTEXITCODE -ne 0) { throw 'B31_VTIP_PRIVATE_CREATE_FAILED' }
          foreach ($f in $protected) {
            if ((Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash -ne $before[$f]) { throw 'B31_VTIP_PREVIOUS_EVIDENCE_CHANGED' }
          }
          if (-not (Test-Path -LiteralPath $json -PathType Leaf) -or -not (Test-Path -LiteralPath $overlay -PathType Leaf)) { throw 'B31_VTIP_PARTIAL_OUTPUT_INVALID' }
          Write-Output 'ACS_B31_VTIP_PRIVATE_SOURCE_OVERLAY=CREATED'
          Write-Output 'ACS_B31_VTIP_ARROWS_CERTIFIED=FALSE'
          Write-Output 'ACS_B31_VTIP_GRAPH_GOLD=UNVERIFIED'
          Write-Output 'ACS_B31_VTIP_PROVIDER_CALLS=0'
