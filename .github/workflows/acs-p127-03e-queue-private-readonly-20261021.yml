# Read-only listing: no private bytes leave runner, no API key, no GLM.
name: ACS 03E real private crop queue read-only
on:
  push:
    branches: [ops/mineru-synthetic-retry-20261020-isolated]
    paths:
      - .github/workflows/acs-p127-03e-queue-private-readonly-20261021.yml
permissions: {}
concurrency:
  group: acs-windows-pdf-local-ownership
  cancel-in-progress: false
jobs:
  inventory:
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 6
    steps:
      - name: Verify public 03E implementation source blobs offline
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('acs-03e-readonly-'+$env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $dir) {throw 'STAGING_ALREADY_EXISTS'}
          [IO.Directory]::CreateDirectory($dir) | Out-Null
          $git=(Get-Command git -ErrorAction Stop).Source
          # Pinned reviewed c5c152507a2538e0071fe2719daff0c2b1628929
          $parts=@(
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
          )
          $dest=Join-Path $dir 'graph-review.mjs'
          [IO.File]::WriteAllBytes($dest,[Convert]::FromBase64String(($parts -join '')))
          $got=(& $git hash-object --no-filters -- $dest).Trim()
          if ($LASTEXITCODE -ne 0 -or $got -ne 'c5c152507a2538e0071fe2719daff0c2b1628929') {throw 'PINNED_SOURCE_SHA_MISMATCH'}
          # Pinned reviewed 243b0b996da2ae22852bc992f628baf970a73a2a
          $parts=@(
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
          )
          $dest=Join-Path $dir 'private-graph-local.mjs'
          [IO.File]::WriteAllBytes($dest,[Convert]::FromBase64String(($parts -join '')))
          $got=(& $git hash-object --no-filters -- $dest).Trim()
          if ($LASTEXITCODE -ne 0 -or $got -ne '243b0b996da2ae22852bc992f628baf970a73a2a') {throw 'PINNED_SOURCE_SHA_MISMATCH'}
          Write-Output 'ACS_03E_PUBLIC_BLOBS_VERIFIED=true'
      - name: Inventory bounded real private evidence without disclosing book data
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('acs-03e-readonly-'+$env:GITHUB_RUN_ID)
          $root='D:\ai-cognitive-pdf-benchmark-data\reports\real-mineru-39440805765-1'
          $script=@'
          import { pathToFileURL } from 'node:url';
          import { join } from 'node:path';
          const dir=process.argv[2],root=process.argv[3];
          const mod=await import(pathToFileURL(join(dir,'private-graph-local.mjs')).href);
          let queue;
          try { queue=await mod.listPrivateGraphReviewQueue(root); }
          catch(e){
            const code=typeof e?.code==='string'&&/^PRIVATE_[A-Z0-9_]{3,80}$/.test(e.code)?e.code:'PRIVATE_QUEUE_UNEXPECTED';
            console.log('ACS_03E_REAL_QUEUE_BLOCKED='+code);process.exit(2);
          }
          if(queue.schemaVersion!=='acs-private-graph-review-queue-v1'||queue.authority!=='DISCOVERY_ONLY_NOT_GROUND_TRUTH')process.exit(2);
          const all=queue.items;
          if(!Array.isArray(all)||all.length!==queue.counts.total||all.length>32)process.exit(2);
          if(!all.every(i=>i.graphVerified===false&&i.humanVerified===false))process.exit(2);
          if(!all.some(i=>i.id==='RB-PDF-13:page-002-region-01'&&i.reviewable===true&&i.nodeCount===9&&i.edgeCount===10)){
            console.log('ACS_03E_REAL_P127_REQUIRED_REVIEWABLE_MISSING');process.exit(2);
          }
          console.log('ACS_03E_REAL_QUEUE_PASS=true');
          console.log('ACS_03E_REAL_ITEM_COUNT='+queue.counts.total);
          console.log('ACS_03E_REAL_READY_COUNT='+queue.counts.ready);
          console.log('ACS_03E_REAL_CROP_ONLY_COUNT='+queue.counts.cropOnly);
          console.log('ACS_03E_REAL_BLOCKED_COUNT='+queue.counts.blocked);
          console.log('ACS_03E_REAL_NO_PRIVATE_BOOK_DETAILS=true');
          '@
          $file=Join-Path $dir 'readonly-queue.mjs'
          [IO.File]::WriteAllText($file,$script,[Text.UTF8Encoding]::new($false))
          & node $file $dir $root
          if ($LASTEXITCODE -ne 0) {throw 'REAL_03E_QUEUE_GUARD_REJECTED'}
