name: ACS Ebook B15 Independent Frame Calibration

on:
  pull_request:
    paths:
      - ".github/workflows/acs-ebook-b15-frame-private.yml"
      - "tools/pdf-parser-benchmark/scripts/ebook_b15_independent_frame.py"
      - "tools/pdf-parser-benchmark/scripts/ebook_roi_rotation_contract.py"
      - "tools/pdf-parser-benchmark/scripts/ebook_windows_docling_real.py"
      - "tools/pdf-parser-benchmark/tests/test_ebook_b15_independent_frame.py"

permissions:
  contents: read

concurrency:
  group: acs-ebook-b15-private-frame
  cancel-in-progress: false

jobs:
  synthetic-independent-frame-contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify independent pixel-landmark frame and no-gold tests
        run: |
          python -m py_compile tools/pdf-parser-benchmark/scripts/ebook_b15_independent_frame.py tools/pdf-parser-benchmark/scripts/ebook_windows_docling_real.py
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b15_independent_frame.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_roi_rotation_contract.py' -v
          echo 'ACS_B15_SYNTHETIC_FRAME_PASS'
          echo 'ACS_B15_REAL_SPATIAL_IOU=UNVERIFIED'

  real-private-pdf-frame:
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.ref == 'bench/ebook-b15-independent-frame-20261023' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Checkout exact authorized owner PR HEAD
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          persist-credentials: false
          clean: false
          path: acs-ebook-b15-private
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify offline input, SHA, L2 reference, cached model, and memory
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C acs-ebook-b15-private rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'ACS_B15_EXACT_SHA_MISMATCH' }
          $root='D:\ai-cognitive-pdf-benchmark-data'
          if (-not (Test-Path -LiteralPath $root -PathType Container)) { throw 'ACS_B15_PRIVATE_ROOT_MISSING' }
          if (-not (Test-Path -LiteralPath (Join-Path $root 'semantic_gate\B15_B31_roi_candidates.private.json') -PathType Leaf)) { throw 'ACS_B15_PRIVATE_AI_L2_REFERENCE_MISSING' }
          $os=Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
          if ([double]$os.FreePhysicalMemory -lt 4194304) { throw 'ACS_B15_FREE_RAM_UNDER_4GIB' }
          $drive=Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='D:'" -ErrorAction Stop
          if ([double]$drive.FreeSpace -lt 17179869184) { throw 'ACS_B15_D_FREE_UNDER_16GIB' }
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'ACS_B15_PRIVATE_PYTHON_MISSING' }
          & $python -c "import fitz; import docling; import importlib.metadata as m; assert m.version('docling') == '2.141.0'"
          if ($LASTEXITCODE -ne 0) { throw 'ACS_B15_CACHED_DOCLING_INVALID' }
          Write-Output 'ACS_B15_RESOURCE_AND_L2_PRIVATE_PREFLIGHT=PASS'
      - name: Collect real Docling B15 page size without using AI ROI to select frame
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='D:\ai-cognitive-pdf-benchmark-data'
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          $env:HF_HOME=Join-Path $root 'model-cache'
          $env:TORCH_HOME=Join-Path $root 'model-cache\torch'
          $env:TEMP=Join-Path $root 'temp'
          $env:TMP=$env:TEMP
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          $tool='acs-ebook-b15-private/tools/pdf-parser-benchmark/scripts/ebook_windows_docling_real.py'
          $manifest='acs-ebook-b15-private/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          $report=Join-Path $root ('reports\ebook-b15-frame-measured-'+$env:EXPECTED_SHA.Substring(0,12)+'.private.json')
          & $python $tool --root $root --manifest $manifest --output $report
          if ($LASTEXITCODE -ne 0) { throw 'ACS_B15_PRECALIBRATION_DOCLING_FAILED' }
          Write-Output 'ACS_B15_PRIVATE_DOCLING_PAGE_ASPECT_RECORDED'
      - name: Verify independent raster landmark correspondence and persist private frame
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='D:\ai-cognitive-pdf-benchmark-data'
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          $manifest='acs-ebook-b15-private/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          $report=Join-Path $root ('reports\ebook-b15-frame-measured-'+$env:EXPECTED_SHA.Substring(0,12)+'.private.json')
          $tool='acs-ebook-b15-private/tools/pdf-parser-benchmark/scripts/ebook_b15_independent_frame.py'
          & $python $tool --private-root $root --manifest $manifest --docling-report $report
          if ($LASTEXITCODE -ne 0) { throw 'ACS_B15_INDEPENDENT_FRAME_UNVERIFIED' }
          Write-Output 'ACS_B15_FRAME_ANCHOR_DATA=PRIVATE_D_DRIVE_ONLY'
      - name: Run real Docling again and check independently calibrated B15 overlap
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='D:\ai-cognitive-pdf-benchmark-data'
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          $env:HF_HOME=Join-Path $root 'model-cache'
          $env:TORCH_HOME=Join-Path $root 'model-cache\torch'
          $env:TEMP=Join-Path $root 'temp'
          $env:TMP=$env:TEMP
          $tool='acs-ebook-b15-private/tools/pdf-parser-benchmark/scripts/ebook_windows_docling_real.py'
          $manifest='acs-ebook-b15-private/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          $report=Join-Path $root ('reports\ebook-b15-calibrated-'+$env:EXPECTED_SHA.Substring(0,12)+'.private.json')
          & $python $tool --root $root --manifest $manifest --output $report
          if ($LASTEXITCODE -ne 0) { throw 'ACS_B15_PRIVATE_POST_CALIBRATION_FAILED' }
          $json=Get-Content -LiteralPath $report -Raw -Encoding UTF8 | ConvertFrom-Json
          $b15=@($json.rows | Where-Object book_id -eq 'B15')
          if ($b15.Count -ne 1) { throw 'ACS_B15_REAL_PAGE_REPORT_MISSING' }
          $metric=@($b15[0].results | Where-Object engine -eq 'Docling')
          if ($metric.Count -ne 1) { throw 'ACS_B15_REAL_DOCLING_METRIC_MISSING' }
          $layout=$metric[0].layout_evidence
          if ($null -eq $layout.spatial_alignment) { throw 'ACS_B15_PRIVATE_ALIGNMENT_MISSING' }
          if ($layout.graph_semantics -ne 'UNVERIFIED') { throw 'ACS_B15_GRAPH_SEMANTICS_CLAIM_INVALID' }
          $match=$layout.spatial_alignment
          Write-Output ('ACS_B15_REAL_PROVISIONAL_STATUS='+$layout.spatial_alignment_status)
          Write-Output ('ACS_B15_REAL_PROVISIONAL_MATCHED='+$match.one_to_one_region_matches+'|REFS='+$match.reference_region_count+'|PICTURES='+$match.detected_picture_box_count)
          Write-Output 'ACS_B15_REAL_REFERENCE=AI_L2_PROVISIONAL_NOT_HUMAN_GOLD'
          Write-Output 'ACS_B15_REAL_GRAPH_F1=UNVERIFIED'
