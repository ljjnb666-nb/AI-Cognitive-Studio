name: PDF RapidOCR real ONNX synthetic smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  real-offline-ocr-synthetic:
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/pdf-human-review-original-page-v1-20261028' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Require exact PR HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/ingestion/tests/python/rapidocr-model-smoke-requirements.txt
      - name: Install pinned local-only OCR model/runtime dependencies
        run: python -m pip install --disable-pip-version-check --only-binary=:all: -r packages/ingestion/tests/python/rapidocr-model-smoke-requirements.txt
      - name: Verify actual PyMuPDF raster + pinned RapidOCR ONNX inference
        timeout-minutes: 5
        run: python -I -B packages/ingestion/tests/python/rapidocr_model_smoke.py
      - name: Evidence scope
        run: |
          echo 'RAPIDOCR_ACTUAL_ONNX_INFERENCE=VERIFIED_SYNTHETIC_IMAGE_ONLY_PDF'
          echo 'RAPIDOCR_PRODUCTION_B03_CER=UNVERIFIED'
          echo 'RAPIDOCR_SOURCE_BYTES=NO_PRIVATE_BOOKS'
          echo 'RAPIDOCR_CLOUD_API_KEYS=NONE'
          echo 'RAPIDOCR_GOLD_OR_ENGINE_RANKING=NOT_CLAIMED'
