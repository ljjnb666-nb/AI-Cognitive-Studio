# Pure offline plan, no GLM keys, no model calls, no changes to private evidence.
name: ACS 03E04 Windows private offline no-spend batch plan
on:
  push:
    branches: [ops/mineru-synthetic-retry-20261020-isolated]
    paths:
      - .github/workflows/acs-pdf-03e04-offline-plan-readonly-20261021.yml
permissions: {}
concurrency:
  group: acs-windows-pdf-local-ownership
  cancel-in-progress: false
