      - name: Read-only real Windows private evidence batch planning
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('acs-03e04-plan-'+$env:GITHUB_RUN_ID)
          $root='D:\ai-cognitive-pdf-benchmark-data\reports\real-mineru-39440805765-1'
          $js=@'
          import {pathToFileURL} from 'node:url';
          import {join} from 'node:path';
          const [dir,root]=process.argv.slice(2);
          const planner=await import(pathToFileURL(join(dir,'graph-batch-plan.mjs')).href);
          let plan;
          try{plan=await planner.buildPrivateGraphBatchPlan(root);}
          catch(e){const code=e?.code?.match?.(/^[A-Z0-9_]{5,75}$/)?.[0]||'UNEXPECTED';
            console.log('ACS_03E04_REAL_PLAN_BLOCKED='+code);process.exit(2);}
          if(plan.schemaVersion!=='acs-offline-graph-batch-plan-v1'||
             plan.authority!=='PREVIEW_ONLY_NO_PROVIDER_DISPATCH'||
             plan.dispatchEnabled!==false||plan.providerRequestsIssued!==0||
             plan.needsExplicitPaidAuthorization!==true||
             plan.priceEstimate!==null||
             plan.counts.discovered!==15||plan.counts.alreadyHasGraph!==1||
             plan.counts.eligible+plan.counts.excluded!==15||
             plan.planned.length!==plan.counts.eligible||
             plan.planned.some(x=>x.id==='RB-PDF-13:page-002-region-01')){
            console.log('ACS_03E04_REAL_PLAN_AUTHORITY_REJECTED');process.exit(2);}
          const summary=planner.publicGraphBatchSummary(plan);
          if(summary.dispatchEnabled!==false||JSON.stringify(summary).includes('pngBase64')||
             JSON.stringify(summary).includes('cropSha256'))process.exit(2);
          console.log('ACS_03E04_REAL_READONLY_PLAN_PASS=true');
          console.log('ACS_03E04_REAL_DISCOVERED='+plan.counts.discovered);
          console.log('ACS_03E04_REAL_EXISTING_GRAPH='+plan.counts.alreadyHasGraph);
          console.log('ACS_03E04_REAL_ELIGIBLE='+plan.counts.eligible);
          console.log('ACS_03E04_REAL_BLOCKED='+plan.counts.blocked);
          console.log('ACS_03E04_REAL_LIMIT_EXCLUDED='+plan.counts.limitExcluded);
          console.log('ACS_03E04_REAL_PROVIDER_CALLS=0');
          console.log('ACS_03E04_REAL_NO_PRIVATE_IMAGE_EXPORTED=true');
          '@
          $script=Join-Path $dir 'run-plan.mjs'
          [IO.File]::WriteAllText($script,$js,[Text.UTF8Encoding]::new($false))
          & node $script $dir $root
          if ($LASTEXITCODE -ne 0) {throw 'PRIVATE_PLAN_GATE_BLOCKED'}
