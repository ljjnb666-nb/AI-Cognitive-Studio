# One explicit owner-authorized GLM cloud call, not a generic runner.
# Valid only on fixed operations branch, exactly one SHA-pinned private crop.
# Never upload source PDFs/Markdown or print image, token, model answer, paths.
name: ACS private GLM first single-crop inference
on:
  push:
    branches:
      - ops/mineru-synthetic-retry-20261020-isolated
    paths:
      - .github/workflows/acs-glm-single-crop-20261021.yml
permissions: {}
concurrency:
  group: acs-windows-pdf-local-ownership
  cancel-in-progress: false
jobs:
  first-cloud-inference:
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.ref == 'refs/heads/ops/mineru-synthetic-retry-20261020-isolated' && github.event_name == 'push' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 9
    env:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Run one validated GLM crop (no automatic retries)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_OS -ne 'Windows') {throw 'WINDOWS_RUNNER_REQUIRED'}
          if ([string]::IsNullOrWhiteSpace($env:ZHIPU_API_KEY)) {
            Write-Output 'ACS_GLM_REPO_SECRET_PRESENT=false'
            throw 'ZHIPU_REPO_SECRET_UNAVAILABLE'
          }
          Write-Output 'ACS_GLM_REPO_SECRET_PRESENT=true'
          $data='D:\ai-cognitive-pdf-benchmark-data'
          $py=Join-Path $data 'python\mineru\Scripts\python.exe'
          $c=[System.IO.DriveInfo]::new('C')
          $d=[System.IO.DriveInfo]::new('D')
          $os=Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
          if (-not (Test-Path -LiteralPath $py -PathType Leaf) -or -not $c.IsReady -or -not $d.IsReady -or
              $c.AvailableFreeSpace -lt 15GB -or $d.AvailableFreeSpace -lt 25GB -or
              [double]$os.FreePhysicalMemory -lt 3145728) {throw 'LOCAL_RESOURCE_GUARD_BLOCKED'}
          $scripts=Join-Path $env:RUNNER_TEMP ('acs-cloud-glm-20261021-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $scripts) {throw 'TRUSTED_SCRIPT_DIRECTORY_EXISTS'}
          New-Item -ItemType Directory -Path $scripts -ErrorAction Stop | Out-Null
          $target=Join-Path $scripts 'private_region_proposals.py'
          $body=@'
          """Private SHA-bound page-region proposals for MinerU PDF figure evidence.
          
          This is an offline image-region proposal, NOT a semantic diagram interpreter.
          The detected regions may include prose. No graph nodes/edges are certified.
          No private images, OCR, names or coordinates are sent to GitHub Actions.
          """
          from __future__ import annotations
          
          import argparse
          import hashlib
          import json
          import os
          import re
          import shutil
          import sys
          from pathlib import Path
          
          ROOT = Path(r"D:\ai-cognitive-pdf-benchmark-data")
          SOURCE_RUN = "real-mineru-39440805765-1"
          PAGES = {"RB-PDF-12": [73, 145, 261], "RB-PDF-13": [51, 127, 379]}
          MAX_PNG_BYTES = 20_000_000
          MAX_SOURCE_PDF_BYTES = 2_000_000_000
          MAX_PIXELS = 32_000_000
          MAX_ROIS_PER_PAGE = 4
          
          
          class RegionBlocked(ValueError):
              pass
          
          
          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      digest.update(chunk)
              return digest.hexdigest()
          
          
          def unsafe_link(path: Path) -> bool:
              return path.is_symlink() or bool(getattr(path, "is_junction", lambda: False)())
          
          
          def directory(path: Path) -> None:
              if unsafe_link(path) or not path.is_dir():
                  raise RegionBlocked("PRIVATE_DIRECTORY_NOT_READY")
          
          
          def file_ok(path: Path, maximum: int) -> bool:
              return not unsafe_link(path) and path.is_file() and 0 < path.stat().st_size <= maximum
          
          
          def source_images(root: Path, fixture: str) -> list[dict]:
              """Validate prior private provenance, not paths inferred from OCR."""
              if fixture not in PAGES:
                  raise RegionBlocked("FIXTURE_NOT_ALLOWED")
              directory(root)
              directory(root / "fixtures")
              directory(root / "reports")
              report = root / "reports" / SOURCE_RUN
              base = report / ("figure-evidence-v1-" + fixture)
              for path in (report, base, base / "pages"):
                  directory(path)
              manifest = base / "figure-evidence.json"
              if not file_ok(manifest, 1_048_576):
                  raise RegionBlocked("FIGURE_MANIFEST_NOT_READY")
              try:
                  record = json.loads(manifest.read_text(encoding="utf-8"))
              except (ValueError, UnicodeError):
                  raise RegionBlocked("FIGURE_MANIFEST_UNREADABLE") from None
              if (record.get("schemaVersion") != "acs-mineru-figure-page-evidence-v1"
                      or record.get("sourceRun") != SOURCE_RUN
                      or record.get("fixtureId") != fixture
                      or record.get("sourcePages1Based") != PAGES[fixture]
                      or record.get("claim") != "PERSISTED_FULL_PAGE_VISUAL_FALLBACK_ONLY"
                      or record.get("noCroppedFigureOrDiagramRelationshipClaim") is not True):
                  raise RegionBlocked("FIGURE_MANIFEST_IDENTITY_MISMATCH")
              source = root / "fixtures" / (fixture + ".pdf")
              md = report / (fixture + ".md")
              if not file_ok(source, MAX_SOURCE_PDF_BYTES) or not file_ok(md, 12_000_000):
                  raise RegionBlocked("SOURCE_NOT_READY")
              if (sha256_file(source) != record.get("sourceSubsetSha256")
                      or sha256_file(md) != record.get("sourceMarkdownSha256")):
                  raise RegionBlocked("SOURCE_CHANGED")
              images = record.get("images")
              if not isinstance(images, list) or not 1 <= len(images) <= 3:
                  raise RegionBlocked("IMAGE_ROWS_INVALID")
              result = []
              seen = set()
              for im in images:
                  if not isinstance(im, dict):
                      raise RegionBlocked("IMAGE_ROW_INVALID")
                  idx = im.get("subsetPageIndex")
                  if type(idx) is not int or not 0 <= idx < 3 or idx in seen:
                      raise RegionBlocked("PAGE_INDEX_INVALID")
                  seen.add(idx)
                  physical = im.get("sourcePhysicalPage1Based")
                  path_string = im.get("relativeImagePath")
                  if physical != PAGES[fixture][idx] or path_string != f"pages/page-{idx+1:03d}.png":
                      raise RegionBlocked("IMAGE_PAGE_OR_PATH_INVALID")
                  image = base / path_string
                  if not file_ok(image, MAX_PNG_BYTES) or image.stat().st_size != im.get("imageBytes"):
                      raise RegionBlocked("IMAGE_BYTES_CHANGED")
                  if sha256_file(image) != im.get("imageSha256"):
                      raise RegionBlocked("IMAGE_SHA_CHANGED")
                  w, h = im.get("widthPixels"), im.get("heightPixels")
                  if (type(w) is not int or type(h) is not int or w < 30 or h < 30
                          or w > 8192 or h > 8192 or w * h > MAX_PIXELS):
                      raise RegionBlocked("IMAGE_DIMENSIONS_INVALID")
                  refs = im.get("sourceFigureBlockRefs")
                  if (not isinstance(refs, list) or not 1 <= len(refs) <= 100
                          or len(set(refs)) != len(refs)
                          or not all(isinstance(v, str) and re.fullmatch(
                              r"doc:[0-9a-f]{6,64}/tier:flash/page:[1-3]/block:[1-9][0-9]{0,5}", v
                          ) for v in refs)):
                      raise RegionBlocked("IMAGE_BLOCK_REFS_INVALID")
                  if (im.get("regionType") != "FULL_PAGE_UNCROPPED"
                          or im.get("graphSemantics") != "NOT_VERIFIED"
                          or im.get("figureRegionBounds") is not None
                          or im.get("diagramEdges") is not None):
                      raise RegionBlocked("UNJUSTIFIED_GRAPH_CLAIM")
                  result.append({"subsetPageIndex": idx, "physicalPage": physical,
                                 "path": image, "sha": im["imageSha256"],
                                 "width": w, "height": h, "refs": refs})
              return sorted(result, key=lambda x: x["subsetPageIndex"])
          
          
          def rectangle_iou(a: tuple[int, int, int, int],
                            b: tuple[int, int, int, int]) -> float:
              ax, ay, aw, ah = a
              bx, by, bw, bh = b
              left, top = max(ax, bx), max(ay, by)
              right, bottom = min(ax + aw, bx + bw), min(ay + ah, by + bh)
              intersection = max(0, right-left) * max(0, bottom-top)
              union = aw*ah + bw*bh - intersection
              return intersection/union if union > 0 else 0.0
          
          
          def constrain_region(box: tuple[int, int, int, int], width: int,
                               height: int, padding: int = 8) -> tuple[int, int, int, int] | None:
              if (not 0 < width <= 8192 or not 0 < height <= 8192
                      or not isinstance(box, (tuple, list)) or len(box) != 4
                      or not all(type(x) is int for x in box)
                      or not 0 <= padding <= 80):
                  return None
              x, y, w, h = box
              if w <= 0 or h <= 0 or x + w <= 0 or y + h <= 0 or x >= width or y >= height:
                  return None
              left, top = max(0, x-padding), max(0, y-padding)
              right, bottom = min(width, x+w+padding), min(height, y+h+padding)
              if right-left < 20 or bottom-top < 20:
                  return None
              return (left, top, right-left, bottom-top)
          
          
          def select_regions(raw: list[tuple[int, int, int, int]], width: int,
                             height: int, cap: int = MAX_ROIS_PER_PAGE) -> list[tuple[int, int, int, int]]:
              """Bound proposal count with deterministic area-ranking and overlap suppression.
          
              Candidates are NOT recognized figures. They may include ordinary paragraphs.
              """
              if not 1 <= cap <= MAX_ROIS_PER_PAGE or width * height > MAX_PIXELS:
                  raise RegionBlocked("INVALID_REGION_BUDGET")
              candidates = set()
              for raw_box in raw[:1000]:
                  rect = constrain_region(raw_box, width, height)
                  if rect is None:
                      continue
                  x,y,w,h=rect
                  fraction=w*h/(width*height)
                  if fraction < .008 or fraction > .90:
                      continue
                  if w < width * .12 or h < height * .055:
                      continue
                  candidates.add(rect)
              ordered = sorted(candidates, key=lambda b:(-b[2]*b[3], b[1], b[0], b[2], b[3]))
              kept=[]
              for proposal in ordered:
                  if all(rectangle_iou(proposal, other) < .68 for other in kept):
                      kept.append(proposal)
                  if len(kept) == cap:
                      break
              return kept
          
          
          def propose_regions(image) -> list[dict]:
              """Offline OpenCV multi-scale morphology. Heuristics, not probabilities."""
              import cv2
              height,width=image.shape[:2]
              if width*height > MAX_PIXELS:
                  raise RegionBlocked("RASTER_TOO_LARGE")
              gray=cv2.cvtColor(image,cv2.COLOR_BGR2GRAY)
              _,binary=cv2.threshold(gray,0,255,cv2.THRESH_BINARY_INV | cv2.THRESH_OTSU)
              proposals=[]
              for scale_x,scale_y in ((.025,.013),(.045,.032),(.065,.042)):
                  kw=max(5, int(width*scale_x)//2*2+1)
                  kh=max(5, int(height*scale_y)//2*2+1)
                  merged=cv2.morphologyEx(binary,cv2.MORPH_CLOSE,
                                         cv2.getStructuringElement(cv2.MORPH_RECT,(kw,kh)))
                  num, _, stats, _=cv2.connectedComponentsWithStats(merged,connectivity=8)
                  if num > 80_000:
                      raise RegionBlocked("PAGE_TOO_COMPLEX")
                  for x,y,w,h,area in stats[1:]:
                      if area<max(30,width*height*.0005):
                          continue
                      proposals.append((int(x),int(y),int(w),int(h)))
              boxes=select_regions(proposals,width,height)
              if not boxes:
                  coords=cv2.findNonZero(binary)
                  if coords is not None:
                      fallback=constrain_region(tuple(map(int,cv2.boundingRect(coords))),
                                                width,height,16)
                      if fallback is not None:
                          boxes=[fallback]
              return [{"bboxPixels":list(b), "proposalKind":"MORPHOLOGY_REGION_UNVERIFIED" if proposals
                       else "INK_EXTENT_FALLBACK_UNVERIFIED"} for b in boxes]
          
          
          def run(root: Path, fixture: str) -> dict:
              import cv2
              inputs=source_images(root,fixture)
              report=root/"reports"/SOURCE_RUN
              final=report/("region-proposals-v1-"+fixture)
              stage=report/(".region-proposals-stage-v1-"+fixture)
              if final.exists() or stage.exists() or unsafe_link(final) or unsafe_link(stage):
                  raise RegionBlocked("REGION_OUTPUT_EXISTS")
              stage.mkdir()
              total=0
              processed=[]
              try:
                  (stage/"crops").mkdir()
                  for item in inputs:
                      img=cv2.imread(str(item["path"]),cv2.IMREAD_COLOR)
                      if img is None or img.shape[1] != item["width"] or img.shape[0] != item["height"]:
                          raise RegionBlocked("PNG_DECODE_OR_SIZE_CHANGED")
                      proposals=propose_regions(img)
                      per=[]
                      for index,proposal in enumerate(proposals):
                          x,y,w,h=proposal["bboxPixels"]
                          if (x<0 or y<0 or w<20 or h<20 or x+w>item["width"] or y+h>item["height"]):
                              raise RegionBlocked("REGION_OUT_OF_SOURCE_BOUNDS")
                          roi=img[y:y+h,x:x+w]
                          if roi.shape[:2] != (h,w):
                              raise RegionBlocked("CROP_SIZE_MISMATCH")
                          name=f"page-{item['subsetPageIndex']+1:03d}-region-{index+1:02d}.png"
                          path=stage/"crops"/name
                          if not cv2.imwrite(str(path),roi) or not file_ok(path,MAX_PNG_BYTES):
                              raise RegionBlocked("CROP_PERSIST_FAILED")
                          per.append({
                              "regionId":f"page-{item['subsetPageIndex']+1:03d}-region-{index+1:02d}",
                              "coordinateSpace":"FULL_PAGE_PNG_TOP_LEFT_PIXELS",
                              "bboxPixels":[x,y,w,h],
                              "relativeCropPath":"crops/"+name,
                              "cropSha256":sha256_file(path),
                              "cropBytes":path.stat().st_size,
                              "proposalStatus":"UNVERIFIED_REGION_SUGGESTION",
                              "proposalKind":proposal["proposalKind"],
                              "semanticLabel":None,
                              "nodes":None,"directedEdges":None,"timingRelations":None,
                          })
                          total+=1
                          del roi
                      processed.append({
                          "subsetPageIndex":item["subsetPageIndex"],
                          "sourcePhysicalPage1Based":item["physicalPage"],
                          "sourceImageSha256":item["sha"],
                          "sourceImageWidth":item["width"],
                          "sourceImageHeight":item["height"],
                          "sourceFigureBlockRefs":item["refs"],
                          "regions":per,
                          "needsHumanVisualReview":True,
                      })
                      del img
                  doc={
                      "schemaVersion":"acs-pdf-private-region-evidence-v1",
                      "fixtureId":fixture,"sourceRun":SOURCE_RUN,
                      "inputType":"SHA_VERIFIED_PRIVATE_FULL_PAGE_PNG",
                      "pages":processed,
                      "allRegionsAreUnverified":True,
                      "noSemanticGraphClaims":True,
                      "fallbackFullPageEvidenceStillAuthoritative":True,
                  }
                  path=stage/"region-proposals.json"
                  with path.open("x",encoding="utf-8") as file:
                      json.dump(doc,file,indent=2,ensure_ascii=False)
                      file.flush()
                      os.fsync(file.fileno())
                  os.rename(stage,final)
              except BaseException:
                  if stage.is_dir() and not unsafe_link(stage):
                      shutil.rmtree(stage)
                  raise
              return {
                  "status":"PRIVATE_REGION_PROPOSALS_PERSISTED",
                  "fixture":fixture,
                  "pagesProcessed":len(processed),
                  "croppedRegionProposals":total,
                  "cropAndSourceImageHashesSaved":True,
                  "semanticGraphOrArrowDirectionsVerified":False,
                  "privatePagePixelsExported":False,
              }
          
          
          def main() -> None:
              parser=argparse.ArgumentParser()
              parser.add_argument("--fixture",choices=list(PAGES),required=True)
              args=parser.parse_args()
              try:
                  result=run(ROOT,args.fixture)
              except RegionBlocked as exc:
                  code=str(exc)
                  if not re.fullmatch(r"[A-Z0-9_]{3,80}",code):
                      code="UNKNOWN_GUARD"
                  print("ACS_REGION_PROPOSALS_BLOCKED="+code)
                  sys.exit(2)
              except Exception as exc:
                  cls=type(exc).__name__
                  if not re.fullmatch(r"[A-Za-z]{3,40}",cls):
                      cls="Unknown"
                  print("ACS_REGION_PROPOSALS_RUNTIME_CLASS="+cls)
                  sys.exit(2)
              print("ACS_REGION_PROPOSALS="+json.dumps(result,sort_keys=True))
          
          
          if __name__=="__main__":
              main()
          '@
          $body=$body.Replace(([string][char]13+[char]10),[string][char]10)+[char]10
          [System.IO.File]::WriteAllText($target,$body,(New-Object System.Text.UTF8Encoding($false)))
          $raw=[System.IO.File]::ReadAllBytes($target)
          $prefix=[System.Text.Encoding]::ASCII.GetBytes(('blob '+$raw.Length+[char]0))
          $joined=New-Object byte[] ($prefix.Length+$raw.Length)
          [Array]::Copy($prefix,0,$joined,0,$prefix.Length)
          [Array]::Copy($raw,0,$joined,$prefix.Length,$raw.Length)
          $sha=([BitConverter]::ToString(([System.Security.Cryptography.SHA1]::Create()).ComputeHash($joined))).Replace('-','').ToLowerInvariant()
          if ($sha -cne 'a17929244273d7cff9a690db9749bc846c2214a3') {throw 'PINNED_GLM_SCRIPT_BLOB_SHA_MISMATCH'}

          $target=Join-Path $scripts 'vision_graph_proposal_contract.py'
          $body=@'
          """Validate PRIVATE vision-model graph suggestions against SHA-pinned region crops.
          
          Only PROPOSED_UNVERIFIED is accepted. This does not perform OCR/vision inference,
          certify arrow directions, or transform machine suggestions into human ground truth.
          """
          from __future__ import annotations
          
          import hashlib
          import json
          import math
          import re
          from pathlib import Path
          
          
          class SuggestionBlocked(ValueError):
              pass
          
          
          def finite_number(v):
              return type(v) in (int, float) and math.isfinite(v)
          
          
          def rect_inside(box, width, height) -> bool:
              if (not isinstance(box, list) or len(box) != 4
                      or not all(finite_number(x) for x in box)):
                  return False
              x,y,w,h=box
              return x>=0 and y>=0 and w>0 and h>0 and x+w<=width and y+h<=height
          
          
          def point_inside(point,width,height) -> bool:
              return (isinstance(point,list) and len(point)==2
                      and all(finite_number(x) for x in point)
                      and 0<=point[0]<width and 0<=point[1]<height)
          
          
          def validate_candidate(payload: dict, provenance: dict) -> dict:
              """Validate proposed labels/relations; return evidence-bound page coordinates.
          
              Every proposed edge must cite the very same PNG crop as its endpoints and
              include a pixel-level tip and shaft witness. These are NOT proof of an arrow.
              """
              if not isinstance(payload,dict) or not isinstance(provenance,dict):
                  raise SuggestionBlocked("SCHEMA_INVALID")
              if (payload.get("schemaVersion")!="acs-vision-graph-proposal-v1"
                      or payload.get("graphStatus")!="PROPOSED_UNVERIFIED"
                      or payload.get("reviewStatus")!="NOT_REVIEWED"
                      or payload.get("humanVerified") is not False
                      or payload.get("coordinateSpace")!="REGION_CROP_TOP_LEFT_PIXELS"):
                  raise SuggestionBlocked("UNVERIFIED_STATUS_REQUIRED")
              if (provenance.get("schemaVersion")!="acs-pdf-private-region-evidence-v1"
                      or provenance.get("allRegionsAreUnverified") is not True
                      or provenance.get("noSemanticGraphClaims") is not True):
                  raise SuggestionBlocked("SOURCE_REGION_MANIFEST_NOT_TRUSTED")
              if payload.get("fixtureId") != provenance.get("fixtureId"):
                  raise SuggestionBlocked("SOURCE_FIXTURE_MISMATCH")
              region_id = payload.get("regionId")
              candidates=[]
              for page in provenance.get("pages",[]):
                  for region in page.get("regions",[]):
                      if region.get("regionId")==region_id:
                          candidates.append((page,region))
              if len(candidates)!=1:
                  raise SuggestionBlocked("SOURCE_REGION_NOT_UNIQUE")
              page,region=candidates[0]
              digest=payload.get("sourceCropSha256")
              if (not isinstance(digest,str) or not re.fullmatch(r"[0-9a-f]{64}",digest)
                      or digest!=region.get("cropSha256")):
                  raise SuggestionBlocked("CROP_SHA_MISMATCH")
              if (region.get("proposalStatus")!="UNVERIFIED_REGION_SUGGESTION"
                      or region.get("nodes") is not None
                      or region.get("directedEdges") is not None
                      or region.get("timingRelations") is not None):
                  raise SuggestionBlocked("REGION_PRETENDS_VERIFIED")
              x0,y0,width,height=region["bboxPixels"]
              if not all(type(v) is int for v in (x0,y0,width,height)) or width<20 or height<20:
                  raise SuggestionBlocked("SOURCE_REGION_BOUNDS_INVALID")
              nodes=payload.get("nodes")
              edges=payload.get("edges")
              if not isinstance(nodes,list) or not isinstance(edges,list) or len(nodes)>80 or len(edges)>120:
                  raise SuggestionBlocked("GRAPH_BUDGET_EXCEEDED")
              mapped_nodes=[]
              seen=set()
              for node in nodes:
                  if not isinstance(node,dict):
                      raise SuggestionBlocked("NODE_INVALID")
                  nid=node.get("id")
                  label=node.get("label")
                  confidence=node.get("proposalConfidence")
                  if (not isinstance(nid,str) or not re.fullmatch(r"n[0-9]{1,3}",nid)
                          or nid in seen or not isinstance(label,str) or len(label)>160
                          or any(ord(c)<32 for c in label)
                          or not finite_number(confidence) or not 0<=confidence<=1
                          or node.get("reviewStatus")!="NOT_REVIEWED"):
                      raise SuggestionBlocked("NODE_NOT_SAFE")
                  box=node.get("bboxCropPixels")
                  if not rect_inside(box,width,height):
                      raise SuggestionBlocked("NODE_BOUNDS_INVALID")
                  seen.add(nid)
                  mapped_nodes.append({"id":nid,"bboxPagePixels":[x0+box[0],y0+box[1],box[2],box[3]],
                                       "sourcePhysicalPage1Based":page["sourcePhysicalPage1Based"],
                                       "claim":"MACHINE_SUGGESTION_NOT_VERIFIED"})
              mapped_edges=[]
              edge_ids=set()
              for edge in edges:
                  if not isinstance(edge,dict):
                      raise SuggestionBlocked("EDGE_INVALID")
                  eid=edge.get("id")
                  a,b=edge.get("fromNodeId"),edge.get("toNodeId")
                  if (not isinstance(eid,str) or not re.fullmatch(r"e[0-9]{1,3}",eid)
                          or eid in edge_ids or a not in seen or b not in seen or a==b):
                      raise SuggestionBlocked("EDGE_ENDPOINTS_INVALID")
                  direction=edge.get("direction")
                  if direction not in ("UNKNOWN","FROM_TO_SUGGESTED","TO_FROM_SUGGESTED"):
                      raise SuggestionBlocked("ARROW_DIRECTION_NOT_SUPPORTED")
                  tip=edge.get("arrowTipCropPixels")
                  shaft=edge.get("shaftCropPixels")
                  confidence=edge.get("proposalConfidence")
                  if (not point_inside(tip,width,height)
                          or not isinstance(shaft,list) or len(shaft)!=2
                          or not all(point_inside(p,width,height) for p in shaft)
                          or not finite_number(confidence) or not 0<=confidence<=1
                          or edge.get("reviewStatus")!="NOT_REVIEWED"):
                      raise SuggestionBlocked("EDGE_EVIDENCE_MISSING")
                  edge_ids.add(eid)
                  mapped_edges.append({
                      "id":eid,"arrowTipPagePixels":[x0+tip[0],y0+tip[1]],
                      "shaftPagePixels":[[x0+p[0],y0+p[1]] for p in shaft],
                      "sourcePhysicalPage1Based":page["sourcePhysicalPage1Based"],
                      "claim":"GEOMETRIC_WITNESS_AND_RELATION_UNVERIFIED",
                  })
              return {
                  "regionId":region_id,
                  "sourcePhysicalPage1Based":page["sourcePhysicalPage1Based"],
                  "sourceCropSha256":digest,
                  "mappedNodes":mapped_nodes,
                  "mappedEdges":mapped_edges,
                  "graphVerified":False,
                  "needsIndependentHumanReview":True,
              }
          
          
