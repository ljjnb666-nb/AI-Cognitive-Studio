# Synthetic Windows NTFS region-draft CAS only; no real private book reads.
name: ACS P127 03E03 Windows synthetic region draft store
on:
  push:
    branches: [ops/mineru-synthetic-retry-20261020-isolated]
    paths:
      - .github/workflows/acs-p127-03e03-windows-store-synthetic-20261021.yml
permissions: {}
concurrency:
  group: acs-windows-pdf-local-ownership
  cancel-in-progress: false
jobs:
  synthetic-store:
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 6
    steps:
      - name: Stage pinned public source with Git Blob SHA
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('acs-03e03-win-store-'+$env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $dir) {throw 'STAGING_ALREADY_EXISTS'}
          [IO.Directory]::CreateDirectory($dir) | Out-Null
          $git=(Get-Command git -ErrorAction Stop).Source
          # Source SHA ccd65d243ab86566c3ca920294c85b15eb92a55a
          $parts=@(
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
          )
          $dest=Join-Path $dir 'region-graph-review.mjs'
          [IO.File]::WriteAllBytes($dest,[Convert]::FromBase64String(($parts -join '')))
          $got=(& $git hash-object --no-filters -- $dest).Trim()
          if ($LASTEXITCODE -ne 0 -or $got -ne 'ccd65d243ab86566c3ca920294c85b15eb92a55a') {throw 'UNTRUSTED_BLOB'}
          # Source SHA 1f7841e10512e741a5a7e5e3ba7512cb0ab9eadd
          $parts=@(
            ''
            ''
            ''
            ''
            ''
            ''
            ''
            ''
          )
          $dest=Join-Path $dir 'region-review-store.mjs'
          [IO.File]::WriteAllBytes($dest,[Convert]::FromBase64String(($parts -join '')))
          $got=(& $git hash-object --no-filters -- $dest).Trim()
          if ($LASTEXITCODE -ne 0 -or $got -ne '1f7841e10512e741a5a7e5e3ba7512cb0ab9eadd') {throw 'UNTRUSTED_BLOB'}
          Write-Output 'ACS_03E03_STORE_SOURCE_PINNED=true'
      - name: Exercise isolated Windows filesystem locks and CAS
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('acs-03e03-win-store-'+$env:GITHUB_RUN_ID)
          $script=@'
          import {pathToFileURL} from 'node:url';
          import {join} from 'node:path';
          import {mkdtemp,rm,writeFile,mkdir} from 'node:fs/promises';
          import {tmpdir} from 'node:os';
          const mod=await import(pathToFileURL(join(process.argv[2],'region-review-store.mjs')).href);
          const contract=await import(pathToFileURL(join(process.argv[2],'region-graph-review.mjs')).href);
          const root=await mkdtemp(join(tmpdir(),'acs-win-synthetic-only-'));
          const view=(book,region,page,digest)=>({fixtureId:book,regionId:region,physicalPage:page,
            resultSha256:digest.repeat(64),manifestSha256:'b'.repeat(64),cropSha256:'a'.repeat(64),
            graphVerified:false,reviewStatus:'NOT_REVIEWED',nodes:[{id:'n1'}],edges:[{id:'e1'}]});
          let passed=false;
          try{
            const v1=view('RB-PDF-13','page-002-region-01',127,'c');
            const v2=view('RB-PDF-12','page-001-region-01',51,'d');
            const draft=contract.createRegionReviewDraft(v1);
            const first=await mod.saveRegionReviewDraft(root,v1,draft,null);
            if(!/^[0-9a-f]{64}$/.test(first.revision))throw Error('FIRST_WRITE');
            const current=await mod.readRegionReviewDraft(root,v1);
            if(current.revision!==first.revision||current.draft.graphVerified!==false)throw Error('READBACK');
            let stale=false;try{await mod.saveRegionReviewDraft(root,v1,draft,null);}catch(e){stale=e.code==='REGION_STORE_REVISION_CONFLICT';}
            if(!stale)throw Error('STALE_CAS');
            const pair=await Promise.allSettled([
              mod.saveRegionReviewDraft(root,v2,contract.createRegionReviewDraft(v2),null),
              mod.saveRegionReviewDraft(root,v2,contract.createRegionReviewDraft(v2),null),
            ]);
            if(pair.filter(x=>x.status==='fulfilled').length!==1)throw Error('CONCURRENT_OVERWRITE');
            if((await mod.readRegionReviewDraft(root,v1)).revision!==first.revision)throw Error('CROSS_REGION');
            passed=true;
          }finally{await rm(root,{recursive:true,force:true,maxRetries:6,retryDelay:250});}
          if(!passed)process.exit(2);
          console.log('ACS_03E03_WIN_SYNTHETIC_DRAFT_CAS_PASS=true');
          console.log('ACS_03E03_WIN_SYNTHETIC_REGION_ISOLATION_PASS=true');
          console.log('ACS_03E03_WIN_REAL_PRIVATE_DATA_TOUCHED=false');
          '@
          $test=Join-Path $dir 'synthetic-store.mjs'
          [IO.File]::WriteAllText($test,$script,[Text.UTF8Encoding]::new($false))
          & node $test $dir
          if ($LASTEXITCODE -ne 0) {throw 'WINDOWS_REGION_STORE_SYNTHETIC_FAILED'}
