name: ACS Ebook Private GLM Reply Custody No-Paid Gate
on:
  pull_request:
    paths:
      - ".github/workflows/acs-ebook-private-reply-custody.yml"
      - "tools/pdf-parser-benchmark/scripts/ebook_private_graph_reply_recovery.py"
      - "tools/pdf-parser-benchmark/scripts/ebook_private_visual_graph_proposal.py"
      - "tools/pdf-parser-benchmark/tests/test_ebook_private_graph_reply_recovery.py"
      - "tools/pdf-parser-benchmark/docs/BOOK_PRIVATE_REPLY_CUSTODY_20261023.md"
permissions:
  contents: read
concurrency:
  group: acs-ebook-graph-reply-custody
  cancel-in-progress: false
jobs:
  offline-synthetic-reply-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact-head strict JSON and custody/replay safety tests with no provider
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile tools/pdf-parser-benchmark/scripts/ebook_private_graph_reply_recovery.py tools/pdf-parser-benchmark/scripts/ebook_private_visual_graph_proposal.py
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_private_graph_reply_recovery.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_private_visual_graph_proposal.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_private_graph_receipt_audit.py' -v
          echo "ACS_REPLY_CUSTODY_NO_NETWORK_SYNTHETIC=PASS"
          echo "ACS_REPLY_CUSTODY_NEW_PROVIDER_REQUESTS=0"
  windows-legacy-b15-no-reply-readonly:
    needs: offline-synthetic-reply-custody
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-private-reply-recovery-20261023' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Checkout exact PR SHA, no model credentials
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          persist-credentials: false
          clean: false
          path: acs-private-reply-readonly
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify legacy B15 has no recoverable raw reply, no writes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C acs-private-reply-readonly rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'REPLY_CUSTODY_EXACT_SHA_MISMATCH' }
          $root='D:\ai-cognitive-pdf-benchmark-data'
          if (-not (Test-Path -LiteralPath $root -PathType Container)) { throw 'REPLY_CUSTODY_PRIVATE_ROOT_MISSING' }
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'REPLY_CUSTODY_PRIVATE_PYTHON_MISSING' }
          $script='acs-private-reply-readonly/tools/pdf-parser-benchmark/scripts/ebook_private_graph_reply_recovery.py'
          $manifest='acs-private-reply-readonly/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          & $python $script --private-root $root --manifest $manifest --book B15
          if ($LASTEXITCODE -ne 0) { throw 'REPLY_CUSTODY_LEGACY_READONLY_FAILED' }
          Write-Output 'ACS_REPLY_CUSTODY_REAL_WINDOWS=READ_ONLY_NO_API_CALL'
