name: ACS Ebook B31 Private Role Shape Diagnosis

on:
  pull_request:
    paths:
      - ".github/workflows/acs-ebook-b31-private-role-diagnosis.yml"
      - "tools/pdf-parser-benchmark/scripts/ebook_private_graph_role_diagnosis.py"
      - "tools/pdf-parser-benchmark/tests/test_ebook_private_graph_role_diagnosis.py"
      - "tools/pdf-parser-benchmark/docs/BOOK_B31_ROLE_DIAGNOSIS_20261023.md"

permissions:
  contents: read

concurrency:
  group: acs-ebook-b31-private-role-diagnosis
  cancel-in-progress: false

jobs:
  synthetic-anonymous-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic schema-shape privacy tests without any cloud calls
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile tools/pdf-parser-benchmark/scripts/ebook_private_graph_role_diagnosis.py
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_private_graph_role_diagnosis.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_private_graph_reply_recovery.py' -v
          echo "ACS_B31_ROLE_DIAGNOSIS_SYNTHETIC=PASS"
          echo "ACS_B31_ROLE_DIAGNOSIS_PROVIDER_CALLS=0"

  windows-private-snapshot-readonly:
    needs: synthetic-anonymous-diagnostics
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-b31-private-role-diagnosis-20261023' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout exact owner-only PR HEAD without provider credentials
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          persist-credentials: false
          clean: false
          path: acs-b31-role-readonly
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check B31 captured response category counts, do not mutate D drive
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C acs-b31-role-readonly rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'B31_ROLE_DIAG_EXACT_SHA_MISMATCH' }
          $root='D:\ai-cognitive-pdf-benchmark-data'
          if (-not (Test-Path -LiteralPath $root -PathType Container)) { throw 'B31_ROLE_DIAG_PRIVATE_ROOT_MISSING' }
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'B31_ROLE_DIAG_CACHED_PYTHON_MISSING' }
          $folder=Join-Path $root 'semantic_gate'
          $b15=Join-Path $folder 'visual_graph_proposal_B15.request.private.json'
          $b31marker=Join-Path $folder 'visual_graph_proposal_B31.request.private.json'
          $b31reply=Join-Path $folder 'visual_graph_proposal_B31.reply.private.json'
          $b31candidate=Join-Path $folder 'visual_graph_proposal_B31.candidate.private.json'
          foreach ($f in @($b15,$b31marker,$b31reply)) {
            if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { throw 'B31_ROLE_DIAG_PRIVATE_RECEIPT_MISSING' }
          }
          if (Test-Path -LiteralPath $b31candidate) { throw 'B31_ROLE_DIAG_CANDIDATE_ALREADY_PRESENT' }
          $h15=(Get-FileHash -LiteralPath $b15 -Algorithm SHA256).Hash
          $h31marker=(Get-FileHash -LiteralPath $b31marker -Algorithm SHA256).Hash
          $h31reply=(Get-FileHash -LiteralPath $b31reply -Algorithm SHA256).Hash
          $script='acs-b31-role-readonly/tools/pdf-parser-benchmark/scripts/ebook_private_graph_role_diagnosis.py'
          $manifest='acs-b31-role-readonly/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          & $python $script --private-root $root --manifest $manifest
          $exitCode=$LASTEXITCODE
          if ((Get-FileHash -LiteralPath $b15 -Algorithm SHA256).Hash -ne $h15) { throw 'B31_ROLE_DIAG_B15_LEDGER_CHANGED' }
          if ((Get-FileHash -LiteralPath $b31marker -Algorithm SHA256).Hash -ne $h31marker) { throw 'B31_ROLE_DIAG_REQUEST_CHANGED' }
          if ((Get-FileHash -LiteralPath $b31reply -Algorithm SHA256).Hash -ne $h31reply) { throw 'B31_ROLE_DIAG_REPLY_CHANGED' }
          if (Test-Path -LiteralPath $b31candidate) { throw 'B31_ROLE_DIAG_ILLEGAL_CANDIDATE_WRITE' }
          if ($exitCode -ne 0) { throw 'B31_ROLE_DIAG_PRIVATE_VALIDATION_FAILED' }
          Write-Output 'ACS_B31_ROLE_DIAG_REAL_WINDOWS=READ_ONLY_COMPLETE'
          Write-Output 'ACS_B31_ROLE_DIAG_REAL_GOLD=UNVERIFIED'
