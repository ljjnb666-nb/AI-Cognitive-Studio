name: ACS B31 OpenCV Source-Only Shape Hypotheses

on:
  pull_request:
    paths:
      - ".github/workflows/acs-b31-opencv-source-only.yml"
      - "tools/pdf-parser-benchmark/scripts/ebook_b31_opencv_candidates.py"
      - "tools/pdf-parser-benchmark/tests/test_ebook_b31_opencv_candidates.py"
      - "tools/pdf-parser-benchmark/docs/BOOK_B31_OPENCV_SOURCE_HYPOTHESES_20261023.md"

permissions:
  contents: read

concurrency:
  group: acs-b31-opencv-source-only
  cancel-in-progress: false

jobs:
  synthetic-source-cv:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated pinned CPU-only computer vision wheels
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==1.26.4 opencv-python-headless==4.10.0.84
      - name: Verify exact HEAD and original-source-only CV hypotheses
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile tools/pdf-parser-benchmark/scripts/ebook_b31_opencv_candidates.py
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b31_opencv_candidates.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b31_source_raster_geometry.py' -v
          echo "ACS_B31_OPENCV_SOURCE_SYNTHETIC=PASS"
          echo "ACS_B31_OPENCV_PROVIDER_CALLS=0"

  windows-source-cv-readonly-then-private:
    needs: synthetic-source-cv
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-b31-opencv-shape-hypotheses-20261023' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Checkout owner-only exact SHA without model credentials
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: false
          path: acs-b31-source-opencv
      - name: Inspect B31 PNG only, preserve historical markers and saved model candidate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C acs-b31-source-opencv rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'B31_CV_EXACT_HEAD_MISMATCH' }
          $root='D:\ai-cognitive-pdf-benchmark-data'
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'B31_CV_PRIVATE_PYTHON_MISSING' }
          & $python -c "import cv2, numpy; assert cv2.__version__; assert numpy.__version__"
          if ($LASTEXITCODE -ne 0) { throw 'B31_CV_CACHED_OPENCV_UNAVAILABLE' }
          $folder=Join-Path $root 'semantic_gate'
          $output=Join-Path $folder 'b31_opencv_source_candidates.private.json'
          if (Test-Path -LiteralPath $output) { throw 'B31_CV_OUTPUT_ALREADY_EXISTS_NO_OVERWRITE' }
          $protected=@(
            (Join-Path $folder 'b31_source_only_page126.private.png'),
            (Join-Path $folder 'b31_source_only_page126.private.json'),
            (Join-Path $folder 'b31_source_raster_geometry.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B15.request.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B31.request.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B31.reply.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B31.candidate.private.json')
          )
          $before=@{}
          foreach ($file in $protected) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw 'B31_CV_HISTORIC_SOURCE_MISSING' }
            $before[$file]=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
          }
          $script='acs-b31-source-opencv/tools/pdf-parser-benchmark/scripts/ebook_b31_opencv_candidates.py'
          $manifest='acs-b31-source-opencv/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          & $python $script --private-root $root --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw 'B31_CV_SOURCE_PREVIEW_FAILED' }
          if (Test-Path -LiteralPath $output) { throw 'B31_CV_PREVIEW_MUTATED_PRIVATE_REPORT' }
          & $python $script --private-root $root --manifest $manifest --write
          if ($LASTEXITCODE -ne 0) { throw 'B31_CV_PRIVATE_REPORT_FAILED' }
          foreach ($file in $protected) {
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $before[$file]) { throw 'B31_CV_PROTECTED_EVIDENCE_CHANGED' }
          }
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw 'B31_CV_REPORT_MISSING' }
          Write-Output 'ACS_B31_OPENCV_ORIGINAL_RASTER=PRIVATE_SOURCE_REPORT_WRITTEN'
          Write-Output 'ACS_B31_OPENCV_GRAPH_GOLD=UNVERIFIED'
          Write-Output 'ACS_B31_OPENCV_EDGE_DIRECTION=UNVERIFIED'
          Write-Output 'ACS_B31_OPENCV_PROVIDER_CALLS=0'
