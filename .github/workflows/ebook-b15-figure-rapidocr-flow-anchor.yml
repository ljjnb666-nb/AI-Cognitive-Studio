name: B15 MinerU Figure to RapidOCR Page Flow Anchor

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  synthetic:
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/b15-figure-image-rapidocr-flow-anchor-20261024' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline-fixture dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: pymupdf==1.26.5 numpy==1.26.4 opencv-python-headless==4.10.0.84
      - name: Run six no-inference figure anchor source-contract synthetic gates
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile tools/pdf-parser-benchmark/scripts/ebook_private_mineru_figure_rapidocr_anchor.py
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_private_mineru_figure_rapidocr_anchor.py' -v
          echo 'ACS_FIGURE_ANCHOR_SYNTHETIC=PASS'
          echo 'ACS_FIGURE_ANCHOR_GOLD=UNVERIFIED'
          echo 'ACS_FIGURE_ANCHOR_PROVIDER_CALLS=0'

  windows-private-evidence:
    needs: synthetic
    if: ${{ github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/b15-figure-image-rapidocr-flow-anchor-20261024' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: acs-figure-anchor
          persist-credentials: false
          clean: false
      - name: Freeze or audit B15 original figure image and RapidOCR page-flow candidates
        shell: powershell
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C acs-figure-anchor rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'FIGURE_ANCHOR_HEAD_MISMATCH' }
          $root='D:\ai-cognitive-pdf-benchmark-data'
          $folder=Join-Path $root 'semantic_gate\multibook_matrix_20261023'
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'FIGURE_ANCHOR_PYTHON_MISSING' }
          $names=@('fivebook_mineru_basic_B15.private.md','fivebook_mineru_basic_B15.private.json','multibook_rapidocr_five_pages.private.json')
          $before=@{}
          foreach ($name in $names) {
            $file=Join-Path $folder $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw 'FIGURE_ANCHOR_PRIVATE_SOURCE_MISSING' }
            $before[$file]=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
          }
          $script='acs-figure-anchor/tools/pdf-parser-benchmark/scripts/ebook_private_mineru_figure_rapidocr_anchor.py'
          $output=Join-Path $folder 'b15_mineru_figure_rapidocr_anchor.v1.private.json'
          $anchorArgs=@('--mineru-markdown',(Join-Path $folder $names[0]),'--mineru-receipt',(Join-Path $folder $names[1]),'--rapidocr-json',(Join-Path $folder $names[2]),'--private-output',$output)
          $env:HTTP_PROXY='http://127.0.0.1:1'
          $env:HTTPS_PROXY='http://127.0.0.1:1'
          $env:ALL_PROXY='http://127.0.0.1:1'
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) {
            & $python $script @anchorArgs
            if ($LASTEXITCODE -ne 0) { throw 'FIGURE_ANCHOR_PRIVATE_CREATE_FAILED' }
          }
          & $python $script @anchorArgs --audit-only
          if ($LASTEXITCODE -ne 0) { throw 'FIGURE_ANCHOR_PRIVATE_AUDIT_FAILED' }
          $report=Get-Content -LiteralPath $output -Raw | ConvertFrom-Json
          if ($report.status -ne 'FIGURE_TEXT_CANDIDATES_UNVERIFIED' -or
              $report.candidate_count -ne 19 -or
              $report.retained_figures.Count -ne 2 -or
              $report.selected_figure_id -ne '1-4-16' -or
              $report.image_to_page_geometry_verified -ne $false -or
              $report.series_to_curve_correspondence_verified -ne $false -or
              $report.independent_gold_available -ne $false -or
              $null -ne $report.cer) {
            throw 'FIGURE_ANCHOR_FALSE_GOLD_OR_UNEXPECTED_SOURCE'
          }
          foreach ($name in $names) {
            $file=Join-Path $folder $name
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $before[$file]) { throw 'FIGURE_ANCHOR_ORIGINAL_SOURCE_MUTATED' }
          }
          Write-Output 'ACS_FIGURE_ANCHOR_ORIGINAL_SOURCES=UNCHANGED'
          Write-Output 'ACS_FIGURE_ANCHOR_LABEL_TO_MARKER=UNVERIFIED'
          Write-Output 'ACS_FIGURE_ANCHOR_OCR_ACCURACY=UNVERIFIED'
          Write-Output 'ACS_FIGURE_ANCHOR_NEW_PROVIDER_CALLS=0'
