          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The release gates record and verify the PR head, not GitHub's
          # ephemeral pull-request merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact-head checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SHA}"
          echo "actual=${actual}"
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Checked-out HEAD ${actual} does not match expected exact head ${EXPECTED_SHA}"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Start MinIO
        run: docker compose up -d minio
      - name: Initialize private MinIO bucket
        run: docker compose run --rm minio-init
      - name: Create isolated test database
        run: PGPASSWORD=app psql -h localhost -U app -d postgres -c 'CREATE DATABASE ai_cognitive_studio_test;'
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply test migration
        run: pnpm --filter @ai-cognitive/db prisma migrate deploy
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/ai_cognitive_studio_test?schema=public
      - name: Install and attest required media/Redis CLI tools (bounded)
        run: bash scripts/ci-install-media-tools.sh
      - name: Phase 15 Podcast Content Quality release gate (deterministic and no external AI calls)
        run: pnpm test:phase15:release
        env:
          POSTGRES_HOST_PORT: "5432"
      - name: Upload Phase 15 podcast quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase15-podcast-quality-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/phase15
          if-no-files-found: error
      - name: Phase 16 Performance & Cost Efficiency release gate
        run: pnpm test:phase16:release
        env:
          PHASE16_ARTIFACT_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload Phase 16 performance and cost evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase16-performance-cost-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/phase16
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Domain 5 — stability-beta: Phases 17, 18.1, Beta Provider UX, root E2E.
  # Real PostgreSQL 17 + Redis 7 + MinIO + FFmpeg + Playwright Chromium.
  # ---------------------------------------------------------------------------
  stability-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: ai_cognitive_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d ai_cognitive_studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The release gates record and verify the PR head, not GitHub's
          # ephemeral pull-request merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact-head checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SHA}"
          echo "actual=${actual}"
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Checked-out HEAD ${actual} does not match expected exact head ${EXPECTED_SHA}"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
