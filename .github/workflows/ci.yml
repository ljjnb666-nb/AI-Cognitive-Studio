        run: pnpm --filter @ai-cognitive/db prisma migrate deploy
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/ai_cognitive_studio_test?schema=public
      - name: Install and attest required media/Redis CLI tools (bounded)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg redis-tools
      - name: Install Playwright browser
        run: pnpm --filter @ai-cognitive/web exec playwright install --with-deps chromium
      - name: Phase 17 Closed Beta core release gate
        run: pnpm test:phase17:release
        env:
          PHASE17_ARTIFACT_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload Phase 17 closed beta evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase17-closed-beta-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/phase17
          if-no-files-found: error
      - name: Phase 18.1 source processing repair release gate
        run: pnpm test:phase18-1:release
        env:
          PHASE18_1_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PHASE18_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          POSTGRES_HOST_PORT: "5432"
      - name: Upload Phase 18.1 processing repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase18-1-release-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/phase18-1
          if-no-files-found: error
      - name: Upload Phase 18 production hardening evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase18-production-hardening-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/phase18
          if-no-files-found: error
      - name: Beta Provider UX real-flow release gate (no external AI calls)
        run: pnpm test:beta-repair:provider-ux:release
        env:
          POSTGRES_HOST_PORT: "5432"
      - name: End-to-end tests
        run: pnpm test:e2e

  # ---------------------------------------------------------------------------
  # Final aggregator gate. Keeps the historical `validate` check name required
  # by branch protection, but no longer runs tests itself. Fail-closed: any
  # upstream domain that is not "success" (failed, cancelled or skipped)
  # fails this check.
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static, core-tests, product-acceptance, quality-performance, stability-beta]
    if: always()
    steps:
      - name: Verify all validation domains succeeded
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          CORE_TESTS_RESULT: ${{ needs.core-tests.result }}
          PRODUCT_ACCEPTANCE_RESULT: ${{ needs.product-acceptance.result }}
          QUALITY_PERFORMANCE_RESULT: ${{ needs.quality-performance.result }}
          STABILITY_BETA_RESULT: ${{ needs.stability-beta.result }}
        run: |
          echo "static:              ${STATIC_RESULT}"
          echo "core-tests:          ${CORE_TESTS_RESULT}"
          echo "product-acceptance:  ${PRODUCT_ACCEPTANCE_RESULT}"
          echo "quality-performance: ${QUALITY_PERFORMANCE_RESULT}"
          echo "stability-beta:      ${STABILITY_BETA_RESULT}"
          failed=0
          for result in "${STATIC_RESULT}" "${CORE_TESTS_RESULT}" "${PRODUCT_ACCEPTANCE_RESULT}" "${QUALITY_PERFORMANCE_RESULT}" "${STABILITY_BETA_RESULT}"; do
            if [ "${result}" != "success" ]; then
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "::error::One or more validation domains did not succeed (failed, cancelled, or skipped)."
            exit 1
          fi
          echo "All validation domains succeeded."