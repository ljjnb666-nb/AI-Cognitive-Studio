    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: ai_cognitive_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d ai_cognitive_studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
