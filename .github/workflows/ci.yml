          POSTGRES_HOST_PORT: "5432"
      - name: End-to-end tests
        run: pnpm test:e2e

  # ---------------------------------------------------------------------------
  # Final aggregator gate. Keeps the historical `validate` check name required
  # by branch protection, but no longer runs tests itself. Fail-closed: any
  # upstream domain that is not "success" (failed, cancelled or skipped)
  # fails this check.
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static, core-tests, product-acceptance, quality-performance, stability-beta]
    if: always()
    steps:
      - name: Verify all validation domains succeeded
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          CORE_TESTS_RESULT: ${{ needs.core-tests.result }}
          PRODUCT_ACCEPTANCE_RESULT: ${{ needs.product-acceptance.result }}
          QUALITY_PERFORMANCE_RESULT: ${{ needs.quality-performance.result }}
          STABILITY_BETA_RESULT: ${{ needs.stability-beta.result }}
        run: |
          echo "static:              ${STATIC_RESULT}"
          echo "core-tests:          ${CORE_TESTS_RESULT}"
          echo "product-acceptance:  ${PRODUCT_ACCEPTANCE_RESULT}"
          echo "quality-performance: ${QUALITY_PERFORMANCE_RESULT}"
          echo "stability-beta:      ${STABILITY_BETA_RESULT}"
          failed=0
          for result in "${STATIC_RESULT}" "${CORE_TESTS_RESULT}" "${PRODUCT_ACCEPTANCE_RESULT}" "${QUALITY_PERFORMANCE_RESULT}" "${STABILITY_BETA_RESULT}"; do
            if [ "${result}" != "success" ]; then
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "::error::One or more validation domains did not succeed (failed, cancelled, or skipped)."
            exit 1
          fi
          echo "All validation domains succeeded."

  # Same six books/24 fixed PDF pages through REAL Docling NativePdfPipeline.
  synthetic-multibook-docling-native:
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-multiengine-offline-readiness-20261023' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic source PDF only; no model downloads
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: pymupdf==1.26.5 numpy==1.26.4 opencv-python-headless==4.10.0.84
      - name: Verify exact SHA six-PDF 24-page Docling Native source contracts
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile tools/pdf-parser-benchmark/scripts/ebook_multibook_docling_native.py
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_multibook_docling_native.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_multibook_matrix.py' -v
          echo "ACS_DOCLING_NATIVE_SYNTHETIC=PASS"
          echo "ACS_DOCLING_NATIVE_MODEL_DOWNLOADS=0"

  owner-only-windows-multibook-docling-native:
    needs: synthetic-multibook-docling-native
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-multiengine-offline-readiness-20261023' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 50
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout owner exact HEAD; no source PDF in GitHub
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: acs-six-docling-native
          persist-credentials: false
          clean: false
      - name: Real Docling native model-free 24-page same-input benchmark
        shell: powershell
        timeout-minutes: 42
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C acs-six-docling-native rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'DOCLING_NATIVE_HEAD_MISMATCH' }
          $root='D:\ai-cognitive-pdf-benchmark-data'
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'DOCLING_NATIVE_INTERPRETER_MISSING' }
          & $python -c "from importlib.metadata import version; import fitz; assert version('docling')=='2.141.0'; from docling.document_converter import NativePdfFormatOption; from docling.datamodel.pipeline_options import NativePdfPipelineOptions"
          if ($LASTEXITCODE -ne 0) { throw 'DOCLING_NATIVE_MODEL_FREE_API_NOT_AVAILABLE' }
          $folder=Join-Path $root 'semantic_gate'
          $matrix=Join-Path $folder 'multibook_matrix_20261023'
          $report=Join-Path $matrix 'multibook_docling_native_24pages.private.json'
          $pdfs=Join-Path $matrix 'docling_native_single_pages'
          $previous=@(
            (Join-Path $matrix 'multibook_native_24pages.private.json'),
            (Join-Path $matrix 'multibook_rapidocr_five_pages.private.json'),
            (Join-Path $folder 'b31_source_only_page126.private.png'),
            (Join-Path $folder 'b31_source_only_page126.private.json'),
            (Join-Path $folder 'b31_source_rapidocr392.private.json'),
            (Join-Path $folder 'b31_ocr_spatial_confounds.private.json'),
            (Join-Path $folder 'b31_ocr_spatial_confounds.private.png'),
            (Join-Path $folder 'visual_graph_proposal_B15.request.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B31.request.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B31.reply.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B31.candidate.private.json')
          )
          $previous+=@(Get-ChildItem -LiteralPath $matrix -File -Filter '*.private.png' | Select-Object -ExpandProperty FullName)
          $before=@{}
          foreach ($f in $previous) {
            if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { throw 'DOCLING_NATIVE_PROTECTED_EVIDENCE_MISSING' }
            $before[$f]=(Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash
          }
          $env:HTTP_PROXY='http://127.0.0.1:1'
          $env:HTTPS_PROXY='http://127.0.0.1:1'
          $env:ALL_PROXY='http://127.0.0.1:1'
          $env:NO_PROXY=''
          $env:HF_HUB_OFFLINE='1'
          $env:TRANSFORMERS_OFFLINE='1'
          $script='acs-six-docling-native/tools/pdf-parser-benchmark/scripts/ebook_multibook_docling_native.py'
          $manifest='acs-six-docling-native/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          $privateLog=Join-Path $matrix 'docling_native_execution.private.log'
          if ((Test-Path -LiteralPath $report) -xor (Test-Path -LiteralPath $pdfs)) { throw 'DOCLING_NATIVE_PARTIAL_OUTPUT_NEEDS_MANUAL_RECOVERY' }
          if (Test-Path -LiteralPath $report) {
            & $python $script --private-root $root --manifest $manifest --audit-only 2>&1 | Out-File -LiteralPath $privateLog -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw 'DOCLING_NATIVE_EXISTING_RECEIPT_INVALID' }
          } else {
            # Preview would repeat the expensive 24-page run; --write is the only
            # run, with exclusive outputs and a subsequent independent audit.
            & $python $script --private-root $root --manifest $manifest --write 2>&1 | Out-File -LiteralPath $privateLog -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw 'DOCLING_NATIVE_REAL_24_PAGE_RUN_FAILED' }
            & $python $script --private-root $root --manifest $manifest --audit-only 2>&1 | Out-File -LiteralPath $privateLog -Encoding utf8 -Append
            if ($LASTEXITCODE -ne 0) { throw 'DOCLING_NATIVE_POSTWRITE_RECEIPT_INVALID' }
          }
          foreach ($f in $previous) {
            if ((Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash -ne $before[$f]) { throw 'DOCLING_NATIVE_HISTORY_CHANGED' }
          }
          $records=@(Get-Content -LiteralPath $privateLog | Where-Object { $_ -match '^ACS_DOCLING_NATIVE_' })
          foreach ($record in $records) { Write-Output $record }
          if (-not (Test-Path -LiteralPath $report -PathType Leaf)) { throw 'DOCLING_NATIVE_REPORT_MISSING' }
          # Only a bounded allowed-root candidate inventory; package readiness
          # here is NOT a MinerU model-load or inference success claim.
          $candidate=@(Get-ChildItem -LiteralPath (Join-Path $root 'tool-env') -Directory |
            Where-Object { $_.Name -match 'mineru' })
          Write-Output ('ACS_MINERU_NAMED_VENV_CANDIDATES=' + $candidate.Count)
          Write-Output 'ACS_MINERU_LOCAL_MODEL_AND_PARSE=NOT_YET_VERIFIED'
          Write-Output 'ACS_DOCLING_NATIVE_PROTECTED_PRIOR_EVIDENCE=UNCHANGED'
          Write-Output 'ACS_DOCLING_NATIVE_NEW_PROVIDER_CALLS=0'
