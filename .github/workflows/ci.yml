name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: ai_cognitive_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d ai_cognitive_studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://app:app@localhost:5432/ai_cognitive_studio?schema=public
      DATABASE_URL_TEST: postgresql://app:app@localhost:5432/ai_cognitive_studio_test?schema=public
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: ai-cognitive-studio-dev
      S3_ACCESS_KEY: local-development-only
      S3_SECRET_KEY: local-development-only
      S3_FORCE_PATH_STYLE: "true"
      BETTER_AUTH_SECRET: phase7-ci-secret-must-be-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3001
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
        with:
          # The release gates record and verify the PR head, not GitHub's
          # ephemeral pull-request merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: REAL-BOOK-BENCHMARK-01A private import regressions (synthetic-only)
        run: python3 -m unittest discover -v -s tools/pdf-parser-benchmark/scripts -p 'test_import_private_real_books.py'
      - name: REAL-BOOK-BENCHMARK-01B synthetic page-subset regression
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps 'pypdf==5.9.0'
          python3 -m unittest discover -v -s tools/pdf-parser-benchmark/scripts -p 'test_make_real_page_subsets.py'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: REAL-BOOK-BENCHMARK-01A isolated TypeScript contract
        working-directory: tools/pdf-parser-benchmark
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/tsc --noEmit --project tsconfig.json
      - name: Start MinIO
        run: docker compose up -d minio
      - name: Initialize private MinIO bucket
        run: docker compose run --rm minio-init
      - name: Create isolated test database
        run: PGPASSWORD=app psql -h localhost -U app -d postgres -c 'CREATE DATABASE ai_cognitive_studio_test;'
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Apply test migration
        run: pnpm --filter @ai-cognitive/db prisma migrate deploy
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/ai_cognitive_studio_test?schema=public
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Install FFmpeg, FFprobe, and Redis CLI for media and Phase 6 processing
        run: sudo apt-get update && sudo apt-get install -y ffmpeg redis-tools
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:integration
      - name: Phase 8A provider gateway core (no external AI calls)
        run: pnpm test:phase8a
      - name: Phase 8B text provider adapters (no external AI calls)
        run: pnpm test:phase8b
      - name: Phase 8C embedding provider adapters (no external AI calls)
        run: pnpm test:phase8c
      - name: Phase 8C Book Intelligence gateway activation (no external AI calls)
        run: pnpm test:phase8c:book-intelligence
      - name: Phase 8C Book production Gateway composition (no external AI calls)
        run: pnpm test:phase8c:book-production
      - name: Phase 8C Podcast durable text Gateway activation (no external AI calls)
        run: pnpm test:phase8c:podcast-gateway
      - name: Phase 8C Podcast retrieval Gateway autonomy (no external AI calls)
        run: pnpm test:phase8c:podcast-autonomy
      - name: Phase 8C Podcast speech Gateway autonomy (no external AI calls)
        run: pnpm test:phase8c:podcast-speech-gateway
      - name: Phase 8C Short Video Gateway autonomy (no external AI calls)
        run: pnpm test:phase8c:short-video-gateway
      - name: Phase 1 real infrastructure ingestion
        run: pnpm test:phase1:e2e
      - name: Phase 2 book intelligence evaluation
        run: pnpm test:phase2:e2e
      - name: Phase 3 podcast generation
        run: pnpm test:phase3:e2e
      - name: Check FFmpeg and FFprobe
        run: ffmpeg -version && ffprobe -version
      - name: Phase 4 podcast audio generation
        run: pnpm test:phase4:e2e
      - name: Phase 5 short video generation
        run: pnpm test:phase5:e2e
      - name: Install Playwright browser
        run: pnpm --filter @ai-cognitive/web exec playwright install --with-deps chromium
      - name: Phase 6 browser product acceptance
        run: pnpm test:phase6:e2e
        env:
          POSTGRES_HOST_PORT: "5432"
      - name: Phase 7 auth/browser acceptance
        run: pnpm test:phase7:e2e
        env:
          POSTGRES_HOST_PORT: "5432"
      - name: Phase 9 full product release gate (real auth + workspace BYOK + no external AI calls)
        run: pnpm test:phase9:release
        env:
          POSTGRES_HOST_PORT: "5432"
      - name: Phase 10 Cognitive Unit product release gate (real auth + PostgreSQL + no external AI calls)
        run: pnpm test:phase10:release
        env:
          POSTGRES_HOST_PORT: "5432"
      - name: Phase 11 Thinking Session product release gate (real auth + PostgreSQL + fake Gateway)
        run: pnpm test:phase11:release
        env:
          POSTGRES_HOST_PORT: "5432"
      - name: Phase 12 Teach Back + Cognition Mastery product release gate (real auth + PostgreSQL + fake Gateway)
        run: pnpm test:phase12:release
        env:
          POSTGRES_HOST_PORT: "5432"
      - name: Phase 13 Personalized Cognition System product release gate (real auth + PostgreSQL + deterministic personalization)
        run: pnpm test:phase13:release
        env:
          POSTGRES_HOST_PORT: "5432"
      - name: Phase 14 Studio Product Experience release gate (real auth + PostgreSQL + no external AI calls)
        run: pnpm test:phase14:release
        env:
          POSTGRES_HOST_PORT: "5432"
      - name: Phase 15 Podcast Content Quality release gate (deterministic and no external AI calls)
        run: pnpm test:phase15:release
        env:
          POSTGRES_HOST_PORT: "5432"
      - name: Upload Phase 15 podcast quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase15-podcast-quality-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/phase15
          if-no-files-found: error
      - name: Phase 16 Performance & Cost Efficiency release gate
        run: pnpm test:phase16:release
        env:
          PHASE16_ARTIFACT_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Phase 17 Closed Beta core release gate
        run: pnpm test:phase17:release
        env:
          PHASE17_ARTIFACT_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Phase 18.1 source processing repair release gate
        run: pnpm test:phase18-1:release
        env:
          PHASE18_1_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PHASE18_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          POSTGRES_HOST_PORT: "5432"
      - name: Upload Phase 18.1 processing repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase18-1-release-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/phase18-1
          if-no-files-found: error
      - name: Upload Phase 18 production hardening evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase18-production-hardening-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/phase18
          if-no-files-found: error
      - name: Upload Phase 17 closed beta evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase17-closed-beta-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/phase17
          if-no-files-found: error
      - name: Upload Phase 16 performance and cost evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase16-performance-cost-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/phase16
          if-no-files-found: error
      - name: Upload Phase 14 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase14-visual-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/playwright/*.png
          if-no-files-found: error
      - name: Beta Provider UX real-flow release gate (no external AI calls)
        run: pnpm test:beta-repair:provider-ux:release
        env:
          POSTGRES_HOST_PORT: "5432"
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Build
        run: pnpm build
