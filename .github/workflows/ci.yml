  # Real PostgreSQL 17 + Redis 7 + MinIO + FFmpeg + Playwright Chromium.
  # ---------------------------------------------------------------------------
  stability-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: ai_cognitive_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d ai_cognitive_studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The release gates record and verify the PR head, not GitHub's
          # ephemeral pull-request merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact-head checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SHA}"
          echo "actual=${actual}"
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "::error::Checked-out HEAD ${actual} does not match expected exact head ${EXPECTED_SHA}"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
