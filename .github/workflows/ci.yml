        env:
          POSTGRES_HOST_PORT: "5432"
      - name: End-to-end tests
        run: pnpm test:e2e

  # ---------------------------------------------------------------------------
  # Final aggregator gate. Keeps the historical `validate` check name required
  # by branch protection, but no longer runs tests itself. Fail-closed: any
  # upstream domain that is not "success" (failed, cancelled or skipped)
  # fails this check.
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static, core-tests, product-acceptance, quality-performance, stability-beta]
    if: always()
    steps:
      - name: Verify all validation domains succeeded
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          CORE_TESTS_RESULT: ${{ needs.core-tests.result }}
          PRODUCT_ACCEPTANCE_RESULT: ${{ needs.product-acceptance.result }}
          QUALITY_PERFORMANCE_RESULT: ${{ needs.quality-performance.result }}
          STABILITY_BETA_RESULT: ${{ needs.stability-beta.result }}
        run: |
          echo "static:              ${STATIC_RESULT}"
          echo "core-tests:          ${CORE_TESTS_RESULT}"
          echo "product-acceptance:  ${PRODUCT_ACCEPTANCE_RESULT}"
          echo "quality-performance: ${QUALITY_PERFORMANCE_RESULT}"
          echo "stability-beta:      ${STABILITY_BETA_RESULT}"
          failed=0
          for result in "${STATIC_RESULT}" "${CORE_TESTS_RESULT}" "${PRODUCT_ACCEPTANCE_RESULT}" "${QUALITY_PERFORMANCE_RESULT}" "${STABILITY_BETA_RESULT}"; do
            if [ "${result}" != "success" ]; then
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "::error::One or more validation domains did not succeed (failed, cancelled, or skipped)."
            exit 1
          fi
          echo "All validation domains succeeded."

  # Official unified RapidOCR: isolated D drive Python, real-source inference offline.
  synthetic-b31-rapidocr:
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-b31-rapidocr-isolated-real-20261023' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned decoder only for synthetic tests
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==1.26.4 opencv-python-headless==4.10.0.84
      - name: Exact-head synthetic modern output and prior OCR probe regressions
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile tools/pdf-parser-benchmark/scripts/ebook_b31_rapidocr_isolated.py
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b31_rapidocr_isolated.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b31_offline_ocr.py' -v
          echo "ACS_B31_RAPIDOCR_SYNTHETIC=PASS"
          echo "ACS_B31_RAPIDOCR_NEW_PROVIDER_CALLS=0"

  owner-only-windows-b31-rapidocr:
    needs: synthetic-b31-rapidocr
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-b31-rapidocr-isolated-real-20261023' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout owner-only pinned benchmark code
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          persist-credentials: false
          clean: false
          ref: ${{ github.event.pull_request.head.sha }}
          path: acs-b31-rapidocr392

      - name: Install pinned pure-wheel OCR into NEW isolated D virtual environment
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C acs-b31-rapidocr392 rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'B31_RAPID_OCR_HEAD_MISMATCH' }
          $root='D:\ai-cognitive-pdf-benchmark-data'
          $bootstrap=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          $isolated=Join-Path $root 'tool-env\rapidocr-3.9.2-onnx-1.22.1'
          $python=Join-Path $isolated 'Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $bootstrap -PathType Leaf)) { throw 'B31_RAPID_OCR_BOOTSTRAP_PYTHON_MISSING' }
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
            & $bootstrap -m venv $isolated
            if ($LASTEXITCODE -ne 0) { throw 'B31_RAPID_OCR_ISOLATED_VENV_CREATION_FAILED' }
          }
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'B31_RAPID_OCR_ISOLATED_PYTHON_MISSING' }
          # Dependencies only: network may download wheels; original ebook is never sent.
          # Fresh venv has pip but NOT PySocks, so pip cannot initially use SOCKS.
          # Bootstrap ONLY PySocks from official TLS PyPI JSON and verify sha256.
          $env:PIP_INDEX_URL='https://pypi.org/simple'
          $env:PIP_DISABLE_PIP_VERSION_CHECK='1'
          $proxy='socks5h://127.0.0.1:10808'
          & $python -c "import socks"
          if ($LASTEXITCODE -ne 0) {
            $bootstrapJson=Join-Path $isolated 'pysocks-1.7.1-pypi.json'
            & curl.exe -fsSL --retry 2 --connect-timeout 25 --max-time 95 --proto '=https' --tlsv1.2 --proxy $proxy --output $bootstrapJson 'https://pypi.org/pypi/PySocks/1.7.1/json'
            if ($LASTEXITCODE -ne 0) { throw 'B31_RAPID_OCR_PYSOCKS_METADATA_FETCH_FAILED' }
            $metadata=Get-Content -LiteralPath $bootstrapJson -Raw | ConvertFrom-Json
            $wheel=@($metadata.urls | Where-Object { $_.filename -like '*.whl' -and $_.packagetype -eq 'bdist_wheel' })
            if ($wheel.Count -ne 1 -or $wheel[0].filename -ne 'PySocks-1.7.1-py3-none-any.whl') { throw 'B31_RAPID_OCR_PYSOCKS_WHEEL_IDENTITY_INVALID' }
            if ($wheel[0].url -notmatch '^https://files.pythonhosted.org/') { throw 'B31_RAPID_OCR_PYSOCKS_WHEEL_DOMAIN_INVALID' }
            $wheelPath=Join-Path $isolated $wheel[0].filename
            & curl.exe -fsSL --retry 2 --connect-timeout 25 --max-time 100 --proto '=https' --tlsv1.2 --proxy $proxy --output $wheelPath $wheel[0].url
            if ($LASTEXITCODE -ne 0) { throw 'B31_RAPID_OCR_PYSOCKS_WHEEL_FETCH_FAILED' }
            $got=(Get-FileHash -LiteralPath $wheelPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($got -ne $wheel[0].digests.sha256.ToLowerInvariant()) { throw 'B31_RAPID_OCR_PYSOCKS_SHA256_MISMATCH' }
            & $python -m pip install --no-index --no-deps --no-input $wheelPath
            if ($LASTEXITCODE -ne 0) { throw 'B31_RAPID_OCR_PYSOCKS_BOOTSTRAP_INSTALL_FAILED' }
          }
          & $python -c "import socks; assert hasattr(socks, 'socksocket')"
          if ($LASTEXITCODE -ne 0) { throw 'B31_RAPID_OCR_PYSOCKS_BOOTSTRAP_IMPORT_FAILED' }
          $env:HTTPS_PROXY=$proxy
          $env:HTTP_PROXY=$proxy
          $env:ALL_PROXY=$proxy
          & $python -m pip install --no-input --only-binary=:all: --retries 2 --timeout 35 "rapidocr==3.9.2" "onnxruntime==1.22.1" "numpy==1.26.4"
          if ($LASTEXITCODE -ne 0) { throw 'B31_RAPID_OCR_ISOLATED_WHEEL_INSTALL_FAILED' }
          & $python -c "from importlib.metadata import version; import cv2; assert version('rapidocr')=='3.9.2' and version('onnxruntime')=='1.22.1' and version('numpy')=='1.26.4'"
          if ($LASTEXITCODE -ne 0) { throw 'B31_RAPID_OCR_VERSION_PROBE_FAILED' }
          Write-Output 'ACS_B31_RAPIDOCR_ISOLATED_PACKAGES=READY'
          Write-Output 'ACS_B31_RAPIDOCR_SOURCE_DATA_SENT_TO_INSTALLER=NONE'

      - name: Offline OCR B31 raw image, immutable private receipt and historical SHA
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C acs-b31-rapidocr392 rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'B31_RAPID_OCR_HEAD_CHANGED' }
          $root='D:\ai-cognitive-pdf-benchmark-data'
          $python=Join-Path $root 'tool-env\rapidocr-3.9.2-onnx-1.22.1\Scripts\python.exe'
          $folder=Join-Path $root 'semantic_gate'
          $output=Join-Path $folder 'b31_source_rapidocr392.private.json'
          $already=Test-Path -LiteralPath $output
          $protected=@(
            (Join-Path $folder 'b31_source_only_page126.private.png'),
            (Join-Path $folder 'b31_source_only_page126.private.json'),
            (Join-Path $folder 'b31_source_raster_geometry.private.json'),
            (Join-Path $folder 'b31_opencv_source_candidates.private.json'),
            (Join-Path $folder 'b31_arrow_shaft_consensus.private.json'),
            (Join-Path $folder 'b31_multiscale_vtip_source.private.json'),
            (Join-Path $folder 'b31_multiscale_vtip_review.private.png'),
            (Join-Path $folder 'b31_vtip_clutter_triage.private.json'),
            (Join-Path $folder 'b31_vtip_contact_sheet.private.png'),
            (Join-Path $folder 'b31_vtip_wing_continuity.private.json'),
            (Join-Path $folder 'b31_pixel_topology_review.private.json'),
            (Join-Path $folder 'b31_source_offline_ocr.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B15.request.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B31.request.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B31.reply.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B31.candidate.private.json')
          )
          $before=@{}
          foreach ($p in $protected) {
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw 'B31_RAPID_OCR_HISTORIC_SOURCE_MISSING' }
            $before[$p]=(Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash
          }
          # Recognition is strictly local, including first-time model initialization.
          $env:HTTP_PROXY='http://127.0.0.1:1'
          $env:HTTPS_PROXY='http://127.0.0.1:1'
          $env:ALL_PROXY='http://127.0.0.1:1'
          $env:NO_PROXY=''
          $env:HF_HUB_OFFLINE='1'
          $env:TRANSFORMERS_OFFLINE='1'
          $script='acs-b31-rapidocr392/tools/pdf-parser-benchmark/scripts/ebook_b31_rapidocr_isolated.py'
          $manifest='acs-b31-rapidocr392/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          if ($already) {
            & $python $script --private-root $root --manifest $manifest --audit-only
            if ($LASTEXITCODE -ne 0) { throw 'B31_RAPID_OCR_EXISTING_RECEIPT_INVALID' }
          } else {
            & $python $script --private-root $root --manifest $manifest
            if ($LASTEXITCODE -ne 0) { throw 'B31_RAPID_OCR_READONLY_INFERENCE_FAILED' }
            if (Test-Path -LiteralPath $output) { throw 'B31_RAPID_OCR_READONLY_CREATED_OUTPUT' }
            & $python $script --private-root $root --manifest $manifest --write
            if ($LASTEXITCODE -ne 0) { throw 'B31_RAPID_OCR_PRIVATE_WRITE_FAILED' }
            & $python $script --private-root $root --manifest $manifest --audit-only
            if ($LASTEXITCODE -ne 0) { throw 'B31_RAPID_OCR_POSTWRITE_PROVENANCE_INVALID' }
          }
          foreach ($p in $protected) {
            if ((Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash -ne $before[$p]) { throw 'B31_RAPID_OCR_PROTECTED_FILE_MUTATED' }
          }
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw 'B31_RAPID_OCR_RESULT_MISSING' }
          Write-Output 'ACS_B31_RAPIDOCR_PRIVATE_RECEIPT=VERIFIED'
          Write-Output 'ACS_B31_RAPIDOCR_GRAPH_GOLD=UNVERIFIED'
          Write-Output 'ACS_B31_RAPIDOCR_PROVIDER_CALLS=0'
