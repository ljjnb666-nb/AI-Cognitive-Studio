        env:
          POSTGRES_HOST_PORT: "5432"
      - name: End-to-end tests
        run: pnpm test:e2e

  # ---------------------------------------------------------------------------
  # Final aggregator gate. Keeps the historical `validate` check name required
  # by branch protection, but no longer runs tests itself. Fail-closed: any
  # upstream domain that is not "success" (failed, cancelled or skipped)
  # fails this check.
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static, core-tests, product-acceptance, quality-performance, stability-beta, synthetic-fivebook-reference-snapshot-chain, synthetic-b15-disagreement-triage, owner-only-windows-b15-disagreement-triage]
    if: always()
    steps:
      - name: Verify all validation domains succeeded
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          CORE_TESTS_RESULT: ${{ needs.core-tests.result }}
          PRODUCT_ACCEPTANCE_RESULT: ${{ needs.product-acceptance.result }}
          QUALITY_PERFORMANCE_RESULT: ${{ needs.quality-performance.result }}
          STABILITY_BETA_RESULT: ${{ needs.stability-beta.result }}
          SNAPSHOT_SYNTHETIC_RESULT: ${{ needs.synthetic-fivebook-reference-snapshot-chain.result }}
          REQUIRE_SNAPSHOT_SYNTHETIC: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'bench/ebook-fivebook-reference-snapshots-v2-20261024' }}
          B15_SYNTHETIC_RESULT: ${{ needs.synthetic-b15-disagreement-triage.result }}
          B15_WINDOWS_RESULT: ${{ needs.owner-only-windows-b15-disagreement-triage.result }}
          REQUIRE_B15_TRIAGE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'bench/ebook-b15-private-disagreement-triage-20261024' }}
        run: |
          echo "static:              ${STATIC_RESULT}"
          echo "core-tests:          ${CORE_TESTS_RESULT}"
          echo "product-acceptance:  ${PRODUCT_ACCEPTANCE_RESULT}"
          echo "quality-performance: ${QUALITY_PERFORMANCE_RESULT}"
          echo "stability-beta:      ${STABILITY_BETA_RESULT}"
          if [ "${REQUIRE_SNAPSHOT_SYNTHETIC}" = "true" ]; then
            echo "fivebook-snapshot:   ${SNAPSHOT_SYNTHETIC_RESULT}"
          fi
          failed=0
          for result in "${STATIC_RESULT}" "${CORE_TESTS_RESULT}" "${PRODUCT_ACCEPTANCE_RESULT}" "${QUALITY_PERFORMANCE_RESULT}" "${STABILITY_BETA_RESULT}"; do
            if [ "${result}" != "success" ]; then
              failed=1
            fi
          done
          if [ "${REQUIRE_SNAPSHOT_SYNTHETIC}" = "true" ] && [ "${SNAPSHOT_SYNTHETIC_RESULT}" != "success" ]; then
            echo "::error::Snapshot-chain synthetic gate failed, cancelled, or skipped."
            failed=1
          fi
          if [ "${REQUIRE_B15_TRIAGE}" = "true" ]; then
            echo "b15-synthetic: ${B15_SYNTHETIC_RESULT}"
            echo "b15-windows:   ${B15_WINDOWS_RESULT}"
            if [ "${B15_SYNTHETIC_RESULT}" != "success" ] || [ "${B15_WINDOWS_RESULT}" != "success" ]; then
              echo "::error::B15 private diagnosis was not successfully validated."
              failed=1
            fi
          fi
          if [ "${failed}" -ne 0 ]; then
            echo "::error::One or more validation domains did not succeed (failed, cancelled, or skipped)."
            exit 1
          fi
          echo "All validation domains succeeded."

  # Five-book independent reference admission; no inference or automatic gold.
  synthetic-fivebook-reference-gate:
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-fivebook-independent-reference-gate-20261024' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only bounded synthetic-PDF fixtures, no model downloads
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: pymupdf==1.26.5 numpy==1.26.4 opencv-python-headless==4.10.0.84
      - name: Exact SHA independent-reference tests and unchanged five-book comparators
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile tools/pdf-parser-benchmark/scripts/ebook_fivebook_reference_gate.py
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_fivebook_reference_gate.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_fivebook_text_consensus.py' -v
          echo 'ACS_FIVEBOOK_REFERENCE_GATE_SYNTHETIC=PASS'
          echo 'ACS_FIVEBOOK_REFERENCE_NEW_MODEL_CALLS=0'

  owner-only-windows-fivebook-reference-gate:
    needs: synthetic-fivebook-reference-gate
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-fivebook-independent-reference-gate-20261024' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - name: Checkout exact owner head without private books or credentials
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: acs-fivebook-reference
          persist-credentials: false
          clean: false
      - name: Private independent-reference eligibility and conditional CER
        shell: powershell
        timeout-minutes: 19
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C acs-fivebook-reference rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'REFERENCE_GATE_EXACT_HEAD_MISMATCH' }
          $root='D:\ai-cognitive-pdf-benchmark-data'
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'REFERENCE_GATE_HISTORICAL_PYTHON_MISSING' }
          $folder=Join-Path $root 'semantic_gate\multibook_matrix_20261023'
          $report=Join-Path $folder 'fivebook_independent_reference_admission.private.json'
          $protected=@(
            (Join-Path $folder 'fivebook_mineru_rapidocr_comparison.private.json'),
            (Join-Path $folder 'multibook_native_24pages.private.json'),
            (Join-Path $folder 'multibook_rapidocr_five_pages.private.json'),
            (Join-Path $folder 'multibook_docling_native_24pages.private.json'),
            (Join-Path $folder 'b31_mineru403_basic_onnx_stateless.private.md'),
            (Join-Path $folder 'b31_mineru403_basic_onnx_stateless.private.log'),
            (Join-Path $folder 'b31_mineru403_basic_onnx_stateless.private.json'),
            (Join-Path $folder 'b31_mineru403_basic_markdown_structure.private.json'),
            (Join-Path $folder 'b31_mineru403_flash_execution.private.log'),
            (Join-Path $folder 'b31_mineru403_flash_execution.v2.private.log'),
            (Join-Path $folder 'b31_mineru403_failure_triage.private.json'),
            (Join-Path $root 'semantic_gate\b31_source_only_page126.private.png'),
            (Join-Path $root 'semantic_gate\b31_source_rapidocr392.private.json'),
            (Join-Path $root 'semantic_gate\visual_graph_proposal_B31.reply.private.json')
          )
          foreach ($book in @('B03','B08','B15','B29')) {
            foreach ($extension in @('md','log','json')) {
              $protected+=Join-Path $folder ("fivebook_mineru_basic_"+$book+".private."+$extension)
            }
          }
          $protected+=@(Get-ChildItem -LiteralPath (Join-Path $folder 'docling_native_single_pages') -Filter '*.private.pdf' -File | Select-Object -ExpandProperty FullName)
          $protected+=@(Get-ChildItem -LiteralPath $folder -Filter '*.private.png' -File | Select-Object -ExpandProperty FullName)
          $prior=@{}
          foreach ($item in $protected) {
            if (-not (Test-Path -LiteralPath $item -PathType Leaf)) { throw 'REFERENCE_GATE_PREVIOUS_EVIDENCE_MISSING' }
            $prior[$item]=(Get-FileHash -LiteralPath $item -Algorithm SHA256).Hash
          }
          $env:HTTP_PROXY='http://127.0.0.1:1'
          $env:HTTPS_PROXY='http://127.0.0.1:1'
          $env:ALL_PROXY='http://127.0.0.1:1'
          $env:NO_PROXY=''
          $script='acs-fivebook-reference/tools/pdf-parser-benchmark/scripts/ebook_fivebook_reference_gate.py'
          $manifest='acs-fivebook-reference/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          if (Test-Path -LiteralPath $report -PathType Leaf) {
            & $python $script --private-root $root --manifest $manifest --audit-only
            if ($LASTEXITCODE -ne 0) { throw 'REFERENCE_GATE_EXISTING_PRIVATE_REPORT_INVALID' }
          } else {
            & $python $script --private-root $root --manifest $manifest
            if ($LASTEXITCODE -ne 0) { throw 'REFERENCE_GATE_PRIVATE_SOURCE_CHECK_FAILED' }
            & $python $script --private-root $root --manifest $manifest --write
            if ($LASTEXITCODE -ne 0) { throw 'REFERENCE_GATE_PRIVATE_CREATE_FAILED' }
            & $python $script --private-root $root --manifest $manifest --audit-only
            if ($LASTEXITCODE -ne 0) { throw 'REFERENCE_GATE_INDEPENDENT_RECHECK_FAILED' }
          }
          foreach ($item in $protected) {
            if ((Get-FileHash -LiteralPath $item -Algorithm SHA256).Hash -ne $prior[$item]) { throw 'REFERENCE_GATE_HISTORICAL_PROOF_CHANGED' }
          }
          Write-Output 'ACS_REFERENCE_GATE_PRIOR_PRIVATE_INPUTS=UNCHANGED'
          Write-Output 'ACS_REFERENCE_GATE_NO_AUTOMATIC_OCR_GOLD=TRUE'
          Write-Output 'ACS_REFERENCE_GATE_NEW_PAID_PROVIDER_CALLS=0'

  # Versioned reference snapshots are synthetic-only until an attested v2
  # reference exists. Do not create an empty v2 private receipt from CI.
  synthetic-fivebook-reference-snapshot-chain:
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-fivebook-reference-snapshots-v2-20261024' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only bounded synthetic-PDF fixtures, no model downloads
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: pymupdf==1.26.5 numpy==1.26.4 opencv-python-headless==4.10.0.84
      - name: Exact SHA immutable v1/v2 predecessor chain and reference-directory separation
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile tools/pdf-parser-benchmark/scripts/ebook_fivebook_reference_gate.py
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_fivebook_reference_gate.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_fivebook_text_consensus.py' -v
          echo 'ACS_FIVEBOOK_REFERENCE_SNAPSHOTS_SYNTHETIC=PASS'
          echo 'ACS_REFERENCE_SNAPSHOT_NEW_MODEL_CALLS=0'

  synthetic-b15-disagreement-triage:
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-b15-private-disagreement-triage-20261024' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only bounded synthetic dependencies
        run: python -m pip install --disable-pip-version-check --only-binary=:all: pymupdf==1.26.5 numpy==1.26.4 opencv-python-headless==4.10.0.84
      - name: B15 exact SHA synthetic regression
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile tools/pdf-parser-benchmark/scripts/ebook_b15_disagreement_triage.py
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b15_disagreement_triage.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_fivebook_text_consensus.py' -v
          echo 'ACS_B15_TRIAGE_SYNTHETIC=PASS'
          echo 'ACS_B15_TRIAGE_NEW_MODEL_CALLS=0'

  owner-only-windows-b15-disagreement-triage:
    needs: synthetic-b15-disagreement-triage
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-b15-private-disagreement-triage-20261024' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: acs-b15-diagnosis
          persist-credentials: false
          clean: false
      - name: Private source-only B15 diagnosis and immutable upstream verification
        shell: powershell
        timeout-minutes: 19
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C acs-b15-diagnosis rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'B15_TRIAGE_HEAD_MISMATCH' }
          $root='D:\ai-cognitive-pdf-benchmark-data'
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'B15_LOCAL_PYTHON_MISSING' }
          $folder=Join-Path $root 'semantic_gate\multibook_matrix_20261023'
          $output=Join-Path $folder 'b15_samepage_ocr_disagreement_triage.private.json'
          $sources=@('fivebook_rapidocr_mineru_text_consensus.private.json','fivebook_mineru_rapidocr_comparison.private.json','multibook_rapidocr_five_pages.private.json','fivebook_mineru_basic_B15.private.md','fivebook_mineru_basic_B15.private.json','fivebook_mineru_basic_B15.private.log')
          $before=@{}
          foreach ($name in $sources) {
            $file=Join-Path $folder $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw 'B15_PROTECTED_SOURCE_MISSING' }
            $before[$file]=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
          }
          $env:HTTP_PROXY='http://127.0.0.1:1'
          $env:HTTPS_PROXY='http://127.0.0.1:1'
          $env:ALL_PROXY='http://127.0.0.1:1'
          $env:NO_PROXY=''
          $script='acs-b15-diagnosis/tools/pdf-parser-benchmark/scripts/ebook_b15_disagreement_triage.py'
          $manifest='acs-b15-diagnosis/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          if (Test-Path -LiteralPath $output -PathType Leaf) {
            & $python $script --private-root $root --manifest $manifest --audit-only
            if ($LASTEXITCODE -ne 0) { throw 'B15_EXISTING_PRIVATE_RECEIPT_INVALID' }
          } else {
            & $python $script --private-root $root --manifest $manifest
            if ($LASTEXITCODE -ne 0) { throw 'B15_SOURCE_PREFLIGHT_FAILED' }
            & $python $script --private-root $root --manifest $manifest --write
            if ($LASTEXITCODE -ne 0) { throw 'B15_CREATE_PRIVATE_RECEIPT_FAILED' }
            & $python $script --private-root $root --manifest $manifest --audit-only
            if ($LASTEXITCODE -ne 0) { throw 'B15_PRIVATE_REAUDIT_FAILED' }
          }
          foreach ($name in $sources) {
            $file=Join-Path $folder $name
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $before[$file]) { throw 'B15_HISTORICAL_SOURCE_CHANGED' }
          }
          Write-Output 'ACS_B15_TRIAGE_PRIVATE_INPUTS=UNCHANGED'
          Write-Output 'ACS_B15_TRIAGE_OCR_GOLD=UNVERIFIED'
          Write-Output 'ACS_B15_TRIAGE_PAID_MODEL_CALLS=0'

