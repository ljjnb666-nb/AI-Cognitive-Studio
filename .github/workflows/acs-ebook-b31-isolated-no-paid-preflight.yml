name: ACS Ebook B31 Isolated No-Paid Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/acs-ebook-b31-isolated-no-paid-preflight.yml"
      - "tools/pdf-parser-benchmark/scripts/ebook_private_visual_graph_proposal.py"
      - "tools/pdf-parser-benchmark/tests/test_ebook_private_visual_graph_proposal.py"
      - "tools/pdf-parser-benchmark/docs/BOOK_B31_ISOLATED_PREFLIGHT_20261023.md"

permissions:
  contents: read

concurrency:
  group: acs-ebook-b31-isolated-no-paid
  cancel-in-progress: false

jobs:
  synthetic-b31-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact HEAD, isolated target and no-write guard
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile tools/pdf-parser-benchmark/scripts/ebook_private_visual_graph_proposal.py
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_private_visual_graph_proposal.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_private_graph_reply_recovery.py' -v
          echo "ACS_B31_ISOLATION_SYNTHETIC=PASS"
          echo "ACS_B31_MODEL_PROVIDER_REQUESTS=0"

  real-windows-b31-readonly:
    needs: synthetic-b31-isolation
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-b31-isolated-no-paid-preflight-20261023' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Checkout exact same-repo owner SHA without secrets
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          persist-credentials: false
          clean: false
          path: acs-b31-isolated-readonly
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compare existing ledger, B31 SHA-pinned private source and no mutation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C acs-b31-isolated-readonly rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'ACS_B31_EXACT_HEAD_MISMATCH' }
          $root='D:\ai-cognitive-pdf-benchmark-data'
          if (-not (Test-Path -LiteralPath $root -PathType Container)) { throw 'ACS_B31_PRIVATE_CORPUS_MISSING' }
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'ACS_B31_PRIVATE_PYTHON_MISSING' }
          $marker=Join-Path $root 'semantic_gate\visual_graph_proposal_B15.request.private.json'
          if (-not (Test-Path -LiteralPath $marker -PathType Leaf)) { throw 'ACS_B31_UPSTREAM_B15_MARKER_MISSING' }
          $b15Before=(Get-FileHash -LiteralPath $marker -Algorithm SHA256).Hash
          $b31Files=@(('request','reply','candidate') | ForEach-Object { Join-Path $root ('semantic_gate\visual_graph_proposal_B31.'+$_+'.private.json') })
          foreach ($file in $b31Files) {
            if (Test-Path -LiteralPath $file) { throw 'ACS_B31_TARGET_ALREADY_STARTED_STOP' }
          }
          $manifest='acs-b31-isolated-readonly/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          $audit='acs-b31-isolated-readonly/tools/pdf-parser-benchmark/scripts/ebook_private_graph_receipt_audit.py'
          & $python $audit --private-root $root --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw 'ACS_B31_PRIVATE_LEDGER_AUDIT_FAILED' }
          $script='acs-b31-isolated-readonly/tools/pdf-parser-benchmark/scripts/ebook_private_visual_graph_proposal.py'
          & $python $script --root $root --manifest $manifest --book B31 --preflight-only
          if ($LASTEXITCODE -ne 0) { throw 'ACS_B31_ISOLATED_READONLY_PREFLIGHT_FAILED' }
          if ((Get-FileHash -LiteralPath $marker -Algorithm SHA256).Hash -ne $b15Before) { throw 'ACS_B31_B15_MARKER_MODIFIED' }
          foreach ($file in $b31Files) {
            if (Test-Path -LiteralPath $file) { throw 'ACS_B31_READONLY_CREATED_LEDGER_RECORD' }
          }
          Write-Output 'ACS_B31_REAL_PRIVATE_SOURCE_AND_LEDGER=READY_NO_PROVIDER_CALL'
          Write-Output 'ACS_B15_LEGACY_QUARANTINE=UNTOUCHED'
          Write-Output 'ACS_B31_GRAPH_SEMANTICS=UNVERIFIED'
