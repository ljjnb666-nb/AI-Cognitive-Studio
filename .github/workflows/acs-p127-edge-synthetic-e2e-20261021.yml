          Write-Output 'ACS_P127_EDGE_SOURCE_BLOBS_VERIFIED=true'
      - name: Run isolated real Microsoft Edge headless UI acceptance
        shell: powershell
        env:
          NODE_OPTIONS: '--no-warnings'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('acs-p127-edge-smoke-'+$env:GITHUB_RUN_ID)
          $node=(Get-Command node -ErrorAction Stop).Source
          $paths=@("${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe","${env:ProgramFiles}\Microsoft\Edge\Application\msedge.exe","${env:LOCALAPPDATA}\Microsoft\Edge\Application\msedge.exe")
          $edge=@($paths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1)
          if ($edge.Count -ne 1) {throw 'EDGE_BINARY_NOT_AVAILABLE'}
          $os=Get-CimInstance Win32_OperatingSystem -ErrorAction Stop
          if ([double]$os.FreePhysicalMemory -lt 1572864) {throw 'EDGE_MEMORY_GUARD_BLOCKED'}
          & $node (Join-Path $dir 'scripts\edge_p127_smoke.mjs') ('--edge='+$edge[0])
          if ($LASTEXITCODE -ne 0) {throw 'EDGE_SYNTHETIC_ACCEPTANCE_FAILED'}
          Write-Output 'ACS_P127_EDGE_REAL_BINARY_SYNTHETIC_GATE_PASS'
