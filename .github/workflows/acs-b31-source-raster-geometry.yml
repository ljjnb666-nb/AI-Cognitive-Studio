name: ACS B31 Raster Source Geometry Independent No-Model Gate

on:
  pull_request:
    paths:
      - ".github/workflows/acs-b31-source-raster-geometry.yml"
      - "tools/pdf-parser-benchmark/scripts/ebook_b31_source_raster_geometry.py"
      - "tools/pdf-parser-benchmark/tests/test_ebook_b31_source_raster_geometry.py"
      - "tools/pdf-parser-benchmark/docs/BOOK_B31_SOURCE_RASTER_GEOMETRY_20261023.md"

permissions:
  contents: read

concurrency:
  group: acs-b31-source-raster-geometry
  cancel-in-progress: false

jobs:
  synthetic-raster-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact-head deterministic pixels + SHA private boundary regression
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python -m py_compile tools/pdf-parser-benchmark/scripts/ebook_b31_source_raster_geometry.py
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b31_source_raster_geometry.py' -v
          python -m unittest discover -s tools/pdf-parser-benchmark/tests -p 'test_ebook_b31_independent_source_packet.py' -v
          echo "ACS_B31_RASTER_SOURCE_SYNTHETIC=PASS"
          echo "ACS_B31_RASTER_SOURCE_NEW_PROVIDER_CALLS=0"

  windows-private-source-raster:
    needs: synthetic-raster-source-only
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ljjnb666-nb/AI-Cognitive-Studio' && github.actor == 'ljjnb666-nb' && github.event.pull_request.user.login == 'ljjnb666-nb' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'bench/ebook-b31-source-raster-geometry-20261023' }}
    runs-on: [self-hosted, Windows, X64, acs-pdf-local]
    timeout-minutes: 12
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Checkout owner-only exact SHA without model credentials
        uses: actions/checkout@v4
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: http.proxy
          GIT_CONFIG_VALUE_0: socks5h://127.0.0.1:10808
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: false
          persist-credentials: false
          path: acs-b31-source-raster
      - name: Read actual B31 original pixels without GLM candidate or HTTP
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ((git -C acs-b31-source-raster rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'B31_RASTER_EXACT_HEAD_MISMATCH' }
          $root='D:\ai-cognitive-pdf-benchmark-data'
          if (-not (Test-Path -LiteralPath $root -PathType Container)) { throw 'B31_RASTER_PRIVATE_ROOT_MISSING' }
          $python=Join-Path $root 'tool-env\docling-2.141.0\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'B31_RASTER_CACHED_PYTHON_MISSING' }
          $folder=Join-Path $root 'semantic_gate'
          $source=Join-Path $folder 'b31_source_only_page126.private.png'
          $meta=Join-Path $folder 'b31_source_only_page126.private.json'
          $out=Join-Path $folder 'b31_source_raster_geometry.private.json'
          if (Test-Path -LiteralPath $out) { throw 'B31_RASTER_EXISTING_REPORT_MUST_NOT_OVERWRITE' }
          $protected=@(
            $source, $meta,
            (Join-Path $folder 'visual_graph_proposal_B15.request.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B31.request.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B31.reply.private.json'),
            (Join-Path $folder 'visual_graph_proposal_B31.candidate.private.json')
          )
          $before=@{}
          foreach ($file in $protected) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw 'B31_RASTER_EVIDENCE_MISSING' }
            $before[$file]=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
          }
          $script='acs-b31-source-raster/tools/pdf-parser-benchmark/scripts/ebook_b31_source_raster_geometry.py'
          $manifest='acs-b31-source-raster/tools/pdf-parser-benchmark/corpus/ebook-20261022.manifest.json'
          & $python $script --private-root $root --manifest $manifest
          if ($LASTEXITCODE -ne 0) { throw 'B31_RASTER_READONLY_PREVIEW_FAILED' }
          if (Test-Path -LiteralPath $out) { throw 'B31_RASTER_PREVIEW_MUTATED_REPORT' }
          & $python $script --private-root $root --manifest $manifest --write
          if ($LASTEXITCODE -ne 0) { throw 'B31_RASTER_PRIVATE_SAVE_FAILED' }
          foreach ($file in $protected) {
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $before[$file]) { throw 'B31_RASTER_PROTECTED_EVIDENCE_CHANGED' }
          }
          if (-not (Test-Path -LiteralPath $out -PathType Leaf)) { throw 'B31_RASTER_REPORT_NOT_CREATED' }
          Write-Output 'ACS_B31_RASTER_SOURCE_ONLY=PRIVATE_REPORT_CREATED'
          Write-Output 'ACS_B31_GRAPH_GOLD=UNVERIFIED'
          Write-Output 'ACS_B31_ARROW_DIRECTION=UNVERIFIED'
          Write-Output 'ACS_B31_PROVIDER_REQUESTS=0'
